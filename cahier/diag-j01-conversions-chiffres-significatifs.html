  .choix-msg{font-size:.9rem;color:var(--encre);background:rgba(63,167,214,.08);border-left:3px solid var(--cyan);padding:.6rem .9rem;margin-bottom:.8rem}
  details.media{border:1px solid var(--ligne);margin-bottom:.6rem;background:rgba(0,0,0,.012)}
  details.media>summary{list-style:none;cursor:pointer;padding:.7rem .9rem;font-family:'IBM Plex Mono',monospace;font-size:.85rem;display:flex;gap:.5rem;align-items:center}

  details.media>summary::before{content:"▸";color:var(--orange)}
  details.media[open]>summary::before{content:"▾"}

  .chk-fait input{width:15px;height:15px;accent-color:var(--vert);flex:0 0 auto}
  .fait-mark{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--vert)}

  #prog-bar{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;padding:9px 8px;background:rgba(255,255,255,.92);border:1px solid var(--ligne);border-radius:10px}

  #prog-bar .pb-pct{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;color:var(--encre)}

  #prog-bar .pb-cell{position:relative;overflow:hidden;flex:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;border:1px solid var(--ligne);color:var(--gris)}
  #prog-bar .pb-cell.done{border-color:var(--vert);color:var(--vert)}
  #prog-bar .pb-cell.prog{border:1.6px dashed var(--ambre);color:var(--ambre)}
  #prog-bar .pb-cell.none{border:1px solid var(--ligne);color:var(--gris)}
  #prog-bar .pb-cell.revoir{border:1.6px solid var(--ambre);color:var(--ambre)}

  #prog-bar .pb-cell[data-diag] .pb-lab{font-size:.5rem;letter-spacing:-.01em}
  .review-note{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--gris);margin:.6rem 0 0}
  @media (max-width:720px){ #prog-bar{right:6px;width:58px;padding:7px 6px} #prog-bar .pb-seg{width:22px;height:150px} #prog-bar .pb-title{font-size:.5rem} }

  .btn-egg{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.92rem;text-decoration:none;color:#fff;background:var(--orange);border-radius:10px;padding:.6rem 1.1rem;white-space:nowrap;box-shadow:0 4px 14px rgba(232,116,59,.3);transition:transform .12s}

  /* --- Jour 1 : encarts de cours (Bloc B) --- */
  .cours-encart{border:1px solid var(--ligne);border-left:4px solid var(--orange);background:var(--carte);padding:1.05rem 1.15rem;margin:0 0 .9rem;border-radius:6px}

  .ce-formule{font-family:'IBM Plex Mono',monospace;font-size:1.4rem;text-align:center;color:var(--nuit);background:rgba(232,116,59,.08);border:1px dashed var(--orange);border-radius:6px;padding:.55rem;margin:.4rem 0 .75rem}
  .ce-formule sup{font-size:.7em}

  .ce-ops{display:flex;flex-direction:column;gap:.5rem;margin:.55rem 0}
  .ce-op{background:rgba(0,0,0,.025);border:1px solid var(--ligne);border-radius:6px;padding:.55rem .8rem;font-size:.93rem}
  .ce-op b{font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);display:block;margin-bottom:.22rem}
  .ce-warn{background:rgba(214,64,43,.06);border-left:3px solid var(--rouge);border-radius:0 6px 6px 0;padding:.55rem .85rem;font-size:.9rem;margin-top:.55rem}
  .ce-warn b{color:var(--rouge)}
  .ce-fin{font-size:.88rem;color:var(--gris);margin:0}
  /* --- Jour 1 : activites conditionnelles (Bloc A) --- */
  .activites{display:flex;flex-direction:column;gap:.6rem}
  .activite{border:1px solid var(--ligne);border-radius:6px;background:var(--carte);padding:.75rem .95rem;display:flex;flex-wrap:wrap;gap:.55rem .9rem;align-items:center}
  .act-nom{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:.98rem;flex:1 1 150px}
  .act-lien{font-family:'IBM Plex Mono',monospace;font-size:.8rem;text-decoration:none;color:#fff;background:var(--orange);padding:.4rem .8rem;border-radius:6px;white-space:nowrap}

  /* --- Jour 1 : mise en forme des exercices --- */
  .exo-img{margin:.5rem 0 .7rem;text-align:center}

<script>
/* ============================================================

const NOTION = {
  titre: "Jour 1 — Conversions, chiffres significatifs & ordres de grandeur",
  axes: [
    {
      id:"A", nom:"Conversions", type:"activites",
      pourquoi:"Les conversions d'unités et les puissances de dix reviennent dans tous les calculs de 1re spé (concentrations, énergies, longueurs d'onde…). Les automatiser maintenant évite des erreurs qui coûtent cher.",
      videos:[
        {id:"Wd-tGvyKlTs", titre:"Convertir des volumes avec un tableau de conversion"},
        {id:"0chMr8GB_PQ", titre:"Conversions plus complexes : multiples et sous-multiples"},
        {id:"PUrZaMhtjyE", titre:"Convertir avec les puissances de 10 (milli, kilo, méga…)"}
      ],
      activites:{
        rouge:[ {url:"https://wordwall.net/fr/resource/99347520", label:"Entraînement 1"},
                {url:"https://wordwall.net/fr/resource/99347576", label:"Entraînement 2"} ],

      },
      questions:[
        { q:"Convertir 250 mL en L :",
          opts:["25,0 L","0,250 L","0,250 mL","2,50 L"], bonne:1,
          siFaux:`Pour passer des millilitres aux litres, on divise par 1000 (1 L = 1000 mL). Ici 250 mL = 250 ÷ 1000 = 0,250 L, en conservant les trois chiffres significatifs : <strong>0,250 L</strong>. Attention à l'unité : 0,250 mL serait mille fois trop petit.`,
          siJuste:`250 mL = 0,250 L : on divise par 1000 et on garde les trois chiffres significatifs.` },
        { q:"Un volume d'eau de 0,0500 L correspond, avec le bon nombre de chiffres significatifs, à :",
          opts:["500 mL","50 mL","50,0 mL","0,500 mL"], bonne:2,
          siFaux:`Pour passer des litres aux millilitres, on multiplie par 1000. Ici 0,0500 L × 1000 = 50,0 mL. Les trois chiffres significatifs de 0,0500 sont conservés : <strong>50,0 mL</strong>.`,
          siJuste:`0,0500 L = 50,0 mL : on multiplie par 1000 en gardant les trois chiffres significatifs.` },
        { q:"Convertir 7,20×10⁻⁷ m en nm :",
          opts:["7,20 nm","720 nm","72 000 nm","0,0072 nm"], bonne:1,
          siFaux:`Un nanomètre vaut 10⁻⁹ m. On divise donc la longueur par 10⁻⁹ : 7,20×10⁻⁷ ÷ 10⁻⁹ = 7,20×10² = <strong>720 nm</strong>.`,

        { q:"Convertir 5 250 000 N en GN :",
          opts:["0,525 GN","5 250 GN","5,25 GN","0,00525 GN"], bonne:3,
          siFaux:`Un giganewton vaut 10⁹ N. On écrit d'abord 5 250 000 N = 5,25×10⁶ N, puis on divise par 10⁹ : 5,25×10⁶ ÷ 10⁹ = 5,25×10⁻³ = <strong>0,00525 GN</strong>.`,

const app = document.getElementById("app");
const LETTRES = ["A","B","C","D","E"];
const FLAT = [];
NOTION.axes.forEach((axe,ai)=> axe.questions.forEach(qu=> FLAT.push({...qu, ai})));

let idx = 0, choisi = null, valide = false;
const fautes = NOTION.axes.map(()=>0);
let answers = [];

function feedbackHTML(item, ok){
  return `<div class="feedback ${ok?'ok':'ko'}">
        <span class="res">${ok ? 'Bonne réponse' : 'Réponse incorrecte'}</span>
        <p>${ok ? item.siJuste : item.siFaux}</p>
        ${item.imgR ? `<div class="illus">${item.imgR}</div>` : ""}
      </div>`;
}
function finDiagnostic(){ freshProg(fautes, true); ecranResultats(false); }
function passerDiagnostic(){
  if(!confirm("Passer le diagnostic ?\n\nLes questions sans réponse seront comptées comme fausses et ton plan de révision sera généré tel quel.")) return;
  for(let i=answers.length; i<FLAT.length; i++){ fautes[FLAT[i].ai]++; }
  freshProg(fautes, false);
  ecranResultats(false);
}

const STORE_KEY = "cahier-j01";
let PROG = (function(){ try{ const r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } })();
function saveProg(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(PROG)); }catch(e){} }
/* Au re-diagnostic, on préserve le travail déjà fait :
   - cases « lu / vu » de tous les blocs ;
   - exercices cochés des blocs de type "cours" (leur liste est fixe).
   Seules les activités des blocs "activites" sont réinitialisées,
   car elles changent de palier (vert/orange/rouge) avec le diagnostic. */
function faitsAPreserver(){
  const keep = {};
  if(PROG && PROG.faits){
    NOTION.axes.forEach(axe=>{
      if(axe.type !== 'activites' && PROG.faits[axe.id]) keep[axe.id] = PROG.faits[axe.id];
    });
  }
  return keep;
}
function freshProg(f, complet){
  const lu = (PROG && PROG.lu) || {}, vu = (PROG && PROG.vu) || {};
  PROG = { fautes:f.slice(), lu:lu, vu:vu, faits:faitsAPreserver(), diagComplet:!!complet };
  saveProg();
}
function clearProg(){ PROG=null; try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

function priorite(f){
  if(f===0) return {cls:"v", label:"À survoler"};
  if(f<=2)  return {cls:"a", label:"À revoir"};
  return     {cls:"r", label:"À retravailler"};
}
function couleurTier(f){ if(f===0) return "vert"; if(f<=2) return "orange"; return "rouge"; }
function activitesDe(axe){ return axe.activites[ couleurTier(fautes[NOTION.axes.indexOf(axe)]) ] || []; }
function blocsDe(axe){ return axe.type==='activites' ? activitesDe(axe) : (axe.exercices||[]); }
function consulteAxe(axe){ return !!((PROG.lu&&PROG.lu[axe.id])||(PROG.vu&&PROG.vu[axe.id])); }
function nbFaits(axe){ const arr=blocsDe(axe); let n=0; for(let j=0;j<arr.length;j++){ if(PROG.faits&&PROG.faits[axe.id]&&PROG.faits[axe.id][j]) n++; } return n; }
function axeFini(axe){
  const arr=blocsDe(axe); const tous = arr.length>0 && nbFaits(axe)===arr.length;
  if(axe.type==='activites') return tous;
  return consulteAxe(axe) && tous;
}
function axeEnCours(axe){
  if(axe.type==='activites') return nbFaits(axe)>0 || !!(PROG.touche&&PROG.touche[axe.id]);
  return consulteAxe(axe) || nbFaits(axe)>0 || !!(PROG.touche&&PROG.touche[axe.id]);
}
function etatAxe(axe,f){
  if(axeFini(axe)) return {cls:"v", label:"Terminé"};
  if(axeEnCours(axe)) return {cls:"a", label:"En cours"};
  return priorite(f);
}

function ecranIntro(){
  document.body.classList.add('en-diagnostic');
  answers=[]; idx=0;
  app.innerHTML = `
    <div class="intro">
      <p>Ce diagnostic de <strong>10 questions</strong> (2 blocs) sert à repérer ce que tu maîtrises déjà. Ce n'est pas une note.</p>
      <div class="note-simple">Les questions sont parfois <strong>très simples</strong> et elles <strong>ne couvrent pas l'ensemble des notions</strong> de la séance. Bien y répondre ne veut donc pas dire que tout est maîtrisé : ça t'aide seulement à voir par où commencer.</div>
      <div class="actions" style="justify-content:flex-start;gap:.7rem;flex-wrap:wrap">
        <button class="btn" id="go">Commencer le diagnostic →</button>
        <button class="btn fant" id="skip">Passer le diagnostic</button>
      </div>
      <p style="font-size:.8rem;color:var(--gris);margin-top:.8rem">« Passer le diagnostic » marque les deux blocs « à retravailler » et ouvre directement le plan complet (utile en cas de bug, ou pour aller droit aux révisions).</p>
    </div>`;
  document.getElementById("go").onclick = ()=>{ idx=0; ecranQuestion(); };
  document.getElementById("skip").onclick = ()=>{ fautes.fill(5); freshProg(fautes,false); ecranResultats(false); };
}

function ecranQuestion(){
  document.body.classList.add('en-diagnostic');
  const item = FLAT[idx];
  const axe = NOTION.axes[item.ai];
  const pct = Math.round((idx/FLAT.length)*100);
  const repondue = idx < answers.length;
  const prev = repondue ? answers[idx] : null;
  if(repondue){ choisi = prev.choisi; valide = true; }
  else { choisi = null; valide = false; }

  const optsHTML = item.opts.map((o,i)=>{
    let cls = "opt";
    if(repondue){
      if(i===prev.choisi) cls += " sel";
      if(i===item.bonne) cls += " juste";
      else if(i===prev.choisi) cls += " faux";
    }
    return `<button class="${cls}" data-i="${i}"${repondue?' disabled':''}><span class="lettre">${LETTRES[i]}</span><span>${o}</span></button>`;
  }).join("");

  const actionBtn = repondue
    ? `<button class="btn" id="suivant">${idx===FLAT.length-1?'Voir mon plan →':'Suivant →'}</button>`
    : `<button class="btn" id="valider" disabled>Valider</button>`;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${idx+1} / ${FLAT.length}</span>
      <span class="axe-tag">Bloc ${axe.id} · ${axe.nom}</span>
    </div>
    <div class="barre"><i style="width:${pct}%"></i></div>
    <p class="enonce">${item.q}</p>
    ${item.imgQ ? `<div class="illus">${item.imgQ}</div>` : ""}
    <div class="opts" id="opts">${optsHTML}</div>
    <div id="zone-feedback" aria-live="polite">${repondue?feedbackHTML(item, prev.ok):''}</div>
    <div class="actions" style="flex-wrap:wrap;gap:.6rem">
      ${idx>0?`<button class="btn fant" id="prec">← Précédent</button>`:``}
      ${actionBtn}
      <button class="btn fant" id="passer">Passer le diagnostic →</button>
    </div>
    ${repondue?`<p class="review-note">Question déjà répondue : tu la revois en lecture seule (réponse non modifiable).</p>`:''}`;

  if(!repondue){
    document.querySelectorAll("#opts .opt").forEach(b=>{
      b.onclick = ()=>{
        if(valide) return;
        choisi = +b.dataset.i;
        document.querySelectorAll("#opts .opt").forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel");
        document.getElementById("valider").disabled = false;
      };
    });
    document.getElementById("valider").onclick = onValider;
  } else {
    document.getElementById("suivant").onclick = ()=>{ idx++; if(idx<FLAT.length) ecranQuestion(); else finDiagnostic(); };
  }
  const prec = document.getElementById("prec"); if(prec) prec.onclick = ()=>{ idx--; ecranQuestion(); };
  document.getElementById("passer").onclick = passerDiagnostic;
}

function onValider(){
  if(valide) return;
  valide = true;
  const item = FLAT[idx];
  const opts = document.querySelectorAll("#opts .opt");
  opts.forEach((b,i)=>{ b.disabled = true; if(i===item.bonne) b.classList.add("juste"); else if(i===choisi) b.classList.add("faux"); });
  const ok = choisi===item.bonne;
  if(!ok) fautes[item.ai]++;
  answers[idx] = { choisi, ok };
  document.getElementById("zone-feedback").innerHTML = feedbackHTML(item, ok);
  const b = document.getElementById("valider");
  b.textContent = (idx===FLAT.length-1) ? "Voir mon plan →" : "Suivant →";
  b.disabled = false;
  b.onclick = ()=>{ idx++; if(idx<FLAT.length) ecranQuestion(); else finDiagnostic(); };
}

      <details class="media"><summary>🎬 ${v.titre}</summary><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}" title="${v.titre}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></details>`).join("");

function corpsCours(axe){
  const flashes = axe.flashes.join("");
  const vids = axe.videos.map(v=>`
      <details class="media"><summary>🎬 ${v.titre}</summary><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}" title="${v.titre}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></details>`).join("");
  const exos = axe.exercices.map((ex,j)=>exoTemplate(axe,ex,j)).join("");
  return `
      <div class="pourquoi"><b>Pourquoi c'est important</b>${axe.pourquoi}</div>
      <p class="choix-msg">Choisis le format qui te convient : <strong>lis les rappels</strong> <em>ou</em> <strong>regarde une vidéo</strong>. L'essentiel est de revoir la notion sans te surcharger.</p>
      <details class="media"><summary>📖 Lire les rappels de cours</summary><div class="flash">${flashes}</div></details>
      ${vids}
      <div class="gate">
        <label><input type="checkbox" class="chk-lu"> J'ai lu les rappels</label>
        <label><input type="checkbox" class="chk-vu"> J'ai regardé une vidéo</label>
      </div>
      <section class="bloc">
        <h4>Exercices</h4>
        <p class="verrou-msg">🔒 Consulte les rappels <strong>ou</strong> une vidéo (au choix), puis coche-la pour débloquer les exercices.</p>
        <div class="exos verrou">${exos}</div>
      </section>`;
}

function ecranResultats(autoOpen){
  document.body.classList.remove('en-diagnostic');
  if(!PROG) PROG = { fautes:fautes.slice(), lu:{}, vu:{}, faits:{}, diagComplet:true };

  const ordre = NOTION.axes.map((axe,i)=>({axe, i, f:fautes[i]}));
  ordre.sort((a,b)=>{
    const ga = a.f===0 ? 1 : 0, gb = b.f===0 ? 1 : 0;
    if(ga!==gb) return ga - gb;
    return a.i - b.i;
  });

  const cartes = ordre.map(({axe,f})=>{
    const p = etatAxe(axe,f);
    const corps = axe.type==='activites' ? corpsActivites(axe,f) : corpsCours(axe);
    return `
      <details class="axe ${p.cls}" data-axe="${axe.id}" data-type="${axe.type}">
        <summary>
          <span class="badge ${p.cls}">${p.label}</span>
          <span class="axe-nom">Bloc ${axe.id} — ${axe.nom}</span>
          <span class="axe-score"${(PROG.ouvert&&PROG.ouvert[axe.id])?' hidden':''}>${5-f}/5</span>
        </summary>
        <div class="axe-corps">${corps}</div>
      </details>`;
  }).join("");

  app.innerHTML = `
    <div class="topbar"><span>Ton plan de révision</span><span class="axe-tag">classé par priorité</span></div>
    <div class="res-note">Rappel : ces questions sont simples et ne couvrent pas tout. Même un bloc « à survoler » mérite un coup d'œil pour bien démarrer la 1re. Ton avancement est gardé en mémoire sur cet appareil.</div>
    ${cartes}
    <div class="conseil-temps" style="background:var(--nuit);color:var(--clair);padding:1rem 1.2rem;font-size:.95rem;margin-top:1rem">Peu de temps ? Suis l'ordre proposé : les blocs en haut sont les plus prioritaires.</div>
    <div class="actions" style="margin-top:1.4rem;justify-content:flex-start">
      <button class="btn fant" id="recommencer">↻ Refaire le diagnostic</button>
    </div>`;

  // Bloc B : verrou cours/vidéo + restauration
  document.querySelectorAll('details.axe').forEach(ax=>{
    const id = ax.dataset.axe;
    const chkLu = ax.querySelector('.chk-lu');
    const chkVu = ax.querySelector('.chk-vu');
    if(chkLu && chkVu){
      const exos = ax.querySelector('.exos');
      const msg = ax.querySelector('.verrou-msg');
      chkLu.checked = !!(PROG.lu && PROG.lu[id]);
      chkVu.checked = !!(PROG.vu && PROG.vu[id]);
      function updateGate(){
        const ouvert = chkLu.checked || chkVu.checked;
        if(exos) exos.classList.toggle('verrou', !ouvert);
        if(msg) msg.hidden = ouvert;
      }
      updateGate();
      chkLu.addEventListener('change', ()=>{ PROG.lu = PROG.lu||{}; PROG.lu[id]=chkLu.checked; saveProg(); updateGate(); });
      chkVu.addEventListener('change', ()=>{ PROG.vu = PROG.vu||{}; PROG.vu[id]=chkVu.checked; saveProg(); updateGate(); });
    }
  });

  // Bloc A : cases « activité faite »
  document.querySelectorAll('.activite').forEach(actEl=>{
    const id = actEl.dataset.ax, j = actEl.dataset.j;
    const cf = actEl.querySelector('.act-fait input');
    const fait = !!(PROG.faits && PROG.faits[id] && PROG.faits[id][j]);
    cf.checked = fait;
    cf.addEventListener('change', ()=>{ PROG.faits = PROG.faits||{}; PROG.faits[id] = PROG.faits[id]||{}; PROG.faits[id][j]=cf.checked; saveProg(); refreshEtats(); });
  });

  // Bloc B : minuteur + correction + case « fait »
  document.querySelectorAll('details.exo').forEach(exo=>{
    const sec = +exo.dataset.timer, axId = exo.dataset.ax, j = exo.dataset.j;
    const bc = exo.querySelector('.btn-corr');
    const corr = exo.querySelector('.exo-corr');
    let started = false;
    function startTimer(){
      let left = sec;
      const tick = ()=>{
        if(left<=0){ bc.disabled=false; bc.textContent='Voir la correction'; return; }
        bc.textContent='Correction dans '+left+' s'; left--; setTimeout(tick,1000);
      };
      tick();
    }
    exo.addEventListener('toggle', ()=>{ if(exo.open && !started){ started=true; startTimer(); } });
    bc.addEventListener('click', ()=>{ if(bc.disabled) return; corr.hidden=!corr.hidden; bc.textContent = corr.hidden?'Voir la correction':'Masquer la correction'; });
    const be = exo.querySelector('.btn-exemple');
    if(be){ const ex=exo.querySelector('.exo-exemple'); be.addEventListener('click', ()=>{ ex.hidden=!ex.hidden; be.textContent = ex.hidden?'Voir un exemple':"Masquer l'exemple"; }); }
    const cf = exo.querySelector('.chk-fait input');
    const mark = exo.querySelector('.fait-mark');
    const fait = !!(PROG.faits && PROG.faits[axId] && PROG.faits[axId][j]);
    cf.checked = fait; if(mark) mark.hidden = !fait;
    cf.addEventListener('change', ()=>{ PROG.faits = PROG.faits||{}; PROG.faits[axId] = PROG.faits[axId]||{}; PROG.faits[axId][j]=cf.checked; saveProg(); if(mark) mark.hidden = !cf.checked; });
  });

  function refreshEtats(){
    NOTION.axes.forEach((axe)=>{
      const det = document.querySelector('details.axe[data-axe="'+axe.id+'"]');
      if(!det) return;
      const b = etatAxe(axe, fautes[NOTION.axes.indexOf(axe)]);
      det.className = 'axe '+b.cls;
      const badgeEl = det.querySelector('.badge');
      if(badgeEl){ badgeEl.className = 'badge '+b.cls; badgeEl.textContent = b.label; }
      if(PROG.ouvert && PROG.ouvert[axe.id]){ const sc = det.querySelector('.axe-score'); if(sc) sc.hidden = true; }
    });
  }
  NOTION.axes.forEach((axe)=>{
    const det = document.querySelector('details.axe[data-axe="'+axe.id+'"]');
    if(!det) return;
    det.addEventListener('toggle', ()=>{
      if(det.open){ PROG.ouvert = PROG.ouvert||{}; if(!PROG.ouvert[axe.id]){ PROG.ouvert[axe.id]=true; saveProg(); } }
      refreshEtats();
    });
    det.querySelectorAll('details').forEach((sub)=>{
      sub.addEventListener('toggle', ()=>{ if(sub.open){ PROG.touche = PROG.touche||{}; if(!PROG.touche[axe.id]){ PROG.touche[axe.id]=true; saveProg(); refreshEtats(); } } });
    });
  });
  if(document._rfChg) document.removeEventListener('change', document._rfChg);
  document._rfChg = refreshEtats;
  document.addEventListener('change', refreshEtats);
  refreshEtats();
  if(autoOpen){ const first = document.querySelector('details.axe'); if(first) first.open = true; }

  document.getElementById("recommencer").onclick = ()=>{
    const ok = confirm("Refaire le diagnostic ?\n\n• Tes réponses au diagnostic seront réinitialisées.\n• Les activités du bloc A pourront changer de niveau : leurs coches sont remises à zéro.\n• Tes exercices déjà cochés et tes cases « lu / vu » du bloc B sont conservés.");
    if(!ok) return;
    fautes.fill(0); answers=[]; idx=0; ecranIntro();
  };
}

if(PROG && Array.isArray(PROG.fautes)){
  PROG.fautes.forEach((v,i)=> fautes[i]=v);
  ecranResultats(true);
} else {
  ecranIntro();
}
</script>

<div id="prog-bar" aria-label="Progression par bloc">
  <div class="pb-title">Progression</div>
  <div class="pb-pct">0 %</div>
  <div class="pb-seg">
    <div class="pb-cell none" data-diag="1" title="Diagnostic"><span class="pb-fill"></span><span class="pb-lab">Diag</span></div>
    <div class="pb-cell none" data-axe="A"><span class="pb-fill"></span><span class="pb-lab">A</span></div>
    <div class="pb-cell none" data-axe="B"><span class="pb-fill"></span><span class="pb-lab">B</span></div>
  </div>
</div>
<script>
/* Jour 1 — barre de progression + publication du contrat "cahier-progression".
   Bloc A (activites) = 2 activites a faire ; Bloc B (cours) = rappel consulte
   (lu OU vu) + ses 5 exercices. */
(function(){
  var JOUR=1, TITRE="Conversions, chiffres significatifs & ordres de grandeur", CLE='cahier-j01';
  var AXES=[{id:'A',type:'activites',exos:2},{id:'B',type:'cours',exos:5}];
  function lire(){ try{var r=localStorage.getItem(CLE);return r?JSON.parse(r):null;}catch(e){return null;} }
  function lireOuv(){ try{var r=localStorage.getItem('cahier-j01-ouverts');return r?JSON.parse(r):{};}catch(e){return {};} }
  function saveOuv(o){ try{localStorage.setItem('cahier-j01-ouverts',JSON.stringify(o));}catch(e){} }
  function deuxch(n){ return (n<10?'0':'')+n; }
  function ajd(){ var d=new Date();return d.getFullYear()+'-'+deuxch(d.getMonth()+1)+'-'+deuxch(d.getDate()); }

  function paint(c,state,frac,extra){
    if(!c) return;
    c.className='pb-cell '+state+(extra?(' '+extra):'');
    var fill=c.querySelector('.pb-fill');
    if(fill){ fill.className='pb-fill'+(state==='done'?' g':(state==='prog'?' h':'')); fill.style.height=Math.round(frac*100)+'%'; }
  }
  function setCell(id,state,frac,extra){ paint(document.querySelector('#prog-bar .pb-cell[data-axe="'+id+'"]'),state,frac,extra); }
  function setDiag(state,frac){ paint(document.querySelector('#prog-bar .pb-cell[data-diag]'),state,frac); }
  function publier(axes,pasFaits,pasTotal){
    try{
      var all={}; try{all=JSON.parse(localStorage.getItem('cahier-progression'))||{};}catch(e){}
      var faits=0; axes.forEach(function(a){if(a.etat==='done')faits++;});
      var pct=pasTotal?Math.round(pasFaits/pasTotal*100):0;
      var date=(all[JOUR]&&all[JOUR].date)?all[JOUR].date:ajd();
      all[JOUR]={titre:TITRE,date:date,axes:axes,axesFaits:faits,axesTotal:axes.length,pct:pct,termine:(faits===axes.length)};
      localStorage.setItem('cahier-progression',JSON.stringify(all));
    }catch(e){}
  }
  function retirer(){ try{var all=JSON.parse(localStorage.getItem('cahier-progression'))||{}; if(all[JOUR]){delete all[JOUR];localStorage.setItem('cahier-progression',JSON.stringify(all));}}catch(e){} }

  function maj(){
    var P=lire(), pctEl=document.querySelector('#prog-bar .pb-pct');
    if(!P){ saveOuv({}); setDiag('none',0); AXES.forEach(function(ax){setCell(ax.id,'none',0);}); if(pctEl)pctEl.textContent='0 %'; retirer(); return; }
    var ouv=lireOuv(), pasFaits=0, pasTotal=0, axes=[];
    var diagFini=!!P.diagComplet;
    setDiag(diagFini?'done':'prog', diagFini?1:0.5);
    pasFaits+=(diagFini?1:0); pasTotal+=1;
    AXES.forEach(function(ax, i){
      var det=document.querySelector('details.axe[data-axe="'+ax.id+'"]');
      if(det){ if(det.open) ouv[ax.id]=true; if(!det._barHook){det._barHook=true;det.addEventListener('toggle',function(){if(det.open){var o=lireOuv();o[ax.id]=true;saveOuv(o);}maj();});} }
      var fa=(P.fautes&&typeof P.fautes[i]==='number')?P.fautes[i]:null;
      var vert=fa===0, revoir=(fa>=1&&fa<=2);
      var consulte=!!((P.lu&&P.lu[ax.id])||(P.vu&&P.vu[ax.id]));
      var n=0; for(var j=0;j<ax.exos;j++){ if(P.faits&&P.faits[ax.id]&&P.faits[ax.id][j]) n++; }
      var total, acquis, steps, touche;
      if(ax.type==='activites'){
        total=ax.exos; acquis=(n===ax.exos); steps=n;
        touche=acquis||!!ouv[ax.id]||n>0;
      } else {
        total=1+ax.exos; acquis=(consulte&&n===ax.exos);
        steps=acquis?total:((consulte?1:0)+n);
        touche=acquis||!!ouv[ax.id]||consulte||n>0;
      }
      pasFaits+=steps; pasTotal+=total;
      var state=acquis?'done':(touche?'prog':'none');
      setCell(ax.id,state,steps/total,(revoir&&!acquis)?'revoir':'');
      axes.push({id:ax.id,etat:state,pct:Math.round(steps/total*100)});
    });
    saveOuv(ouv);
    if(pctEl)pctEl.textContent=Math.round(pasFaits/pasTotal*100)+' %';
    publier(axes,pasFaits,pasTotal);
  }
  maj();
  document.addEventListener('change',maj);
  var root=document.getElementById('app');
  if(root){ try{ new MutationObserver(maj).observe(root,{childList:true,subtree:true}); }catch(e){} }
})();
</script>
</body>
</html>
