<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMC seconde</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/css/emc.css?v=2">
<style>
  /* Page élève : ce qui ne sert qu'ici. Le reste est dans emc.css. */
  .entete-eleve { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .entete-eleve .seance { font-weight: 600; }
  .entete-eleve .qui { font-size: .9rem; opacity: .85; }
  .grande-table { font-family: 'Space Grotesk', sans-serif; font-size: 1.05rem; padding: .25em .8em; }
  .emc-barre .pastille { border: 0; }
  .emc-barre button { min-height: 40px; padding: .3rem .8rem; }
  .emc-barre button.pret-oui { background: var(--ok); border-color: var(--ok); color: #fff; }
  .emc-barre button.pret-non { background: #fff; color: var(--marine-nuit); }
  .emc-barre button.lien { background: transparent; border-color: rgba(255, 255, 255, .35); }
  /* « Je suis prêt·e » : gros, juste à côté du numéro de table */
  button.pret-grand { font-size: 1.15rem; font-weight: 700; min-height: 50px; padding: .35rem 1.1rem; border-radius: 999px; }
  .emc-barre button.pret-non.pret-grand { background: var(--orange); border-color: var(--orange); color: #fff; }
  button.pret-geant { width: 100%; font-size: 1.6rem; font-weight: 700; min-height: 84px; margin-top: 1rem; border-radius: 18px; }
  button.pret-geant.pret-non { background: var(--orange); border-color: var(--orange); color: #fff; }
  button.pret-geant.pret-oui { background: var(--ok); border-color: var(--ok); color: #fff; }
  .porte .encadre.deja { margin-bottom: 1rem; }

  #scene { animation: apparaitre .35s ease-out; }
  @keyframes apparaitre { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .etape-titre { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin: .2rem 0 1rem; }
  .etape-titre .num { font-family: 'Space Grotesk', sans-serif; color: var(--orange-fonce); font-weight: 700; }

  /* porte d'entrée */
  .porte { max-width: 520px; margin: 1.5rem auto; }
  .porte .choix { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .6rem; }
  .porte .choix button.actif { background: var(--marine); color: #fff; border-color: var(--marine); }
  .porte input.code { letter-spacing: .4em; font-family: 'Space Grotesk', sans-serif; font-size: 1.6rem; max-width: 9rem; }
  .porte input.ident-carte { font-family: 'IBM Plex Mono', monospace; font-size: 1.25rem; }
  .regle { font-size: .85rem; color: var(--ink-soft); margin: .2rem 0 0; }

  /* table en très gros (étapes 0 et 2) */
  .table-geante { text-align: center; padding: 1rem; }
  .table-geante .n { font-family: 'Space Grotesk', sans-serif; font-size: 4.5rem; line-height: 1; color: var(--orange); font-weight: 700; }
  .verbe { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.4rem, 7vw, 4rem); color: var(--marine); line-height: 1.05; margin: .2rem 0 .4rem; }
  .mission-texte { font-size: 1.25rem; }
  .questions li { margin: .35rem 0; font-size: 1.05rem; }

  /* mots et émojis */
  .mots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
  @media (max-width: 600px) { .mots { grid-template-columns: 1fr; } }
  /* 4 colonnes (8 sur grand écran) : 32 émojis en rangées pleines */
  .emojis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .45rem; margin-top: .4rem; }
  @media (min-width: 900px) { .emojis { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
  .emojis button { flex-direction: column; font-weight: 500; font-size: .85rem; min-height: 84px; line-height: 1.15; gap: .15rem; text-align: center; }
  .emojis button .e { font-size: 2rem; }
  .emojis button[aria-pressed="true"] { border: 3px solid var(--cyan); background: var(--cyan-wash); }
  .etat-envoi { font-weight: 600; }
  .etat-envoi.ok { color: var(--ok); } .etat-envoi.att { color: var(--wait); } .etat-envoi.err { color: var(--err); }

  /* notes */
  textarea.notes { min-height: 12rem; font-size: 1.02rem; }
  .note-camarade { background: var(--surface-2); border-radius: 10px; padding: .55rem .75rem; margin: .45rem 0; white-space: pre-wrap; }
  .note-camarade b { display: block; font-size: .85rem; color: var(--ink-soft); }

  /* carte */
  .carte-zone { display: grid; grid-template-columns: minmax(0, 1fr); gap: .6rem; }
  #carte-hote { height: calc(100vh - 13rem); min-height: 520px; }
  /* plein écran : la carte prend tout, SAUF le bandeau d'aide, qui reste
     visible et cliquable à toutes les étapes */
  body.carte-plein .carte-plein-cadre { position: fixed; inset: 0; z-index: 45; background: var(--bg);
    padding: .4rem .4rem 5.4rem; display: flex; flex-direction: column; }
  body.carte-plein .aide-bandeau { z-index: 46; }
  body.carte-plein .carte-plein-cadre #carte-hote { flex: 1; height: auto; min-height: 0; }
  details.panneau-notes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .5rem .8rem; }
  details.panneau-notes summary { cursor: pointer; font-weight: 600; min-height: 32px; }

  /* harcèlomètre */
  .situation { font-size: 1.35rem; font-weight: 600; line-height: 1.35; margin: .3rem 0 1rem; }
  .curseur-cadre { padding: .5rem .2rem 0; }
  input[type=range].harcelo { width: 100%; height: 56px; -webkit-appearance: none; appearance: none; background: transparent; }
  input[type=range].harcelo::-webkit-slider-runnable-track { height: 22px; border-radius: 11px; background: var(--piste); }
  input[type=range].harcelo::-moz-range-track { height: 22px; border-radius: 11px; background: var(--piste); }
  input[type=range].harcelo::-webkit-slider-thumb { -webkit-appearance: none; width: 46px; height: 46px; margin-top: -12px; border-radius: 50%; background: #fff; border: 4px solid var(--marine); box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  input[type=range].harcelo::-moz-range-thumb { width: 38px; height: 38px; border-radius: 50%; background: #fff; border: 4px solid var(--marine); }
  input[type=range].harcelo:disabled { opacity: .6; }
  .graduations { display: flex; justify-content: space-between; font-size: .85rem; color: var(--ink-soft); padding: 0 14px; }
  .echelle { display: grid; grid-template-columns: 2.5fr 3fr 3fr 1.5fr; gap: .3rem; margin-top: .4rem; font-size: .82rem; }
  .echelle div { border-radius: 8px; padding: .35rem .45rem; color: #fff; line-height: 1.2; }
  .valeur-vote { font-family: 'Space Grotesk', sans-serif; font-size: 2.6rem; font-weight: 700; color: var(--marine); }

  /* enquête */
  fieldset.q { border: 1px solid var(--line); border-radius: var(--r); padding: .6rem .9rem; margin: .7rem 0; }
  fieldset.q legend { font-weight: 600; padding: 0 .3rem; }
  fieldset.q label { font-weight: 400; display: flex; gap: .6rem; align-items: center; min-height: 44px; margin: 0; cursor: pointer; }
  fieldset.q input { width: 1.4rem; height: 1.4rem; min-height: 0; }

  /* aide */
  .aide-bandeau .numeros span { white-space: nowrap; }
  .aide-bandeau button { white-space: nowrap; }
  .modale label.case { font-weight: 400; display: flex; gap: .6rem; align-items: center; min-height: 44px; margin: .2rem 0; cursor: pointer; }
  .modale label.case input { width: 1.4rem; height: 1.4rem; min-height: 0; flex: none; }

  .numeros-grands { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .6rem; }
  .numeros-grands div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .7rem .9rem; }
  .numeros-grands b { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; color: var(--marine); display: block; line-height: 1.1; }
  video { width: 100%; border-radius: var(--r); background: #000; }

  /* ---- jeu de rôle (emc-accueil.js) ---- */
  .origines { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .45rem; margin: .4rem 0 .6rem; }
  @media (max-width: 600px) { .origines { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .origines button { min-height: 56px; font-size: 1.1rem; font-weight: 700; }
  .origines button[aria-pressed="true"], .reconnu button[aria-pressed="true"] { border: 3px solid var(--cyan); background: var(--cyan-wash); }
  .aide-bandeau[hidden] { display: none; }
  .consignes-cartes { display: grid; gap: .6rem; margin-bottom: 1rem; }
  .consigne { display: grid; grid-template-columns: 3rem 1fr; gap: .6rem; align-items: center; border-radius: 14px; padding: .7rem 1rem;
              box-shadow: 0 1px 3px rgba(22, 31, 51, .08); }
  .consigne-n { font-size: 2rem; text-align: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--marine); }
  .consigne p { margin: 0; font-size: 1.15rem; line-height: 1.45; color: var(--ink); }
  .consigne b { color: var(--marine); }
  details.exemple summary { font-weight: 700; font-size: 1.05rem; min-height: 40px; cursor: pointer; }
  .exemple-temps { display: grid; gap: .8rem; margin-top: .6rem; }
  .exemple-etape h3 { margin: 0 0 .3rem; font-size: 1rem; color: var(--orange-fonce); }
  .exemple-etape ol, .exemple-notes { margin: 0; padding-left: 1.3rem; }
  .exemple-notes li { margin: .35rem 0; }
  .exemple-texte { font-size: 1.12rem; line-height: 1.55; font-style: italic; background: var(--surface-2); border-radius: 10px; padding: .8rem 1rem; margin: 0; }
  .note-binome { font-size: .95rem; margin-top: .25rem; background: var(--cyan-wash); border-radius: 8px; padding: .3rem .55rem; }
  .note-binome.vide { background: transparent; color: var(--ink-soft); padding-left: 0; }
  .q-texte { font-weight: 600; }
  .c-est-toi { text-align: center; border: 3px solid var(--orange); }
  .emc-barre #btn-aide-barre { background: var(--cyan); border-color: var(--cyan); color: #fff; }
  .symbole-geant { font-size: min(42vw, 13rem); line-height: 1.1; text-align: center; animation: rebond 1.2s ease-in-out infinite; }
  .symbole-geant.petit { font-size: 6rem; }
  @keyframes rebond { 50% { transform: scale(1.08) rotate(-4deg); } }
  @media (prefers-reduced-motion: reduce) { .symbole-geant { animation: none; } }
  .consigne-geante { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.6rem, 5vw, 2.4rem); text-align: center; color: var(--marine); margin: .3rem 0; font-weight: 700; }
  .symbole-badge { font-size: 1.6rem; padding: 0 .5em; }
  .barre-choix { position: sticky; bottom: 0; z-index: 5; background: var(--bg); padding: .5rem 0 calc(.5rem + env(safe-area-inset-bottom)); display: grid; gap: .4rem;
                 border-top: 1px solid var(--line); box-shadow: 0 -6px 12px -8px rgba(0,0,0,.15); }
  .barre-choix .etat-envoi { margin: 0; }
  .barre-choix button:disabled { opacity: .45; }
  .compteur-themes { display: flex; gap: .35rem; flex-wrap: wrap; }
  .compteur-themes .pastille { font-size: 1rem; }
  fieldset.theme label { align-items: flex-start; padding: .35rem 0; }
  fieldset.theme label input { margin-top: .2rem; }
  .num-q { color: var(--ink-soft); }
  .chrono-eleve { font-family: 'Space Grotesk', sans-serif; font-size: 2.2rem; font-weight: 700; text-align: center; padding: .6rem; border-radius: var(--r);
                  background: var(--surface); border: 1px solid var(--line); margin-bottom: .8rem; }
  .chrono-eleve span { font-size: 1.1rem; font-weight: 600; }
  .chrono-eleve.moitie { background: var(--wait-wash); color: var(--wait); }
  .chrono-eleve.fini { background: var(--err-wash); color: var(--err); }
  .chrono-eleve.att { font-size: 1.2rem; color: var(--ink-soft); }
  .q-note { display: grid; gap: .25rem; margin: .7rem 0; font-weight: 600; }
  .q-note textarea { min-height: 3.2rem; font-weight: 400; }
  .feu-ligne { display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid var(--line); }
  @media (max-width: 600px) { .feu-ligne { grid-template-columns: 1fr; } }
  .feu-boutons { display: flex; gap: .4rem; }
  .feu-boutons button { min-width: 6rem; min-height: 50px; font-weight: 700; }
  .feu.vert[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .feu.rouge[aria-pressed="true"] { background: var(--err); border-color: var(--err); color: #fff; }
  .note-feu { display: grid; grid-template-columns: 2rem 1fr; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
  .note-feu.rouge { opacity: .55; }
  .pastille-feu { font-size: 1.3rem; }
  .reconnu { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .45rem; }
  .reconnu button { flex-direction: column; min-height: 96px; font-weight: 600; }
  .reconnu .e { font-size: 2.4rem; }

  /* ---- restitution (emc-restitution.js) ---- */
  .parcours-ligne { display: grid; grid-template-columns: 2.8rem 2fr 1fr 2fr; gap: .4rem; align-items: center; margin: .45rem 0; }
  @media (max-width: 820px) { .parcours-ligne { grid-template-columns: 2.8rem 1fr; } .parcours-ligne input:not(:first-of-type) { grid-column: 2; } }
  /* avec la liste des ateliers : le choix sur toute la ligne, puis nom libre, mot-clé, liberté */
  .parcours-ligne.avec-liste { grid-template-columns: 2.8rem 1fr 1fr 1.4fr; border-bottom: 1px solid var(--line); padding-bottom: .6rem; }
  .parcours-ligne.avec-liste select { grid-column: 2 / -1; min-height: 48px; font-size: 1rem; }
  .parcours-ligne.avec-liste input { grid-column: auto; }
  .parcours-ligne.avec-liste input:first-of-type { grid-column: 2; }
  @media (max-width: 820px) { .parcours-ligne.avec-liste { grid-template-columns: 2.8rem 1fr; } .parcours-ligne.avec-liste input { grid-column: 2; } }
  .num-atelier { font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--orange-fonce); display: flex; flex-direction: column; align-items: center; gap: .2rem; align-self: start; }
  .num-atelier .monter { min-height: 44px; min-width: 2.6rem; padding: 0; font-size: 1rem; line-height: 1; }
  .sortes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .4rem; margin: .4rem 0 .6rem; }
  .sortes button { min-height: 52px; font-weight: 700; color: var(--ink); border: 2px solid transparent; }
  .sortes button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px #fff inset; }
  .mur-groupe { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: .6rem; margin-top: .6rem; }
  .postit { position: relative; padding: .7rem .8rem 1rem; min-height: 90px; border-radius: 4px; box-shadow: 0 3px 8px rgba(0,0,0,.15);
            font-size: 1.02rem; line-height: 1.3; transform: rotate(-1deg); }
  .postit:nth-child(2n) { transform: rotate(1.2deg); }
  .postit.masque { opacity: .45; text-decoration: line-through; }
  .postit .retirer { position: absolute; top: .2rem; right: .2rem; min-height: 0; padding: 0 .4rem; background: transparent; border: 0; font-size: .9rem; }
  /* le mur en trois colonnes (saisie, et lecture) */
  .mur-titre { font-size: 1.4rem; margin: .6rem 0 .4rem; }
  .mur-saisie { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
  .mur-case { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .6rem .7rem; display: grid; gap: .4rem; align-content: start; }
  .mur-case h3 { margin: 0; font-size: 1.05rem; }
  .mur-case textarea { min-height: 5rem; }
  .mur-case .etat-envoi { margin: 0; min-height: 1.2em; }
  .mur-colonnes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; align-items: start; }
  .mur-colonne h3 { margin: 0 0 .3rem; padding: .35rem .6rem; border-radius: 8px; font-size: 1rem; color: var(--ink); }
  .mur-colonne .postit { transform: none; margin: .4rem 0; min-height: 0; }
  .postit-groupe { font-size: 1.1rem; }
  @media (max-width: 700px) { .mur-saisie, .mur-colonnes { grid-template-columns: 1fr; } }
  /* « C'est à votre groupe ! » : impossible à manquer */
  .a-vous { display: flex; gap: 1rem; align-items: center; background: var(--orange); color: #fff; border-radius: 16px; padding: 1rem 1.3rem; margin-bottom: 1rem;
            box-shadow: 0 4px 14px rgba(232, 116, 59, .35); animation: pulsation 1.6s ease-in-out infinite; }
  @keyframes pulsation { 50% { box-shadow: 0 4px 26px rgba(232, 116, 59, .75); transform: scale(1.015); } }
  .a-vous-icone { font-size: 3.4rem; line-height: 1; }
  .a-vous b { display: block; font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.5rem, 4.4vw, 2.3rem); line-height: 1.1; }
  .a-vous span { font-size: 1.05rem; opacity: .95; }
  @media (prefers-reduced-motion: reduce) { .a-vous { animation: none; } }
</style>
</head>
<body>

<header class="emc-barre" id="barre">
  <span class="titre">EMC seconde</span>
  <span class="espace"></span>
</header>

<main class="emc-page" id="principal" tabindex="-1">
  <p class="muet" id="chargement">Chargement…</p>
</main>

<footer class="aide-bandeau" id="bandeau-aide" aria-label="Aide et numéros d'urgence" hidden>
  <div class="numeros" id="numeros"></div>
  <button type="button" class="cyan" id="btn-aide" hidden>💬 J'ai besoin d'en parler</button>
</footer>

<noscript><p class="emc-page">Cette page a besoin de JavaScript.</p></noscript>

<!-- Pas de progression.js ici : la carte a sa propre session
     (emc-commun.js §1b), à part de celle du site. -->
<script src="../assets/js/vendor/supabase-js-2.45.4.min.js"></script>
<script src="../assets/js/emc-commun.js?v=4"></script>
<script src="../assets/js/emc-vues.js?v=2"></script>
<script src="../assets/js/vendor/konva-9.3.6.min.js"></script>
<script src="../assets/js/emc-carte.js?v=2"></script>
<script src="../assets/js/emc-accueil.js?v=2"></script>
<script src="../assets/js/emc-restitution.js?v=2"></script>
<script src="../assets/js/emc-eleve.js?v=4"></script>
</body>
</html>
