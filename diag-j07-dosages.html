<!-- ============================================================
     JOUR 7 — Dosage par étalonnage — même moteur que le J06 :
       diagnostic QCM (5 questions) -> plan priorisé par bloc :
       (capsule) + vidéo + exercices, verrou lu/vu, minuteur +
       case fait par exercice, sauvegarde, barre de progression.
       Bloc A — Méthode de l'échelle de teintes : vidéo + animation
         (bloc « découverte », pas de question au diagnostic).
       Bloc B — Méthode de la courbe d'étalonnage : vidéo + exercice 2
         + les 5 questions du diagnostic.
       Vidéos en attente (liens à intégrer) -> rendu « video-slot ».
     ============================================================ -->
<style>
  :root{
    --nuit:#0e2545;--nuit-haut:#173d6b;--nuit-bas:#0b1d39;

    --vert:#2fae6a;--ambre:#f0a72e;--rouge:#d6402b;

  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--encre);background:var(--papier);line-height:1.6}

  .retour:hover,.retour:focus-visible{color:var(--orange)}

  .bandeau{background:linear-gradient(160deg,var(--nuit-haut),var(--nuit-bas));color:var(--clair)}

  main{max-width:760px;margin:0 auto;padding:2rem 1.5rem 4rem}
  .intro p{margin-bottom:1rem}
  .note-simple{background:rgba(63,167,214,.08);border-left:4px solid var(--cyan);padding:.9rem 1.1rem;font-size:.95rem;margin:1.2rem 0}

  .btn:hover{filter:brightness(1.06)}
  .btn.fant{background:transparent;color:var(--nuit);border:1px solid var(--nuit)}

  .btn:disabled{opacity:.45;cursor:not-allowed}

  .topbar{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--gris);margin-bottom:.6rem;gap:1rem}
  .axe-tag{color:var(--orange);text-align:right}
  .barre{height:6px;background:var(--ligne);margin-bottom:1.6rem;overflow:hidden}

  .enonce{font-size:1.12rem;font-weight:600;margin-bottom:.4rem;font-family:'Space Grotesk',sans-serif}

  .opts{display:grid;gap:.6rem;margin-bottom:1.2rem}
  .opt{text-align:left;background:var(--carte);border:1px solid var(--ligne);padding:.8rem 1rem;cursor:pointer;font-size:1rem;font-family:inherit;color:var(--encre);display:flex;gap:.7rem;align-items:flex-start}
  .opt .lettre{font-family:'IBM Plex Mono',monospace;color:var(--gris);flex:0 0 auto;min-width:1.1em}
  .opt:hover{border-color:var(--orange)}

  .opt.faux{border-color:var(--rouge);background:rgba(214,64,43,.10)}

  .feedback{border:1px solid var(--ligne);border-left:4px solid var(--cyan);background:var(--carte);padding:1rem 1.1rem;margin-bottom:1.2rem;font-size:.97rem}
  .feedback.ok{border-left-color:var(--vert)} .feedback.ko{border-left-color:var(--rouge)}
  .feedback .res{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;padding:.25rem .6rem;border-radius:999px;color:#fff;margin-bottom:.7rem}
  .feedback.ok .res{background:var(--vert)} .feedback.ko .res{background:var(--rouge)}
  .feedback p{margin:0}

  .actions{display:flex;justify-content:flex-end;gap:.7rem}

  .res-note{font-size:.95rem;color:var(--gris);background:rgba(0,0,0,.025);border:1px dashed var(--ligne);padding:.9rem 1.1rem;margin-bottom:1.5rem}
  details.axe{border:1px solid var(--ligne);border-left:5px solid var(--gris);background:var(--carte);margin-bottom:1rem}
  details.axe.v{border-left-color:var(--vert)} details.axe.a{border-left-color:var(--ambre)} details.axe.r{border-left-color:var(--rouge)}
  details.axe>summary{list-style:none;cursor:pointer;padding:1rem 1.2rem;display:flex;align-items:center;gap:.8rem}
  details.axe>summary::-webkit-details-marker{display:none}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:.2rem .55rem;border-radius:999px;color:#fff;flex:0 0 auto}
  .badge.v{background:var(--vert)} .badge.a{background:var(--ambre)} .badge.r{background:var(--rouge)}
  .axe-nom{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.02rem;flex:1}
  .axe-score{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--gris)}

  .bloc{margin-bottom:1.3rem}

  .video-slot{border:1px dashed var(--orange);background:rgba(232,116,59,.06);color:var(--gris);padding:1rem;font-family:'IBM Plex Mono',monospace;font-size:.82rem;text-align:center}

  .gate{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;margin:0 0 1rem;padding:.8rem 1rem;background:rgba(232,116,59,.07);border:1px solid var(--ligne)}

  .gate input{width:16px;height:16px;accent-color:var(--orange);flex:0 0 auto}
  .verrou-msg{font-family:'IBM Plex Mono',monospace;font-size:.82rem;color:var(--gris);margin-bottom:.6rem}
  .exos.verrou{opacity:.45;pointer-events:none}
  .vide{font-size:.9rem;color:var(--gris);font-style:italic}

  details.exo{border:1px solid var(--ligne);margin-bottom:.7rem;background:rgba(0,0,0,.012)}
  details.exo>summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:flex;gap:.6rem;align-items:baseline}
  details.exo>summary::-webkit-details-marker{display:none}
  details.exo>summary::before{content:"▸";color:var(--orange);font-size:.8rem;flex:0 0 auto}
  details.exo[open]>summary::before{content:"▾"}
  .exo-num{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--gris);text-transform:uppercase;letter-spacing:.06em;flex:0 0 auto}
  .exo-titre{font-family:'Space Grotesk',sans-serif;font-size:.98rem;font-weight:600}
  .fait-mark{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--vert)}
  .exo-body{padding:0 1rem 1rem}
  .exo-enonce{margin-bottom:.4rem}
  .exo-situation{font-weight:400;margin-bottom:.5rem}

  .exo-btns{display:flex;gap:.5rem;flex-wrap:wrap}
  .mini{font-family:'IBM Plex Mono',monospace;font-size:.76rem;cursor:pointer;border:1px solid var(--nuit);background:#fff;color:var(--nuit);padding:.35rem .7rem}
  .mini:hover:not(:disabled){background:var(--nuit);color:#fff}
  .mini:disabled{opacity:.55;cursor:not-allowed;border-color:var(--gris);color:var(--gris)}
  .exo-corr{margin-top:.6rem;border-left:3px solid var(--vert);background:rgba(47,174,106,.07);padding:.7rem .9rem;font-size:.92rem}
  .exo-corr p{margin-bottom:.4rem}
  .donnees{background:rgba(0,0,0,.03);border:1px solid var(--ligne);padding:.6rem .9rem;font-size:.9rem;margin:.5rem 0 .7rem}
  .woo-exo{margin-top:.5rem;border:1px solid var(--ligne);overflow:hidden}
  .woo-exo iframe{width:100%;height:600px;border:0;display:block}
  .woo-note{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--gris);margin:.4rem 0 .6rem}
  .chk-fait{display:flex;align-items:center;gap:.45rem;font-size:.85rem;color:var(--gris);margin-top:.9rem;cursor:pointer}
  .chk-fait input{width:15px;height:15px;accent-color:var(--vert);flex:0 0 auto}
  [hidden]{display:none}
  .flash ul.notations{margin:.4rem 0 .6rem;padding-left:1.1rem}
  .flash ul.notations li{margin:.15rem 0}
  .attention{background:rgba(214,64,43,.08);border-left:3px solid var(--rouge);padding:.5rem .8rem;font-size:.9rem;color:var(--encre);border-radius:4px;margin:.4rem 0}
  details.indice{margin:.35rem 0 .2rem}
  details.indice>summary{list-style:none;display:inline-flex;align-items:center;gap:.35rem;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:.76rem;color:var(--cyan);border:1px solid var(--cyan);border-radius:999px;padding:.18rem .7rem;user-select:none}
  details.indice>summary::-webkit-details-marker{display:none}
  details.indice>summary:hover{background:rgba(63,167,214,.10)}
  details.indice[open]>summary{background:rgba(63,167,214,.10)}
  details.indice .indice-corps{background:rgba(63,167,214,.07);border-left:3px solid var(--cyan);padding:.55rem .8rem;margin:.4rem 0 .2rem;font-size:.92rem}
  details.indice .indice-corps p{margin:.2rem 0}
  .exo-exemple{background:rgba(0,0,0,.025);border:1px solid var(--ligne);border-left:3px solid var(--orange);padding:.55rem .8rem;margin:.7rem 0 .2rem;font-size:.92rem;border-radius:4px}
  .exo-exemple p{margin:.25rem 0}
  .exo-exemple .ex-lab{font-family:'IBM Plex Mono',monospace;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);display:block;margin-bottom:.3rem}
  .oblig-note{background:rgba(240,167,46,.12);border-left:3px solid var(--ambre);padding:.6rem .9rem;font-size:.9rem;margin:0 0 1rem;border-radius:4px}
  .la-grid{display:grid;gap:1rem;margin:.5rem 0}
  .la-item h5{margin:.2rem 0 .35rem;font-size:.9rem;color:var(--encre)}
  .la-item iframe{width:100%;height:480px;border:0;border-radius:8px;background:#fff}
  .dl-row{display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0 .2rem}
  .dl-btn{display:inline-block;background:var(--cyan);color:#fff;text-decoration:none;font-weight:600;font-size:.88rem;padding:.55rem .85rem;border-radius:8px}
  .dl-btn:hover{filter:brightness(1.06)}
  .choix-msg{font-size:.9rem;color:var(--encre);background:rgba(63,167,214,.08);border-left:3px solid var(--cyan);padding:.6rem .9rem;margin-bottom:.8rem}
  details.media{border:1px solid var(--ligne);margin-bottom:.6rem;background:rgba(0,0,0,.012);border-radius:6px}
  details.media>summary{list-style:none;cursor:pointer;padding:.7rem .9rem;font-family:'IBM Plex Mono',monospace;font-size:.85rem;display:flex;gap:.5rem;align-items:center}
  details.media>summary::-webkit-details-marker{display:none}
  details.media>summary::before{content:"▸";color:var(--orange)}
  details.media[open]>summary::before{content:"▾"}
  details.media .flash{padding:.2rem .9rem 1rem}
  details.media .video{margin:.2rem .9rem 1rem}
  details.media .act-body{padding:.2rem .9rem 1rem}
  details.media.activite>summary{color:var(--encre);font-weight:600}
  details.media.activite .fait-mark{margin-left:auto;color:var(--vert);font-size:.78rem}
  .woo-act{margin:.6rem 0}
  .woo-act iframe{width:100%;height:480px;border:0;border-radius:8px;background:#fff}
  .review-note{font-family:'IBM Plex Mono',monospace;font-size:.78rem;color:var(--gris);margin:.6rem 0 0}
  body.en-diagnostic #prog-bar{display:none}
  #prog-bar .pb-cell[data-diag] .pb-lab{font-size:.5rem;letter-spacing:-.01em}
  .exo-attente{font-family:'IBM Plex Mono',monospace;font-size:.85rem;color:var(--gris);background:rgba(0,0,0,.03);border:1px dashed var(--ligne);border-radius:8px;padding:.8rem .9rem}
  #prog-bar{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;align-items:center;gap:5px;width:64px;padding:9px 8px;background:rgba(255,255,255,.92);border:1px solid var(--ligne);border-radius:10px}
  #prog-bar .pb-title{font-family:system-ui,sans-serif;font-size:.55rem;letter-spacing:.02em;text-transform:uppercase;color:var(--gris);white-space:nowrap}
  #prog-bar .pb-pct{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;color:var(--encre)}
  #prog-bar .pb-seg{display:flex;flex-direction:column;gap:5px;height:180px;width:28px}
  #prog-bar .pb-cell{position:relative;overflow:hidden;flex:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;border:1px solid var(--ligne);color:var(--gris)}
  #prog-bar .pb-cell.done{border-color:var(--vert);color:var(--vert)}
  #prog-bar .pb-cell.prog{border:1.6px dashed var(--ambre);color:var(--ambre)}
  #prog-bar .pb-cell.none{border:1px solid var(--ligne);color:var(--gris)}
  #prog-bar .pb-cell.revoir{border:1.6px solid var(--ambre);color:var(--ambre)}
  #prog-bar .pb-lab{position:relative;z-index:1}
  #prog-bar .pb-fill{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .3s ease}
  #prog-bar .pb-fill.h{background:repeating-linear-gradient(45deg,var(--ambre) 0 2px,transparent 2px 6px)}
  #prog-bar .pb-fill.g{background:rgba(47,174,106,.32)}
  @media (max-width:720px){ #prog-bar{right:6px;width:58px;padding:7px 6px} #prog-bar .pb-seg{width:22px;height:150px} #prog-bar .pb-title{font-size:.5rem} }

  /* ---- Images du QCM (réponses illustrées) ---- */
  .qcm-fig{display:block;width:100%;max-width:520px;height:auto;margin:.2rem 0 .6rem;border:1px solid var(--ligne);border-radius:6px;background:#fff}
  .opt .qcm-fig{max-width:340px;margin:.1rem 0 0}
  .opt{align-items:center}

  /* ---- Graphiques SVG (exercice 2) ---- */
  .fig{margin:.6rem 0 .2rem;border:1px solid var(--ligne);border-radius:8px;background:#fff;padding:.4rem}
  .fig svg{display:block;width:100%;height:auto}
  .fig figcaption{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--gris);text-align:center;padding:.3rem 0 .1rem}
  .lab-v1{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--orange);padding:.12rem .5rem;border-radius:999px;margin-left:.4rem;vertical-align:middle}

  .tube .verre{width:42px;height:120px;border:2px solid var(--encre);border-top:none;border-radius:0 0 16px 16px;position:relative;overflow:hidden;background:rgba(255,255,255,.5)}
  .tube .liquide{position:absolute;left:0;right:0;bottom:0;height:72%;transition:background .4s}
  .tube .etiq{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--gris)}
  .tube.inconnu .verre{border-color:var(--orange);box-shadow:0 0 0 2px rgba(232,116,59,.25)}
  .tube.inconnu .etiq{color:var(--orange);font-weight:600}

  .echelle-ctrl{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;justify-content:center;margin:.6rem 0}
  .echelle-ctrl input[type=range]{flex:1;min-width:160px;max-width:320px;accent-color:var(--orange)}
  .echelle-lecture{text-align:center;font-size:.95rem;margin:.4rem 0}
  .echelle-lecture b{font-family:'IBM Plex Mono',monospace;color:var(--orange)}
</style>

<script>
/* ============================================================
   CONTENU — 4 parties (axes). Questions : single (bonne) ou multi (multi:true, bonnes:[]).
   ============================================================ */
function frac(a,b){return '<span class="frac"><span class="num">'+a+'</span><span class="den">'+b+'</span></span>';}
const NOTION = {
  axes:[
    {
      id:"A", nom:"Méthode de l'échelle de teintes", videoSlot:true,
      pourquoi:"L'<strong>échelle de teintes</strong> est la version <em>visuelle</em> du dosage par étalonnage : on prépare une série de solutions de concentrations <strong>connues</strong> (la <strong>gamme d'étalons</strong>, obtenue par dilutions) et on compare la couleur de la solution inconnue pour l'<strong>encadrer</strong>. C'est rapide, semi-quantitatif, et c'est le réflexe d'analyse avant de passer à la mesure.",
      flash:`<p><strong>Prérequis — la dilution (Jour 6).</strong> Une échelle de teintes se prépare par dilutions successives d'une solution mère. Avant d'attaquer ce bloc, tu dois savoir :</p>
        <ul class="notations">
          <li>écrire et exploiter la relation de dilution : c<sub>m</sub>(mère)×V(mère) = c<sub>m</sub>(fille)×V(fille) ;</li>
          <li>choisir la verrerie (pipette jaugée, fiole jaugée) et rédiger le protocole ;</li>
          <li>manipuler le <strong>facteur de dilution</strong> F.</li>
        </ul>
        <p>Besoin d'un rappel ? <a href="diag-j06-dilution.html" style="color:var(--cyan);font-weight:600">→ Revoir le Jour 6 — La dilution</a></p>`,
      exercices:[],
      activites:[ { titre:"Animation — l'échelle de teintes", icone:"🎨", faitLabel:"J'ai exploré l'animation",
        html:`<p class="exo-consigne">Fais glisser le curseur pour préparer un « tube test », puis compare sa teinte à celle de l'échantillon inconnu (?). Quand les deux teintes se confondent, tu as encadré la concentration.</p>
          <div class="echelle" id="echelle-v1">
            <p class="etiq" style="text-align:center;margin:0 0 .2rem">Gamme d'étalons — concentrations connues</p>
            <div class="echelle-rangee" id="ech-standards"></div>

}

const STORE_KEY = "cahier-j07";
let PROG = (function(){ try{ const r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } })();
function saveProg(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(PROG)); }catch(e){} }
function freshProg(f, complet){
  PROG = { fautes:f.slice(), lu:{}, vu:{}, faits:{}, act:{}, diagComplet:!!complet };
  // Méthode B : à 0 faute sur une partie obligatoire, on pré-coche « lu/vu »
  // (l'élève maîtrise visiblement) pour ne laisser à faire que l'exercice + cartes.
  NOTION.axes.forEach((axe,i)=>{ if(axe.obligatoire && f[i]===0){ PROG.lu[axe.id]=true; PROG.vu[axe.id]=true; } });
  saveProg();
}
function clearProg(){ PROG=null; try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

function bonnesDe(q){ return q.multi ? q.bonnes : [q.bonne]; }

/* Méthode B : une partie « obligatoire » n'est validée (verte) que si ses items
   obligatoires sont faits (capsule/vidéo consultée + exercice(s) + activité(s)).
   Le seul score au diagnostic (0 faute) ne suffit pas à la passer au vert. */
function axeMandatoryDone(axe){
  const consulte = !!((PROG.lu&&PROG.lu[axe.id])||(PROG.vu&&PROG.vu[axe.id]));
  const exosOk = (axe.exercices||[]).every((ex,j)=> !!(PROG.faits&&PROG.faits[axe.id]&&PROG.faits[axe.id][j]));
  const actOk  = (axe.activites||[]).every((ac,k)=> !!(PROG.act&&PROG.act[axe.id]&&PROG.act[axe.id][k]));
  return consulte && exosOk && actOk;
}
function axeValide(axe,i){
  if(axe.obligatoire) return axeMandatoryDone(axe);
  return fautes[i]===0;
}
function badgeAxe(axe,i){
  const f = fautes[i];
  if(axe.obligatoire){
    if(axeMandatoryDone(axe)) return {cls:"v", label:"Validé ✓"};
    if(f===0) return {cls:"a", label:"À compléter"};   // diagnostic réussi mais exercice + cartes à faire
    if(f<=2)  return {cls:"a", label:"À revoir"};
    return     {cls:"r", label:"À retravailler"};
  }
  // Parties non obligatoires : comportement inchangé
  if(f===0) return {cls:"v", label:"À survoler"};
  if(f<=2)  return {cls:"a", label:"À revoir"};
  return     {cls:"r", label:"À retravailler"};
}
function priorite(f){
  if(f===0) return {cls:"v", label:"À survoler"};
  if(f<=2)  return {cls:"a", label:"À revoir"};
  return     {cls:"r", label:"À retravailler"};
}
function axeFini(axe){
  const hasGate = !!(axe.flash || axe.programme || (axe.video && !axe.videoBonus));
  const consulte = !!((PROG.lu&&PROG.lu[axe.id])||(PROG.vu&&PROG.vu[axe.id]));
  const exosOk = (axe.exercices||[]).every((ex,j)=> !!(PROG.faits&&PROG.faits[axe.id]&&PROG.faits[axe.id][j]));
  const actOk  = (axe.activites||[]).every((ac,k)=> !!(PROG.act&&PROG.act[axe.id]&&PROG.act[axe.id][k]));
  return (hasGate?consulte:true) && exosOk && actOk;
}
function axeEnCours(axe){
  const consulte = !!((PROG.lu&&PROG.lu[axe.id])||(PROG.vu&&PROG.vu[axe.id]));
  const someFait = (axe.exercices||[]).some((ex,j)=> !!(PROG.faits&&PROG.faits[axe.id]&&PROG.faits[axe.id][j]));
  const someAct  = (axe.activites||[]).some((ac,k)=> !!(PROG.act&&PROG.act[axe.id]&&PROG.act[axe.id][k]));
  return consulte || someFait || someAct || !!(PROG.touche&&PROG.touche[axe.id]);
}
function etatAxe(axe,i){
  if(axeFini(axe)) return {cls:"v", label:"Terminé"};
  if(axeEnCours(axe)) return {cls:"a", label:"En cours"};
  return priorite(fautes[i]);
}

function ecranIntro(){
  document.body.classList.add('en-diagnostic');
  answers=[]; idx=0;
  app.innerHTML = `
    <div class="intro">
      <p>Ce court diagnostic de <strong>5 questions</strong> cible la <strong>méthode de la courbe d'étalonnage</strong> (bloc B). Ce n'est pas une note. Une question a <strong>plusieurs réponses</strong> : elle te le signale.</p>
      <div class="note-simple">Les questions ne couvrent <strong>pas tout</strong> le contenu de la séance : elles t'aident seulement à voir par où commencer.</div>
      <div class="actions" style="justify-content:flex-start;gap:.7rem;flex-wrap:wrap">
        <button class="btn" id="go">Commencer le diagnostic →</button>
        <button class="btn fant" id="skip">Passer le diagnostic</button>
      </div>
      <p style="font-size:.8rem;color:var(--gris);margin-top:.8rem">« Passer le diagnostic » marque toutes les parties « à retravailler » et ouvre directement le plan complet.</p>
    </div>`;
  document.getElementById("go").onclick = ()=>{ idx=0; ecranQuestion(); };
  document.getElementById("skip").onclick = ()=>{ NBQ.forEach((n,i)=> fautes[i]=n); freshProg(fautes,false); ecranResultats(false); };
}

function ecranQuestion(){
  document.body.classList.add('en-diagnostic');
  const item = FLAT[idx];
  const axe = NOTION.axes[item.ai];
  const pct = Math.round((idx/FLAT.length)*100);
  const repondue = idx < answers.length;            // déjà validée → lecture seule
  const prev = repondue ? answers[idx] : null;
  const bonnes = bonnesDe(item);
  if(repondue){ selection = prev.sel.slice(); valide = true; }
  else { selection = []; valide = false; }

  const optsHTML = item.opts.map((o,i)=>{
    let cls = "opt";
    if(repondue){
      if(prev.sel.includes(i)) cls += " sel";
      if(bonnes.includes(i)) cls += " juste";
      else if(prev.sel.includes(i)) cls += " faux";
    }
    return `<button class="${cls}" data-i="${i}"${repondue?' disabled':''}><span class="lettre">${item.multi?'▢':LETTRES[i]}</span><span>${o}</span></button>`;
  }).join("");

  const actionBtn = repondue
    ? `<button class="btn" id="suivant">${idx===FLAT.length-1?'Voir mon plan →':'Suivant →'}</button>`
    : `<button class="btn" id="valider" disabled>Valider</button>`;

  app.innerHTML = `
    <div class="topbar">
      <span>Question ${idx+1} / ${FLAT.length}</span>
      <span class="axe-tag">Bloc ${axe.id} · ${axe.nom}</span>
    </div>
    <div class="barre"><i style="width:${pct}%"></i></div>
    <p class="enonce">${item.q}</p>
    ${item.multi ? `<p class="multi-hint">Plusieurs réponses possibles.</p>` : ``}
    <div class="opts" id="opts">${optsHTML}</div>
    <div id="zone-feedback">${repondue?feedbackHTML(item, prev.ok):''}</div>
    <div class="actions" style="flex-wrap:wrap;gap:.6rem">
      ${idx>0?`<button class="btn fant" id="prec">← Précédent</button>`:``}
      ${actionBtn}
      <button class="btn fant" id="passer">Passer le diagnostic →</button>
    </div>
    ${repondue?`<p class="review-note">Question déjà répondue : tu la revois en lecture seule (réponse non modifiable).</p>`:''}`;

  if(!repondue){
    document.querySelectorAll("#opts .opt").forEach(b=>{
      b.onclick = ()=>{
        if(valide) return;
        const i = +b.dataset.i;
        if(item.multi){
          const k = selection.indexOf(i);
          if(k>=0){ selection.splice(k,1); b.classList.remove("sel"); }
          else { selection.push(i); b.classList.add("sel"); }
        } else {
          selection = [i];
          document.querySelectorAll("#opts .opt").forEach(x=>x.classList.remove("sel"));
          b.classList.add("sel");
        }
        document.getElementById("valider").disabled = selection.length===0;
      };
    });
    document.getElementById("valider").onclick = onValider;
  } else {
    document.getElementById("suivant").onclick = ()=>{ idx++; if(idx<FLAT.length) ecranQuestion(); else finDiagnostic(); };
  }
  const prec = document.getElementById("prec"); if(prec) prec.onclick = ()=>{ idx--; ecranQuestion(); };
  document.getElementById("passer").onclick = passerDiagnostic;
}

function onValider(){
  if(valide) return;
  valide = true;
  const item = FLAT[idx];
  const bonnes = bonnesDe(item);
  const opts = document.querySelectorAll("#opts .opt");
  opts.forEach((b,i)=>{ b.disabled=true; if(bonnes.includes(i)) b.classList.add("juste"); else if(selection.includes(i)) b.classList.add("faux"); });
  const ok = selection.length===bonnes.length && selection.every(i=>bonnes.includes(i));
  if(!ok) fautes[item.ai]++;
  answers[idx] = { sel:selection.slice(), ok };
  document.getElementById("zone-feedback").innerHTML = feedbackHTML(item, ok);
  const vb = document.getElementById("valider");
  vb.textContent = (idx===FLAT.length-1) ? "Voir mon plan →" : "Suivant →";
  vb.disabled = false;
  vb.onclick = ()=>{ idx++; if(idx<FLAT.length) ecranQuestion(); else finDiagnostic(); };
}

function ecranResultats(autoOpen){
  document.body.classList.remove('en-diagnostic');
  if(!PROG) PROG = { fautes:fautes.slice(), lu:{}, vu:{}, faits:{}, act:{}, diagComplet:true };

  const ordre = NOTION.axes.map((axe,i)=>({axe, i, f:fautes[i]}));
  ordre.sort((a,b)=>{
    const va = axeValide(a.axe,a.i)?1:0, vb = axeValide(b.axe,b.i)?1:0;
    if(va!==vb) return va-vb;      // parties non validées avant parties validées
    return a.i-b.i;               // sinon ordre des parties (1,2,3,4)
  });

  const cartes = ordre.map(({axe,i,f})=>{
    const p = etatAxe(axe,i);
    const nb = axe.questions.length;
    const exos = axe.exercices.length ? axe.exercices.map((ex,j)=>{
      if(ex.attente){
        return `<div class="exo-attente">⏳ Exercice en attente — il sera ajouté prochainement.</div>`;
      }
      if(ex.type==="wooclap"){
        return `
        <details class="exo" data-type="wooclap" data-ax="${axe.id}" data-j="${j}">
          <summary><span class="exo-num">Exercice</span> <span class="exo-titre">${ex.titre}</span><span class="fait-mark" hidden>✓ fait</span></summary>
          <div class="exo-body">
            <p class="exo-consigne">${ex.consigne}</p>
            <div class="woo-exo"><iframe src="${ex.src}" title="${ex.titre}" allow="fullscreen" loading="lazy"></iframe></div>
            <p class="woo-note">Rien ne s'affiche ? <a href="${ex.src}" target="_blank" rel="noopener">ouvrir dans un onglet</a>.</p>
            <label class="chk-fait"><input type="checkbox"> J'ai fait cet exercice</label>
          </div>
        </details>`;
      }
      if(ex.type==="html"){
        return `
        <details class="exo" data-ax="${axe.id}" data-j="${j}">
          <summary><span class="exo-num">${ex.num||'Activité'}</span> <span class="exo-titre">${ex.titre}</span><span class="fait-mark" hidden>✓ fait</span></summary>
          <div class="exo-body">
            ${ex.html}
            <label class="chk-fait"><input type="checkbox"> ${ex.faitLabel||"J'ai fait cette activité"}</label>
          </div>
        </details>`;
      }
      return `
        <details class="exo" data-timer="${ex.timer}" data-ax="${axe.id}" data-j="${j}">
          <summary><span class="exo-num">Exercice ${j+1}</span> <span class="exo-titre">${ex.titre}</span><span class="fait-mark" hidden>✓ fait</span></summary>
          <div class="exo-body">
            <div class="exo-enonce">${ex.enonce}</div>
            <p class="exo-consigne">✏️ Fais cet exercice sur ta feuille, puis vérifie. Le corrigé se débloque après un court instant.</p>
            <div class="exo-btns"><button type="button" class="mini btn-corr" disabled>Correction…</button></div>
            <div class="exo-corr" hidden>${ex.correction}</div>
            <label class="chk-fait"><input type="checkbox"> J'ai fait cet exercice</label>
          </div>
        </details>`;
    }).join("") : `<p class="vide">Exercices à ajouter (depuis ton cours).</p>`;

    const hasCapsule = !!(axe.flash || axe.programme);
    const capsuleLabel = axe.flash ? "📖 Lire la capsule (rappel de cours)" : "📖 Lire — où ça se place dans le programme";
    const capsuleDetails = hasCapsule
      ? `<details class="media"><summary>${capsuleLabel}</summary><div class="flash">${axe.flash||axe.programme}</div></details>`
      : ``;
    const videoDetails = axe.video
      ? `<details class="media"><summary>${axe.videoBonus?'🎬 Vidéo bonus':'🎬 Regarder la vidéo'}</summary><div class="video"><iframe src="https://www.youtube.com/embed/${axe.video}" title="Vidéo — ${axe.nom}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></details>`
      : (axe.videoSlot ? `<div class="video-slot">🎬 Vidéo « ${axe.nom} » — à intégrer (lien à venir)</div>` : ``);
    const choixMsg = (hasCapsule && axe.video)
      ? `<p class="choix-msg">Choisis le format qui te convient : <strong>lis la capsule</strong> <em>ou</em> <strong>regarde la vidéo</strong>. Pas besoin des deux.</p>`
      : ``;
    const gateLu = hasCapsule ? `<label><input type="checkbox" class="chk-lu"> J'ai ${axe.flash?'lu la capsule':'lu le programme'}</label>` : ``;
    const gateVu = (axe.video && !axe.videoBonus) ? `<label><input type="checkbox" class="chk-vu"> J'ai regardé la vidéo</label>` : ``;
    const gateBloc = (gateLu || gateVu) ? `<div class="gate">${gateLu}${gateVu}</div>` : ``;

    const activites = (axe.activites && axe.activites.length) ? axe.activites.map((ac,k)=>`
        <details class="media activite" data-ax="${axe.id}" data-act="${k}">
          <summary>${ac.icone||'📐'} ${ac.titre}<span class="fait-mark" hidden>✓ fait</span></summary>
          <div class="act-body">
            ${ac.html}
            <label class="chk-fait"><input type="checkbox"> ${ac.faitLabel||"J'ai fait cette activité"}</label>
          </div>
        </details>`).join("") : ``;
    const activitesSection = activites ? `<section class="bloc"><h4>Activité${axe.activites.length>1?'s':''}</h4>${activites}</section>` : ``;

    const verrouMsg = (gateLu || gateVu) ? `<p class="verrou-msg">🔒 Consulte ${hasCapsule?(axe.flash?'la capsule':'le programme'):''}${hasCapsule&&axe.video?' ou ':''}${axe.video?'la vidéo':''}, puis coche pour débloquer les exercices.</p>` : ``;
    const exosSection = (axe.exercices && axe.exercices.length) ? `<section class="bloc"><h4>Exercices</h4>${verrouMsg}<div class="exos${(gateLu||gateVu)?' verrou':''}">${exos}</div></section>` : ``;

    return `
      <details class="axe ${p.cls}" data-axe="${axe.id}">
        <summary>
          <span class="badge ${p.cls}">${p.label}</span>
          <span class="axe-nom">Bloc ${axe.id} — ${axe.nom}</span>
          <span class="axe-score"${(PROG.ouvert&&PROG.ouvert[axe.id])?' hidden':''}>${nb-f}/${nb}</span>
        </summary>
        <div class="axe-corps">
          <div class="pourquoi"><b>Pourquoi c'est important</b>${axe.pourquoi}</div>
          ${axe.obligatoire ? `<p class="oblig-note">📌 Cette partie n'est <strong>validée</strong> que lorsque tu as <strong>fait l'exercice</strong> et <strong>complété les cartes mentales</strong> — à faire chez toi, même si tu as réussi le diagnostic.</p>` : ``}
          ${choixMsg}
          ${capsuleDetails}
          ${videoDetails}
          ${gateBloc}
          ${activitesSection}
          ${exosSection}
        </div>
      </details>`;
  }).join("");

  app.innerHTML = `
    <div class="topbar"><span>Ton plan de révision</span><span class="axe-tag">classé par priorité</span></div>
    <div class="res-note">Rappel : ces questions ne couvrent pas tout. Même une partie « à survoler » mérite un coup d'œil. Ton avancement est gardé en mémoire sur cet appareil.</div>
    ${cartes}
    <div style="background:var(--nuit);color:var(--clair);padding:1rem 1.2rem;font-size:.95rem;margin-top:1rem">Peu de temps ? Suis l'ordre proposé : les parties en haut sont les plus prioritaires.</div>
    <div class="actions" style="margin-top:1.4rem;justify-content:flex-start">
      <button class="btn fant" id="recommencer">↻ Refaire le diagnostic</button>
    </div>`;

  // Verrou lu/vu par partie
  document.querySelectorAll('details.axe').forEach(ax=>{
    const id = ax.dataset.axe;
    const chkLu = ax.querySelector('.chk-lu'); // peut être absent
    const chkVu = ax.querySelector('.chk-vu'); // peut être absent
    const exos = ax.querySelector('.exos');
    const msg = ax.querySelector('.verrou-msg');
    if(chkLu) chkLu.checked = !!(PROG.lu && PROG.lu[id]);
    if(chkVu) chkVu.checked = !!(PROG.vu && PROG.vu[id]);
    function updateGate(){
      const consulte = (chkLu && chkLu.checked) || (chkVu && chkVu.checked);
      if(exos) exos.classList.toggle('verrou', !consulte);
      if(msg) msg.hidden = consulte;
    }
    updateGate();
    if(chkLu) chkLu.addEventListener('change', ()=>{ PROG.lu=PROG.lu||{}; PROG.lu[id]=chkLu.checked; saveProg(); updateGate(); });
    if(chkVu) chkVu.addEventListener('change', ()=>{ PROG.vu=PROG.vu||{}; PROG.vu[id]=chkVu.checked; saveProg(); updateGate(); });
  });

  // Exercices : minuteur (exos normaux) + case fait
  document.querySelectorAll('details.exo').forEach(exo=>{
    const axId = exo.dataset.ax, j = exo.dataset.j;
    const bc = exo.querySelector('.btn-corr');
    const corr = exo.querySelector('.exo-corr');
    if(bc && corr){
      const sec = +exo.dataset.timer; let started=false;
      function startTimer(){ let left=sec; const tick=()=>{ if(left<=0){ bc.disabled=false; bc.textContent='Voir la correction'; return;} bc.textContent='Correction dans '+left+' s'; left--; setTimeout(tick,1000); }; tick(); }
      exo.addEventListener('toggle', ()=>{ if(exo.open && !started){ started=true; startTimer(); } });
      bc.addEventListener('click', ()=>{ if(bc.disabled) return; corr.hidden=!corr.hidden; bc.textContent = corr.hidden?'Voir la correction':'Masquer la correction'; });
    }
    const cf = exo.querySelector('.chk-fait input');
    const mark = exo.querySelector('.fait-mark');
    const fait = !!(PROG.faits && PROG.faits[axId] && PROG.faits[axId][j]);
    cf.checked = fait; if(mark) mark.hidden = !fait;
    cf.addEventListener('change', ()=>{ PROG.faits=PROG.faits||{}; PROG.faits[axId]=PROG.faits[axId]||{}; PROG.faits[axId][j]=cf.checked; saveProg(); if(mark) mark.hidden=!cf.checked; });
  });

  // Activités : case « fait » (libres d'accès, stockées dans PROG.act)
  document.querySelectorAll('details.activite').forEach(ac=>{
    const axId = ac.dataset.ax, k = ac.dataset.act;
    const cf = ac.querySelector('.chk-fait input');
    const mark = ac.querySelector('.fait-mark');
    if(!cf) return;
    const fait = !!(PROG.act && PROG.act[axId] && PROG.act[axId][k]);
    cf.checked = fait; if(mark) mark.hidden = !fait;
    cf.addEventListener('change', ()=>{ PROG.act=PROG.act||{}; PROG.act[axId]=PROG.act[axId]||{}; PROG.act[axId][k]=cf.checked; saveProg(); if(mark) mark.hidden=!cf.checked; });
  });
  // Méthode B : rafraîchir en direct le badge (vert/jaune) des parties obligatoires
  function refreshEtats(){
    NOTION.axes.forEach((axe,i)=>{
      const det = document.querySelector('details.axe[data-axe="'+axe.id+'"]');
      if(!det) return;
      const b = etatAxe(axe,i);
      det.className = 'axe '+b.cls;
      const badgeEl = det.querySelector('.badge');
      if(badgeEl){ badgeEl.className = 'badge '+b.cls; badgeEl.textContent = b.label; }
      if(PROG.ouvert && PROG.ouvert[axe.id]){ const sc = det.querySelector('.axe-score'); if(sc) sc.hidden = true; }
    });
  }
  NOTION.axes.forEach((axe,i)=>{
    const det = document.querySelector('details.axe[data-axe="'+axe.id+'"]');
    if(!det) return;
    det.addEventListener('toggle', ()=>{
      if(det.open){ PROG.ouvert = PROG.ouvert||{}; if(!PROG.ouvert[axe.id]){ PROG.ouvert[axe.id]=true; saveProg(); } }
      refreshEtats();
    });
    det.querySelectorAll('details').forEach((sub)=>{
      sub.addEventListener('toggle', ()=>{ if(sub.open){ PROG.touche = PROG.touche||{}; if(!PROG.touche[axe.id]){ PROG.touche[axe.id]=true; saveProg(); refreshEtats(); } } });
    });
  });
  document.addEventListener('change', refreshEtats);
  refreshEtats();

  document.getElementById("recommencer").onclick = ()=>{ clearProg(); fautes.fill(0); ecranIntro(); };
}

// Démarrage : reprise si une session est sauvegardée
if(PROG && Array.isArray(PROG.fautes)){
  PROG.fautes.forEach((v,i)=> fautes[i]=v);
  ecranResultats(true);
} else {
  ecranIntro();
}
</script>

<div id="prog-bar" aria-label="Progression par bloc">
  <div class="pb-title">Progression</div>
  <div class="pb-pct">0 %</div>
  <div class="pb-seg">
    <div class="pb-cell none" data-diag="1" title="Diagnostic"><span class="pb-fill"></span><span class="pb-lab">Diag</span></div>
    <div class="pb-cell none" data-axe="A"><span class="pb-fill"></span><span class="pb-lab">A</span></div>
    <div class="pb-cell none" data-axe="B"><span class="pb-fill"></span><span class="pb-lab">B</span></div>
  </div>
</div>
<script>
/* Jour 7 — barre de progression : Diagnostic + blocs A, B.
   Publie le contrat "cahier-progression" lu par l'accueil. Chaque bloc =
   (capsule/vidéo consultée) + exercices faits + activités faites.
   La barre est masquée pendant le diagnostic (classe body.en-diagnostic). */
(function(){
  var JOUR=7, TITRE="Dosage par étalonnage", CLE='cahier-j07';
  var AXES=[{id:'A',exos:0,act:1},{id:'B',exos:1,act:0,nogate:true}];
  function lire(){ try{var r=localStorage.getItem(CLE);return r?JSON.parse(r):null;}catch(e){return null;} }
  function lireOuv(){ try{var r=localStorage.getItem('cahier-j07-ouverts');return r?JSON.parse(r):{};}catch(e){return {};} }
  function saveOuv(o){ try{localStorage.setItem('cahier-j07-ouverts',JSON.stringify(o));}catch(e){} }
  function deuxch(n){ return (n<10?'0':'')+n; }
  function ajd(){ var d=new Date();return d.getFullYear()+'-'+deuxch(d.getMonth()+1)+'-'+deuxch(d.getDate()); }
  function paint(c,state,frac,extra){
    if(!c) return;
    c.className='pb-cell '+state+(extra?(' '+extra):'');
    var fill=c.querySelector('.pb-fill');
    if(fill){ fill.className='pb-fill'+(state==='done'?' g':(state==='prog'?' h':'')); fill.style.height=Math.round(frac*100)+'%'; }
  }
  function setCell(id,state,frac,extra){ paint(document.querySelector('#prog-bar .pb-cell[data-axe="'+id+'"]'),state,frac,extra); }
  function setDiag(state,frac){ paint(document.querySelector('#prog-bar .pb-cell[data-diag]'),state,frac); }
  function publier(axes,pf,pt){
    try{
      var all={}; try{all=JSON.parse(localStorage.getItem('cahier-progression'))||{};}catch(e){}
      var faits=0; axes.forEach(function(a){if(a.etat==='done')faits++;});
      var date=(all[JOUR]&&all[JOUR].date)?all[JOUR].date:ajd();
      all[JOUR]={titre:TITRE,date:date,axes:axes,axesFaits:faits,axesTotal:axes.length,pct:(pt?Math.round(pf/pt*100):0),termine:(faits===axes.length)};
      localStorage.setItem('cahier-progression',JSON.stringify(all));
    }catch(e){}
  }
  function retirer(){ try{var all=JSON.parse(localStorage.getItem('cahier-progression'))||{}; if(all[JOUR]){delete all[JOUR];localStorage.setItem('cahier-progression',JSON.stringify(all));}}catch(e){} }
  function maj(){
    var P=lire(), pctEl=document.querySelector('#prog-bar .pb-pct');
    if(!P){ saveOuv({}); setDiag('none',0); AXES.forEach(function(ax){setCell(ax.id,'none',0);}); if(pctEl)pctEl.textContent='0 %'; retirer(); return; }
    var ouv=lireOuv(), pf=0, pt=0, axes=[];
    var diagFini=!!P.diagComplet;
    setDiag(diagFini?'done':'prog', diagFini?1:0.5);
    pf+=(diagFini?1:0); pt+=1;
    AXES.forEach(function(ax, i){
      var det=document.querySelector('details.axe[data-axe="'+ax.id+'"]');
      if(det){ if(det.open) ouv[ax.id]=true; if(!det._barHook){det._barHook=true;det.addEventListener('toggle',function(){if(det.open){var o=lireOuv();o[ax.id]=true;saveOuv(o);}maj();});} }
      var fa=(P.fautes&&typeof P.fautes[i]==='number')?P.fautes[i]:null;
      var vert=fa===0, revoir=(fa>=1&&fa<=2);
      var consulte=!!((P.lu&&P.lu[ax.id])||(P.vu&&P.vu[ax.id]));
      var nE=0; for(var j=0;j<ax.exos;j++){ if(P.faits&&P.faits[ax.id]&&P.faits[ax.id][j]) nE++; }
      var nA=0; for(var k=0;k<ax.act;k++){ if(P.act&&P.act[ax.id]&&P.act[ax.id][k]) nA++; }
      var hasGate=!ax.nogate;
      var total=(hasGate?1:0)+ax.exos+ax.act;
      var acquis = ax.oblig ? (consulte&&nE===ax.exos&&nA===ax.act) : (vert||((hasGate?consulte:true)&&nE===ax.exos&&nA===ax.act));
      var steps=acquis?total:((hasGate&&consulte?1:0)+nE+nA); pf+=steps; pt+=total;
      var ouvert=!!ouv[ax.id], touche=acquis||ouvert||consulte||nE>0||nA>0;
      var state=acquis?'done':(touche?'prog':'none');
      setCell(ax.id,state,steps/total,(revoir&&!acquis)?'revoir':'');
      axes.push({id:ax.id,etat:state,pct:Math.round(steps/total*100)});
    });
    saveOuv(ouv);
    if(pctEl)pctEl.textContent=Math.round((pt?pf/pt:0)*100)+' %';
    publier(axes,pf,pt);
  }
  maj();
  document.addEventListener('change',maj);
  var root=document.getElementById('app');
  if(root){ try{ new MutationObserver(maj).observe(root,{childList:true,subtree:true}); }catch(e){} }
})();
</script>

<script>
/* Animation échelle de teintes (bloc A). Les <script> injectés via innerHTML
   ne s'exécutent pas : on initialise donc via un MutationObserver sur #app. */
(function(){
  function colorEch(c){ var a=(0.05+0.9*(c/10)); return 'rgba(38,116,180,'+a.toFixed(3)+')'; }
  function initEchelle(){
    var root=document.getElementById('echelle-v1');
    if(!root || root.dataset.init) return; root.dataset.init='1';
    var std=[0,2,4,6,8,10], cU=7;
    var srow=root.querySelector('#ech-standards');
    srow.innerHTML=std.map(function(c){
      return '<div class="tube"><div class="verre"><div class="liquide" style="background:'+colorEch(c)+'"></div></div><div class="etiq">'+c+'</div></div>';
    }).join('');
    var test=root.querySelector('#ech-test .liquide');
    var unkTube=root.querySelector('#ech-unk'), unk=unkTube.querySelector('.liquide');
    unk.style.background=colorEch(cU);
    var range=root.querySelector('#ech-range'), val=root.querySelector('#ech-val'), fb=root.querySelector('#ech-feedback');
    function upd(){ var c=parseFloat(range.value); test.style.background=colorEch(c); val.textContent=(''+c).replace('.',','); }
    range.addEventListener('input',upd); upd();
    root.querySelector('#ech-compare').addEventListener('click',function(){
      var c=parseFloat(range.value);
      if(Math.abs(c-cU)<0.5){
        unkTube.classList.add('match');
        fb.innerHTML='✅ Les teintes se confondent : l\'échantillon a la même concentration que ton tube test, soit <b>C ≈ '+cU+' mg·L⁻¹</b>. Sur une vraie échelle, on l\'encadrerait entre les étalons 6 et 8 mg·L⁻¹.';
      } else {
        unkTube.classList.remove('match');
        fb.innerHTML = (c<cU ? '➕ Ton tube test est <b>trop clair</b> : augmente la concentration.' : '➖ Ton tube test est <b>trop foncé</b> : diminue la concentration.');
      }
    });
  }
  var root=document.getElementById('app');
  if(root){ try{ new MutationObserver(initEchelle).observe(root,{childList:true,subtree:true}); }catch(e){} }
  document.addEventListener('click',function(e){ if(e.target && e.target.closest && e.target.closest('details')) setTimeout(initEchelle,0); });
  initEchelle();
})();
</script>
