          siFaux:"Dans le dioxygène, les deux atomes sont reliés par des <strong>doublets liants</strong> (électrons partagés), et chaque atome porte aussi des <strong>doublets non liants</strong> (paires restant autour d'un seul atome). Le dioxygène présente donc <strong>les deux types de doublets</strong>.",
          siJuste:"Le dioxygène réunit les deux types : des <strong>doublets liants</strong> entre les atomes et des <strong>doublets non liants</strong> autour de chacun." },
        { q:"Un doublet non liant est :",
          opts:["Un doublet d'électrons partagé entre deux atomes","Un doublet d'électrons de valence qui ne participe à aucune liaison","Un doublet formé par deux protons","Un doublet d'électrons situé dans le noyau"],
          bonne:1,
          siFaux:"Un <strong>doublet non liant</strong> est une paire d'électrons de valence qui <strong>ne participe à aucune liaison</strong>. Contrairement au doublet liant, il n'est pas partagé : il reste autour d'un seul atome.",
          siJuste:"Un doublet non liant est une paire d'électrons de valence qui reste <strong>autour d'un seul atome</strong>, sans former de liaison." },
        { q:"Dans la molécule d'eau H₂O, l'atome d'oxygène (1s² 2s² 2p⁴) possède :",
          opts:["Deux liaisons covalentes et deux doublets non liants","Une liaison covalente et trois doublets non liants","Quatre liaisons covalentes et aucun doublet non liant","Aucun doublet non liant et aucune liaison"],
          bonne:0,
          siFaux:"L'oxygène possède <strong>six électrons de valence</strong>. Dans l'eau, il forme <strong>deux liaisons covalentes</strong> avec les hydrogènes (deux doublets liants) et conserve <strong>deux doublets non liants</strong>, comme le montre le schéma ci-dessous.",
          siJuste:"Dans l'eau, l'oxygène engage <strong>deux doublets liants</strong> avec les hydrogènes et garde <strong>deux doublets non liants</strong> autour de lui.",
          imgR:SCH_h2o }
      ]
    }
  ]
};

/* ============================================================
   2) MOTEUR
   ============================================================ */
const app = document.getElementById("app");
const LETTRES = ["A","B","C","D","E"];
const FLAT = [];
NOTION.axes.forEach((axe,ai)=> axe.questions.forEach(qu=> FLAT.push({...qu, ai})));

let idx = 0, choisi = null, valide = false;
const fautes = NOTION.axes.map(()=>0);

/* --- Sauvegarde dans le navigateur (localStorage) ---
   Tout est entouré de try/catch : si le stockage est indisponible
   (aperçu, navigation privée…), la page fonctionne quand même, sans mémoire. */
const STORE_KEY = "cahier-j02";
let PROG = (function(){ try{ const r=localStorage.getItem(STORE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } })();
function saveProg(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(PROG)); }catch(e){} }
function freshProg(f){ PROG = { fautes:f.slice(), lu:{}, vu:{}, faits:{} }; saveProg(); }
function clearProg(){ PROG=null; try{ localStorage.removeItem(STORE_KEY); }catch(e){} }

function priorite(f){
  if(f===0) return {cls:"v", label:"À survoler"};
  if(f<=2)  return {cls:"a", label:"À revoir"};
  return     {cls:"r", label:"À retravailler"};
}

function ecranIntro(){
  app.innerHTML = `
    <div class="intro">
      <p>Ce diagnostic de <strong>15 questions</strong> (3 axes) sert à repérer ce que tu maîtrises déjà. Ce n'est pas une note.</p>
      <div class="note-simple">Les questions sont parfois <strong>très simples</strong> et, surtout, elles <strong>ne couvrent pas l'ensemble des notions</strong> de la séance. Bien y répondre ne veut donc pas dire que tout est maîtrisé : ça t'aide seulement à voir par où commencer.</div>
      <div class="actions" style="justify-content:flex-start;gap:.7rem;flex-wrap:wrap">
        <button class="btn" id="go">Commencer le diagnostic →</button>
        <button class="btn fant" id="skip">Passer le diagnostic</button>
      </div>
      <p style="font-size:.8rem;color:var(--gris);margin-top:.8rem">« Passer le diagnostic » marque tous les axes « à retravailler » et ouvre directement le plan complet (utile en cas de bug, ou pour aller droit aux révisions).</p>
    </div>`;
  document.getElementById("go").onclick = ()=>{ idx=0; ecranQuestion(); };
  document.getElementById("skip").onclick = ()=>{ fautes.fill(5); freshProg(fautes); ecranResultats(false); };
}

function ecranQuestion(){
  choisi=null; valide=false;
  const item = FLAT[idx];
  const axe = NOTION.axes[item.ai];
  const pct = Math.round((idx/FLAT.length)*100);
  app.innerHTML = `
    <div class="topbar">
      <span>Question ${idx+1} / ${FLAT.length}</span>
      <span class="axe-tag">Axe ${axe.id} · ${axe.nom}</span>
    </div>
    <div class="barre"><i style="width:${pct}%"></i></div>
    <p class="enonce">${item.q}</p>
    ${item.imgQ ? `<div class="illus">${item.imgQ}</div>` : ""}
    <div class="opts" id="opts">
      ${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="lettre">${LETTRES[i]}</span><span>${o}</span></button>`).join("")}
    </div>
    <div id="zone-feedback"></div>
    <div class="actions"><button class="btn" id="valider" disabled>Valider</button></div>`;

  document.querySelectorAll("#opts .opt").forEach(b=>{
    b.onclick = ()=>{
      if(valide) return;
      choisi = +b.dataset.i;
      document.querySelectorAll("#opts .opt").forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel");
      document.getElementById("valider").disabled = false;
    };
  });
  document.getElementById("valider").onclick = onValider;
}

function onValider(){
  if(!valide){
    valide = true;
    const item = FLAT[idx];
    const opts = document.querySelectorAll("#opts .opt");
    opts.forEach((b,i)=>{ b.disabled = true; if(i===item.bonne) b.classList.add("juste"); else if(i===choisi) b.classList.add("faux"); });
    const ok = choisi===item.bonne;
    if(!ok) fautes[item.ai]++;
    const texte = ok ? item.siJuste : item.siFaux;
    document.getElementById("zone-feedback").innerHTML = `
      <div class="feedback ${ok?'ok':'ko'}">
        <span class="res">${ok ? 'Bonne réponse' : 'Réponse incorrecte'}</span>
        <p>${texte}</p>
        ${item.imgR ? `<div class="illus">${item.imgR}</div>` : ""}
      </div>`;
    const b = document.getElementById("valider");
    b.textContent = (idx===FLAT.length-1) ? "Voir mon plan →" : "Suivant →";
  } else {
    idx++;
    if(idx<FLAT.length) ecranQuestion(); else { freshProg(fautes); ecranResultats(false); }
  }
}

function ecranResultats(autoOpen){
  if(!PROG) PROG = { fautes:fautes.slice(), lu:{}, vu:{}, faits:{} };

  // Ordre : axes non-verts d'abord, en respectant A puis B puis C.
  // Les axes verts (aucune faute) sont renvoyés à la fin.
  const ordre = NOTION.axes.map((axe,i)=>({axe, i, f:fautes[i]}));
  ordre.sort((a,b)=>{
    const ga = a.f===0 ? 1 : 0, gb = b.f===0 ? 1 : 0;
    if(ga!==gb) return ga - gb;   // non-vert avant vert
    return a.i - b.i;             // sinon ordre A, B, C
  });

  const cartes = ordre.map(({axe,f})=>{
    const p = priorite(f);
    const exos = axe.exercices.map((ex,j)=>`
      <details class="exo" data-timer="${ex.timer}" data-ax="${axe.id}" data-j="${j}">
        <summary><span class="exo-num">Exercice ${j+1}</span> <span class="exo-titre">${ex.titre}</span><span class="fait-mark" hidden>✓ fait</span></summary>
        <div class="exo-body">
          <p class="exo-enonce">${ex.enonce}</p>
          <p class="exo-consigne">✏️ Fais cet exercice sur ta feuille, puis vérifie. Le corrigé se débloque après un court instant.</p>
          <div class="exo-btns">
            ${ex.exemple ? '<button type="button" class="mini btn-exemple">Voir un exemple</button>' : ''}
            <button type="button" class="mini btn-corr" disabled>Correction…</button>
          </div>
          ${ex.exemple ? `<div class="exo-exemple" hidden>${ex.exemple}</div>` : ''}
          <div class="exo-corr" hidden>${ex.correction}</div>
          <label class="chk-fait"><input type="checkbox"> J'ai fait cet exercice</label>
        </div>
      </details>`).join("");
    return `
      <details class="axe ${p.cls}" data-axe="${axe.id}">
        <summary>
          <span class="badge ${p.cls}">${p.label}</span>
          <span class="axe-nom">Axe ${axe.id} — ${axe.nom}</span>
          <span class="axe-score">${5-f}/5</span>
        </summary>
        <div class="axe-corps">
          <div class="pourquoi"><b>Pourquoi c'est important</b>${axe.pourquoi}</div>
          <p class="choix-msg">Choisis le format qui te convient : <strong>lis la capsule</strong> <em>ou</em> <strong>regarde la vidéo</strong>. Pas besoin des deux — l'essentiel est de revoir la notion sans te surcharger.</p>
          <details class="media"><summary>📖 Lire la capsule (rappel de cours)</summary><div class="flash">${axe.flash}</div></details>
          <details class="media"><summary>🎬 Regarder la vidéo</summary><div class="video"><iframe src="https://www.youtube.com/embed/${axe.video}" title="Vidéo — ${axe.nom}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></details>
          <div class="gate">
            <label><input type="checkbox" class="chk-lu"> J'ai lu la capsule</label>
            <label><input type="checkbox" class="chk-vu"> J'ai regardé la vidéo</label>
          </div>
          <section class="bloc">
            <h4>Exercices</h4>
            <p class="verrou-msg">🔒 Consulte la capsule <strong>ou</strong> la vidéo (au choix), puis coche-la pour débloquer les exercices.</p>
            <div class="exos verrou">${exos}</div>
          </section>
        </div>
      </details>`;
  }).join("");

  app.innerHTML = `
    <div class="topbar"><span>Ton plan de révision</span><span class="axe-tag">classé par priorité</span></div>
    <div class="res-note">Rappel : ces questions sont simples et ne couvrent pas tout. Même un axe « à survoler » mérite un coup d'œil pour bien démarrer la 1re. Ton avancement est gardé en mémoire sur cet appareil.</div>
    ${cartes}
    <div class="conseil-temps" style="background:var(--nuit);color:var(--clair);padding:1rem 1.2rem;font-size:.95rem;margin-top:1rem">Peu de temps ? Suis l'ordre proposé : les axes en haut sont les plus prioritaires.</div>
    <div class="actions" style="margin-top:1.4rem;justify-content:flex-start">
      <button class="btn fant" id="recommencer">↻ Refaire le diagnostic</button>
    </div>`;

  // Verrou cours/vidéo par axe + restauration depuis la sauvegarde
  document.querySelectorAll('details.axe').forEach(ax=>{
    const id = ax.dataset.axe;
    const chkLu = ax.querySelector('.chk-lu');
    const chkVu = ax.querySelector('.chk-vu');
    const exos = ax.querySelector('.exos');
    const msg = ax.querySelector('.verrou-msg');
    chkLu.checked = !!(PROG.lu && PROG.lu[id]);
    chkVu.checked = !!(PROG.vu && PROG.vu[id]);
    function updateGate(){
      const ouvert = chkLu.checked || chkVu.checked;
      exos.classList.toggle('verrou', !ouvert);
      msg.hidden = ouvert;
    }
    updateGate();
    chkLu.addEventListener('change', ()=>{ PROG.lu = PROG.lu||{}; PROG.lu[id]=chkLu.checked; saveProg(); updateGate(); });
    chkVu.addEventListener('change', ()=>{ PROG.vu = PROG.vu||{}; PROG.vu[id]=chkVu.checked; saveProg(); updateGate(); });
  });

  // Exercices : minuteur à l'ouverture + case « fait »
  document.querySelectorAll('details.exo').forEach(exo=>{
    const sec = +exo.dataset.timer, axId = exo.dataset.ax, j = exo.dataset.j;
    const bc = exo.querySelector('.btn-corr');
    const corr = exo.querySelector('.exo-corr');
    let started = false;
    function startTimer(){
      let left = sec;
      const tick = ()=>{
        if(left<=0){ bc.disabled=false; bc.textContent='Voir la correction'; return; }
        bc.textContent='Correction dans '+left+' s'; left--; setTimeout(tick,1000);
      };
      tick();
    }
    exo.addEventListener('toggle', ()=>{ if(exo.open && !started){ started=true; startTimer(); } });
    bc.addEventListener('click', ()=>{ if(bc.disabled) return; corr.hidden=!corr.hidden; bc.textContent = corr.hidden?'Voir la correction':'Masquer la correction'; });
    const be = exo.querySelector('.btn-exemple');
    if(be){ const ex=exo.querySelector('.exo-exemple'); be.addEventListener('click', ()=>{ ex.hidden=!ex.hidden; be.textContent = ex.hidden?'Voir un exemple':"Masquer l'exemple"; }); }
    const cf = exo.querySelector('.chk-fait input');
    const mark = exo.querySelector('.fait-mark');
    const fait = !!(PROG.faits && PROG.faits[axId] && PROG.faits[axId][j]);
    cf.checked = fait; if(mark) mark.hidden = !fait;
    cf.addEventListener('change', ()=>{ PROG.faits = PROG.faits||{}; PROG.faits[axId] = PROG.faits[axId]||{}; PROG.faits[axId][j]=cf.checked; saveProg(); if(mark) mark.hidden = !cf.checked; });
  });

  if(autoOpen){ const first = document.querySelector('details.axe'); if(first) first.open = true; }

  document.getElementById("recommencer").onclick = ()=>{ clearProg(); fautes.fill(0); ecranIntro(); };
}

// Démarrage : si une session est sauvegardée, on reprend le plan sans refaire le diagnostic.
if(PROG && Array.isArray(PROG.fautes)){
  PROG.fautes.forEach((v,i)=> fautes[i]=v);
  ecranResultats(true);
} else {
  ecranIntro();
}
</script>

<div id="prog-bar" aria-label="Progression par axe">
  <div class="pb-title">Progression</div>
  <div class="pb-pct">0 %</div>
  <div class="pb-seg">
    <div class="pb-cell none" data-axe="C"><span class="pb-fill"></span><span class="pb-lab">C</span></div>
    <div class="pb-cell none" data-axe="B"><span class="pb-fill"></span><span class="pb-lab">B</span></div>
    <div class="pb-cell none" data-axe="A"><span class="pb-fill"></span><span class="pb-lab">A</span></div>
  </div>
</div>
<script>
/* Barre de progression par axe — autonome, lit "cahier-j02".
   Chaque axe = 3 pas : rappel consulté (lu OU vu) + ses 2 exercices.
   % global = total des pas cochés / total des pas (chaque coche compte).
   Le cadre pointillé s'active dès que le menu déroulant de l'axe est ouvert. */
(function(){
  var AXES=[{id:'A',exos:2},{id:'B',exos:2},{id:'C',exos:2}];
  function lire(){ try{var r=localStorage.getItem('cahier-j02');return r?JSON.parse(r):null;}catch(e){return null;} }
  function lireOuv(){ try{var r=localStorage.getItem('cahier-j02-ouverts');return r?JSON.parse(r):{};}catch(e){return {};} }
  function saveOuv(o){ try{localStorage.setItem('cahier-j02-ouverts',JSON.stringify(o));}catch(e){} }

  function setCell(id,state,frac){
    var c=document.querySelector('#prog-bar .pb-cell[data-axe="'+id+'"]'); if(!c) return;
    c.className='pb-cell '+state;
    var fill=c.querySelector('.pb-fill');
    if(fill){ fill.className='pb-fill'+(state==='done'?' g':(state==='prog'?' h':'')); fill.style.height=Math.round(frac*100)+'%'; }
  }

  function maj(){
    var P=lire(), pct=document.querySelector('#prog-bar .pb-pct');
    if(!P){ saveOuv({}); AXES.forEach(function(ax){ setCell(ax.id,'none',0); }); if(pct) pct.textContent='0 %'; return; }
    var ouv=lireOuv(), pasFaits=0, pasTotal=0;
    AXES.forEach(function(ax){
      var det=document.querySelector('details.axe[data-axe="'+ax.id+'"]');
      if(det){
        if(det.open) ouv[ax.id]=true;
        if(!det._barHook){ det._barHook=true; det.addEventListener('toggle',function(){ if(det.open){var o=lireOuv();o[ax.id]=true;saveOuv(o);} maj(); }); }
      }
      var consulte=!!((P.lu&&P.lu[ax.id])||(P.vu&&P.vu[ax.id]));
      var n=0; for(var j=0;j<ax.exos;j++){ if(P.faits&&P.faits[ax.id]&&P.faits[ax.id][j]) n++; }
      var steps=(consulte?1:0)+n, total=1+ax.exos;
      pasFaits+=steps; pasTotal+=total;
      var acquis=consulte && n===ax.exos, ouvert=!!ouv[ax.id], touche=ouvert||consulte||n>0;
      setCell(ax.id, acquis?'done':(touche?'prog':'none'), steps/total);
    });
    saveOuv(ouv);
    if(pct) pct.textContent=Math.round(pasFaits/pasTotal*100)+' %';
  }

  maj();
  document.addEventListener('change', maj);
  var root=document.getElementById('app');
  if(root){ try{ new MutationObserver(maj).observe(root,{childList:true,subtree:true}); }catch(e){} }
})();
</script>
