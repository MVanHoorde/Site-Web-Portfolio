<!DOCTYPE html>
<html lang="fr">
<head>

<title>Projet expérimental — maquette</title>
<!--
  MAQUETTE du projet expérimental et numérique (ES 1re), 13/11/2026.
  Données FICTIVES, rien n'est envoyé nulle part : l'état vit dans le
  localStorage de ce navigateur. Sert à montrer le fonctionnement à Loïc
  et aux collègues avant de brancher la base. Cadrage :
  _suivi/PEN-1re-conception.md
-->
<link rel="stylesheet" href="../assets/css/fonts.css">
<style>
:root{
  --encre:#2b2118; --encre-douce:#5a4c3a; --papier:#f3f1ea; --papier-clair:#faf9f3;
  --filet:#d8cfba; --filet-fonce:#cdc2a8; --sepia:#8a7c62;
  --pc:#2f6b70; --pc-pale:#e3eeee; --svt:#4f7a3a; --svt-pale:#e8f0e1;
  --alerte:#8f2d2b; --alerte-pale:#f6e4e1; --prune:#5f4b73; --prune-pale:#ece6f2; --ok:#3d7a4a; --ok-pale:#e2f0e4;
  --orange:#a8621c; --orange-pale:#f7ead9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);color:var(--encre);font:16px/1.5 'Inter',system-ui,sans-serif}
h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:600;line-height:1.2}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--prune);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* barre de la maquette */
.maq{position:sticky;top:0;z-index:20;background:var(--encre);color:#f3f1ea;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:14px}
.maq b{color:#f0c987}
.maq label{display:flex;gap:6px;align-items:center}
.maq select,.maq button{background:#3d3226;color:#f3f1ea;border:1px solid #6b5b45;border-radius:6px;padding:4px 8px}
.maq .bascule button[aria-pressed=true]{background:#f0c987;color:var(--encre);border-color:#f0c987}
.maq .espace{flex:1}

.page{max-width:1180px;margin:0 auto;padding:16px}
.carte{background:var(--papier-clair);border:1px solid var(--filet);border-radius:10px;padding:16px;margin:12px 0}
.petit{font-size:14px;color:var(--encre-douce)}
.puce{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.p-pc{background:var(--pc-pale);color:var(--pc)} .p-svt{background:var(--svt-pale);color:var(--svt)}
.p-ok{background:var(--ok-pale);color:var(--ok)} .p-alerte{background:var(--alerte-pale);color:var(--alerte)}
.p-orange{background:var(--orange-pale);color:var(--orange)} .p-neutre{background:#ece7da;color:var(--encre-douce)}
.p-prune{background:var(--prune-pale);color:var(--prune)}
.btn{border:1px solid var(--filet-fonce);background:#fff;border-radius:8px;padding:6px 14px}
.btn:hover{border-color:var(--encre-douce)}
.btn-plein{background:var(--pc);color:#fff;border-color:var(--pc)}
.btn-plein:hover{background:#255458}
.btn-alerte{color:var(--alerte);border-color:#d9b2ad}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ia{display:flex;gap:10px;align-items:center;background:var(--prune-pale);border:1px solid #cfc2dd;border-left:5px solid var(--prune);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px}
.ia .ico{font-size:22px}

/* écran élève */
.entete{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.entete h1{margin:0;font-size:26px;flex:1}
.fiole{position:relative;border:1px solid var(--filet-fonce);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600}
.fiole .nb{position:absolute;top:-7px;right:-7px;background:var(--alerte);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.rubrique{font-family:'Spectral',serif;font-size:20px;margin:22px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tuile{text-align:left;background:var(--papier-clair);border:1px solid var(--filet);border-radius:10px;padding:14px;min-height:110px;position:relative}
.tuile .num{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--sepia)}
.tuile h3{margin:4px 0;font-size:18px}
.tuile.projet{background:linear-gradient(135deg,#eef4f1,#f7f1e4);border:2px solid var(--pc);width:100%;min-height:96px}
.tuile .nb{position:absolute;top:10px;right:10px}
.onglets{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--filet);margin-top:8px}
.onglets button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:500;color:var(--encre-douce)}
.onglets button[aria-selected=true]{border-color:var(--pc);color:var(--encre);font-weight:700}
.retour{border:0;background:none;color:var(--pc);padding:0;font-weight:600}

/* groupes */
.grille-groupes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.groupe{background:#fff;border:1px solid var(--filet);border-top:5px solid var(--pc);border-radius:10px;padding:12px}
.groupe.svt{border-top-color:var(--svt)}
.groupe.moi{box-shadow:0 0 0 3px #f0c987}
.groupe h3{margin:0 0 2px;font-size:18px}
.places{list-style:none;padding:0;margin:8px 0}
.places li{padding:5px 8px;border:1px dashed var(--filet-fonce);border-radius:6px;margin:4px 0;display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:15px}
.places li.pris{border-style:solid;background:var(--papier-clair)}
.places li.libre{color:var(--sepia)}
.t{font-size:12px;color:var(--sepia);font-family:'IBM Plex Mono',monospace}
select.mini{font-size:13px;padding:2px 4px;border:1px solid var(--filet-fonce);border-radius:6px;background:#fff;max-width:96px}
.x{border:0;background:none;color:var(--alerte);font-size:16px;padding:0 4px}

/* formulaires */
label.ch,.ch{display:block;font-weight:600;margin:12px 0 4px}
textarea,input[type=text],input[type=number],input[type=date],select.champ{width:100%;border:1px solid var(--filet-fonce);border-radius:8px;padding:8px;background:#fff}
textarea{min-height:70px;resize:vertical}
textarea[readonly],input[readonly]{background:#f6f3ea}
.exp{border:1px solid var(--filet);border-radius:8px;padding:10px;margin:8px 0;background:#fff}
.exp-ligne{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.lieux{display:flex;gap:6px;flex-wrap:wrap}
.lieux label{border:1px solid var(--filet-fonce);border-radius:999px;padding:3px 10px;font-size:14px;cursor:pointer;background:#fff}
.lieux input{margin-right:4px}
.msg{margin:8px 0;padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--filet)}
.msg.prof{background:var(--orange-pale);border-color:#e8cfae}
.msg .t{display:block}
.entree{border-left:4px solid var(--pc);background:#fff;border-radius:0 8px 8px 0;padding:8px 12px;margin:8px 0}
.entree .t{display:block;margin-bottom:2px}
.fichier{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff;border:1px solid var(--filet);border-radius:8px;padding:8px 12px;margin:6px 0}
.apercu{font-size:13px;margin-top:6px}
.apercu td,.apercu th{padding:3px 8px}

/* rappels */
.voile{position:fixed;inset:0;background:rgba(43,33,24,.45);display:grid;place-items:center;z-index:30;padding:16px}
.modale{background:var(--papier-clair);border-radius:12px;max-width:520px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modale h2{margin-top:0}
.rappel{display:flex;gap:10px;padding:10px;border-radius:8px;margin:8px 0;background:#fff;border:1px solid var(--filet)}
.rappel.urgent{border-color:#d9b2ad;background:var(--alerte-pale)}
.rappel .ico{font-size:22px}
.coche{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--filet);border-radius:8px;margin:6px 0;background:#fff}
.coche input{width:22px;height:22px;margin-top:2px}
.coche.fait{background:var(--ok-pale);border-color:#b9d8bf}

/* enseignant */
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{border-bottom:1px solid var(--filet);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#ece7da;font-weight:600;position:sticky;top:0}
.tableau{overflow-x:auto;border:1px solid var(--filet);border-radius:8px;max-height:520px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border:1px solid var(--filet);border-radius:8px;padding:8px 12px;min-width:120px}
.stat b{display:block;font-size:22px;font-family:'Spectral',serif}
.interrupteur{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:2px solid var(--ok);background:var(--ok-pale);font-weight:600;flex-wrap:wrap}
.interrupteur.ferme{border-color:var(--alerte);background:var(--alerte-pale)}
.crit{display:grid;grid-template-columns:1fr 74px;gap:6px 10px;align-items:center;padding:5px 0;border-bottom:1px dotted var(--filet)}
.crit input{width:70px;text-align:right;padding:4px 6px}
.max{font-size:13px;color:var(--sepia)}
.bloc-titre{font-family:'Spectral',serif;font-weight:600;margin:14px 0 4px;color:var(--prune);display:flex;justify-content:space-between;gap:8px}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.copie-grille{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);gap:16px;align-items:start}
.colle{position:sticky;top:96px;max-height:calc(100vh - 110px);overflow:auto}
.niveaux{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.niveaux button{border:1px solid var(--filet-fonce);background:#fff;border-radius:6px;padding:3px 9px;font-size:13px;font-weight:600}
.niveaux button[aria-pressed=true]{background:var(--prune);color:#fff;border-color:var(--prune)}
.oral-crit{padding:8px 0;border-bottom:1px dotted var(--filet)}
.oral-crit .desc{font-size:13px;color:var(--encre-douce);min-height:1.2em}
.chrono{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:600}
.chrono.depasse{color:var(--alerte)}
.total{font-family:'Spectral',serif;font-size:20px}
@media (max-width:860px){.deux,.exp-ligne,.copie-grille{grid-template-columns:1fr}.colle{position:static;max-height:none}}
.cal{list-style:none;padding:0;margin:0}
.cal li{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:8px 0;border-bottom:1px dotted var(--filet)}
.cal .d{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--pc)}
.lieux-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.lieu{background:#fff;border:1px solid var(--filet);border-radius:10px;padding:12px}
.lieu .ico{font-size:26px}
.a-preciser{font-style:italic;color:var(--orange)}
.reglage{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dotted var(--filet)}
.reglage input{width:20px;height:20px;margin-top:3px}
</style>
</head>
<body>

<div class="maq" role="region" aria-label="Commandes de la maquette">
  <span>🧪 <b>MAQUETTE</b> — données fictives, rien n'est enregistré ailleurs que dans ce navigateur</span>
  <span class="bascule" role="group" aria-label="Vue">
    <button id="v-eleve" aria-pressed="true">Vue élève</button>
    <button id="v-prof" aria-pressed="false">Vue enseignant</button>
  </span>
  <label id="l-qui">Je suis <select id="qui"></select></label>
  <label>Nous sommes le <select id="date"></select></label>
  <span class="espace"></span>
  <button id="raz" title="Remet les données fictives de départ">Réinitialiser</button>
</div>

<div class="page" id="app"></div>

<script>
'use strict';
/* =============================================================
   Données fixes
   ============================================================= */
const PSEUDOS = ['Quartz','Halite','Pyrite','Galène','Opale','Jaspe','Onyx','Béryl','Rubis','Grenat','Jade','Ambre',
  'Basalte','Krypton','Fluorine','Gypse','Talc','Soufre','Calcite','Mica','Topaze','Granite','Agate','Saphir',
  'Obsidienne','Cobalt','Corail','Nacre','Silex','Zinc','Nickel','Argon','Néon'];

const DATES = [
  ['2026-11-23','lun. 23/11 — présentation du projet'],
  ['2026-12-10','jeu. 10/12 — les groupes se forment'],
  ['2027-01-04','lun. 04/01 — retour : pré-projet dû'],
  ['2027-01-25','lun. 25/01 — retours et corrections'],
  ['2027-03-01','lun. 01/03 — début du projet'],
  ['2027-03-08','lun. 08/03'],
  ['2027-03-12','ven. 12/03 — manip 1'],
  ['2027-03-15','lun. 15/03'],
  ['2027-04-02','ven. 02/04'],
  ['2027-04-09','ven. 09/04 — oraux'],
];
const SEANCES = [['2027-03-01','lun. 01/03'],['2027-03-05','ven. 05/03'],['2027-03-12','ven. 12/03 · labo'],['2027-03-15','lun. 15/03'],
  ['2027-03-19','ven. 19/03 · labo'],['2027-04-02','ven. 02/04'],['2027-04-09','ven. 09/04 · oral']];
const DEBUT_PROJET = '2027-03-01';

const ECHEANCES = {
  groupes:    {d:'2026-12-18', txt:'ven. 18/12'},
  preprojet:  {d:'2027-01-04', txt:'lun. 04/01'},
  validation: {d:'2027-02-05', txt:'avant les vacances de février'},
  rendu:      {d:'2027-04-09', txt:'ven. 09/04'},
};
const MANIPS = [
  {id:'m1', d:'2027-03-12', txt:'ven. 12/03', limite:'2027-03-05', limiteTxt:'ven. 05/03'},
  {id:'m2', d:'2027-03-19', txt:'ven. 19/03', limite:'2027-03-12', limiteTxt:'ven. 12/03'},
];
const LIEUX = [['labo','🔬 Au labo'],['maison','🏠 À la maison'],['exterieur','🌳 En extérieur'],['donnees','💾 Données en ligne'],['classe','🏫 En classe']];
const CAT = {donnees:'📊 Données', cahier:'📓 Cahier de laboratoire', oral:'🎤 Support d’oral'};

/* ---- La notation (proposition à valider) ----
   ÉCRIT et AUTRES : une note de groupe (grille 2025-2026, inchangée).
   ORAL : une partie commune au groupe (le support, les 5 étapes, le temps
   de parole) et une partie INDIVIDUELLE, sur les cinq critères du Grand
   oral, avec leurs points de 2025-2026. « Qualité de la prise de parole /5 »
   de l'ancienne composante individuelle y est absorbée ; reste
   « Investissement personnel /5 ». Total 58 → /20. */
const ECRIT = [
  {bloc:'Forme', crit:[['Page de garde',0.5],['Table des matières complète',1],['Respect du calendrier (dates des séances)',1],['Figures légendées et utilisées',1],['Propreté',1]]},
  {bloc:'Phase 1 — Problématisation', crit:[['Problématique énoncée et contextualisée',1],['Qualité de la problématique',2],['Faisabilité étudiée, échanges avec l’enseignant',1]]},
  {bloc:'Phase 2 — Hypothèses', crit:[['Hypothèses formulées',0.5],['Hypothèses cohérentes et vérifiables',1],['Proposition d’une démarche expérimentale',1],['Pertinence de la démarche',0.5]]},
  {bloc:'Phase 3 — Expérimentation / données', crit:[['Élaboration d’un protocole',3],['Liste de matériel',1],['Mise en œuvre du protocole',3]]},
  {bloc:'Phase 4 — Interprétation', crit:[['Représentation des données',3],['Qualité de l’analyse',1]]},
  {bloc:'Phase 5 — Conclusion', crit:[['Réponse explicite à la problématique',2],['Élargissement, ouverture',1]]},
  {bloc:'Bibliographie', crit:[['Bibliographie fournie',0.5],['Diversité, qualité, fiabilité',1]]},
];
const AUTRES = [{bloc:'Travail du groupe', crit:[['Implication du groupe en classe',3],['Répartition efficace du travail',1],['Prise en compte des conseils',1],
  ['Esprit d’initiative et autonomie',3],['Respect des délais',1],['Respect du travail des personnels du labo',2]]}];
const ORAL_GROUPE = [{bloc:'Oral — commun au groupe', crit:[['Présentation des 5 étapes de la démarche',2],['Qualité du support',2],['Répartition du temps de parole',1]]}];
const NIV = ['TI','I','S','TS'], NIV_LONG = ['très insuffisant','insuffisant','satisfaisant','très satisfaisant'], NIV_F = [0,.25,.75,1];
/* D'après la grille d'évaluation du Grand oral — résumés, à confronter au texte officiel. */
const ORAL_INDIV = [
  ['Qualité orale',3,['Difficilement audible, ne capte pas l’attention.','Audible mais monocorde ; vocabulaire limité ou approximatif.','Voix posée, lexique adapté ; suscite l’intérêt.','La voix sert le discours ; vocabulaire riche et précis ; pleinement engagé.']],
  ['Prise de parole en continu',1,['Énoncés courts, nombreuses pauses.','Discours assez clair mais vite interrompu ; très dépendant des notes.','Discours fluide ; se détache de ses notes.','Discours fluide et efficace ; notes à peine utilisées.']],
  ['Qualité des connaissances',3,['Connaissances imprécises ; ne répond pas aux questions.','Connaissances réduites ; réponses approximatives.','Connaissances précises ; réponses qui les mobilisent.','Connaissances maîtrisées ; réponses pertinentes et nuancées.']],
  ['Qualité de l’interaction',2,['Réponses courtes ou absentes, n’entre pas dans l’échange.','Réponses prudentes ; échange limité.','Répond, entre dans l’échange.','S’empare des questions, enrichit l’échange.']],
  ['Argumentation',1,['Pas de raisonnement perceptible.','Début de démonstration, arguments peu reliés.','Démonstration construite, arguments cohérents.','Démonstration maîtrisée, argumentation convaincante.']],
];
const PERSO = [['Investissement personnel',5]];
const somme = blocs => blocs.reduce((n,b)=>n+b.crit.reduce((m,c)=>m+c[1],0),0);
const MAX = {ecrit:somme(ECRIT), autres:somme(AUTRES), og:somme(ORAL_GROUPE), oi:ORAL_INDIV.reduce((n,c)=>n+c[1],0), perso:5};
MAX.total = MAX.ecrit+MAX.autres+MAX.og+MAX.oi+MAX.perso;

/* =============================================================
   Données fictives de départ (instantané à la mi-mars)
   ============================================================= */
function etatDeDepart(){
  const t = (j,h) => j+'T'+(h||'12:00')+':00';
  const S = {vue:'eleve', qui:'Quartz', date:'2027-03-15', groupesFermes:true,
    reglages:{joannesSurSite:true, notesRendues:false},
    groupes:[], depots:{}, journal:{}, fichiers:{}, labo:{}, notes:{g:{}, e:{}}, log:[]};
  const compo = {pc1:['Quartz','Halite','Pyrite','Galène'], pc2:['Opale','Jaspe','Onyx','Béryl'], pc3:['Rubis','Grenat','Jade','Ambre'],
    pc4:['Basalte','Krypton','Fluorine'], pc5:['Gypse','Talc','Soufre'], svt1:['Calcite','Mica','Topaze','Granite'],
    svt2:['Agate','Saphir','Obsidienne','Cobalt'], svt3:['Corail','Nacre','Silex','Zinc'], svt4:['Nickel','Argon','Néon']};
  let minute = 0;
  const jours = ['2026-11-23','2026-11-24','2026-11-25','2026-11-27','2026-12-01','2026-12-03','2026-12-08','2026-12-11','2026-12-15'];
  Object.entries(compo).forEach(([id,mm],gi) => {
    const disc = id.startsWith('pc')?'pc':'svt';
    S.groupes.push({id, nom:(disc==='pc'?'PC ':'SVT ')+id.replace(/\D/g,''), disc, prof:disc==='pc'?'M. Van Hoorde':'Mme Joannes',
      membres: mm.map((p,i)=>{ minute+=7; const q = t(jours[gi], String(17+Math.floor(i/2)).padStart(2,'0')+':'+String((minute)%60).padStart(2,'0'));
        S.log.push({t:q, qui:p, g:id, a:'rejoint', d:''}); return {p, depuis:q}; })});
  });
  S.log.push({t:t('2026-11-25','17:02'), qui:'Béryl', g:'pc3', a:'quitte', d:''});
  S.log.push({t:t('2026-12-18','18:00'), qui:'M. Van Hoorde', g:'', a:'ferme les groupes', d:''});

  const pp = (id, statut, prob, hyp, exps, mat, versions, fil) => {
    S.depots[id] = {statut, brouillon:{prob,hyp,exps,mat}, versions, fil};
    versions.forEach((v,i)=>S.log.push({t:v.t, qui:v.par, g:id, a:'envoie', d:'pré-projet v'+(i+1)}));
    fil.filter(m=>m.prof).forEach(m=>S.log.push({t:m.t, qui:m.par, g:id, a:'commente', d:'pré-projet'}));
  };
  const env = (t0,par,n) => ({t:t0, par, prof:false, txt:'Pré-projet envoyé (version '+n+').'});
  pp('pc1','valide','Le sucre se dissout-il plus vite dans l’eau chaude ? De combien ?',
    'Plus l’eau est chaude, plus le sucre se dissout vite. On pense que la durée est divisée par deux tous les 20 °C.',

const $ = s => document.querySelector(s);

function depot(id){ return S.depots[id] || (S.depots[id] = {statut:'vide', brouillon:{prob:'',hyp:'',exps:[{desc:'',lieux:[],nb:'',duree:''}],mat:''}, versions:[], fil:[]}); }

/* Les notes, à partir de ce qui est saisi */
function noteGroupe(id, blocs, pref){ const N = S.notes.g[id] || {}; let s=0, vides=0;
  blocs.forEach((b,bi)=>b.crit.forEach((c,ci)=>{ const v = N[pref+'-'+bi+'-'+ci]; if (v===undefined||v==='') vides++; else s+=+v; })); return {s, vides}; }
function noteEleve(p){ const E = S.notes.e[p] || {niv:{}, perso:{}, pts:{}}; let s=0, vides=0;
  ORAL_INDIV.forEach(([t,max],i)=>{ const pts = E.pts && E.pts[i]!==undefined && E.pts[i]!=='' ? +E.pts[i] : (E.niv && E.niv[i]!==undefined ? max*NIV_F[E.niv[i]] : null);
    if (pts===null) vides++; else s+=pts; });
  let pe=0, pv=0; PERSO.forEach((c,i)=>{ const v=E.perso&&E.perso[i]; if(v===undefined||v==='') pv++; else pe+=+v; });
  return {oi:s, perso:pe, vides:vides+pv}; }
function bilan(p){ const g = groupeDe(p); if(!g) return null;
  const e = noteGroupe(g.id,ECRIT,'E'), a = noteGroupe(g.id,AUTRES,'A'), og = noteGroupe(g.id,ORAL_GROUPE,'O'), i = noteEleve(p);
  const total = e.s+a.s+og.s+i.oi+i.perso;
  return {g, ecrit:e.s, autres:a.s, og:og.s, oi:i.oi, perso:i.perso, total, sur20: total/MAX.total*20, complet: !(e.vides+a.vides+og.vides+i.vides)}; }

/* Les rappels de l'élève, selon la date simulée */
function rappels(p){
  const r = [], g = groupeDe(p), d = S.date;
  if (!g && d < '2027-01-01') r.push({ico:'👥', urgent: joursEntre(d, ECHEANCES.groupes.d) <= 7, txt:`Rejoins un groupe avant le <b>${ECHEANCES.groupes.txt}</b>.`, aller:'groupe'});
  if (!g && d >= '2027-01-01') r.push({ico:'👥', urgent:true, txt:'Tu n’es dans aucun groupe : vois ton professeur.', aller:'groupe'});
  if (!g || suiviAilleurs(g)) return r;
  if (g.membres.length === 1) r.push({ico:'⚠️', urgent:true, txt:'Tu es seul dans ton groupe : on ne travaille jamais seul.', aller:'groupe'});
  const dp = depot(g.id);
  if (dp.statut==='vide' && d >= '2026-12-01' && d < '2027-03-01') r.push({ico:'📝', urgent: joursEntre(d, ECHEANCES.preprojet.d) <= 7, txt:`Pré-projet à envoyer pour le <b>${ECHEANCES.preprojet.txt}</b>.`, aller:'preprojet'});
  if (dp.statut==='a-revoir') r.push({ico:'💬', urgent:true, txt:`Ton professeur a commenté le pré-projet : à corriger <b>${ECHEANCES.validation.txt}</b>.`, aller:'preprojet'});
  for (const m of MANIPS) {
    const l = labo(g.id, m.id), j = joursEntre(d, m.limite);
    if (!l.envoyee && j <= 21 && d < m.d) r.push({ico:'🧪', labo:true, urgent: j <= 3, txt:`Demande au labo pour la manip du <b>${m.txt}</b> : à envoyer avant le <b>${m.limiteTxt}</b>${j<0?' — <b>en retard</b>':''}.`, aller:'labo'});
    else if (l.envoyee && !l.reponse && d < m.d) r.push({ico:'🧪', labo:true, txt:`As-tu reçu la réponse du labo pour le <b>${m.txt}</b> ? Coche-le quand c’est le cas.`, aller:'labo'});
  }
  const seance = SEANCES.find(s=>s[0]===d);
  if (seance && !journalDe(g.id).some(e=>e.seance===d)) r.push({ico:'📓', txt:'Séance du jour : notez dans le <b>journal de bord</b> ce que vous avez fait.', aller:'journal'});
  if (d >= '2027-04-02' && d <= ECHEANCES.rendu.d && !fichiersDe(g.id).some(f=>f.cat==='oral')) r.push({ico:'🎤', urgent: d >= '2027-04-07', txt:`Support d’oral et cahier de laboratoire à déposer pour le <b>${ECHEANCES.rendu.txt}</b>.`, aller:'depots'});
  return r;
}

    <p>Par groupes de <b>2 à 4</b>, vous menez une vraie démarche scientifique sur <b>le sujet de votre choix</b> : une question, des hypothèses, des mesures, leur traitement numérique, une conclusion. Le cœur du projet, ce sont <b>les données</b> : les produire, en avoir assez, les représenter, les faire parler.</p>
    <p>Vous le menez en <b>physique-chimie</b> (M. Van Hoorde) ou en <b>SVT</b> (Mme Joannes) : <b>9 groupes</b> vous attendent, 5 en physique-chimie et 4 en SVT, <b>premiers inscrits, premiers servis</b>.</p>
  </div>
  <div class="carte"><h2>Où mesurer ?</h2>
    <p><b>Il n'y a que deux séances au labo.</b> Un projet bien préparé les complète par des mesures faites ailleurs : prévoyez-le dès le pré-projet.</p>
    <div class="lieux-grille">
      <div class="lieu"><div class="ico">🔬</div><b>Au labo</b><p class="petit">Deux séances en demi-groupe. Le matériel se demande <b>une semaine avant</b>, sur EcoleDirecte.</p></div>
      <div class="lieu"><div class="ico">🏠</div><b>À la maison</b><p class="petit">Beaucoup de mesures se font avec un téléphone, une cuisine, un chronomètre.</p></div>
      <div class="lieu"><div class="ico">🌳</div><b>En extérieur</b><p class="petit">Possible pendant les séances en classe entière : son, lumière, température…</p></div>
      <div class="lieu"><div class="ico">💾</div><b>Données en ligne</b><p class="petit">Des mesures publiées par des scientifiques : vous décrivez alors leur démarche comme la vôtre.</p></div>
    </div>
  </div>
  <div class="carte"><h2>Le calendrier</h2>
    <ul class="cal">
      <li><span class="d">lun. 23/11</span><span>Présentation du projet.</span></li>
      <li><span class="d">${ECHEANCES.groupes.txt}</span><span>Les groupes sont formés <b>sur le site</b>.</span></li>
      <li><span class="d">${ECHEANCES.preprojet.txt}</span><span>Pré-projet envoyé <b>sur le site</b> : problématique, hypothèses, expériences prévues, matériel.</span></li>
      <li><span class="d">janvier</span><span>Retours de votre professeur, corrections, jusqu'à la validation <b>${ECHEANCES.validation.txt}</b>.</span></li>
      <li><span class="d">01/03 → 02/04</span><span>Le projet : séances en classe entière et en demi-groupe, <b>dont deux au labo (12/03 et 19/03)</b>. Le journal de bord se tient à chaque séance. <span class="a-preciser">Répartition exacte à préciser.</span></span></li>
      <li><span class="d">ven. 09/04</span><span>Oral : 10 min de présentation, 5 min de questions. Le cahier de laboratoire et le support sont déposés.</span></li>

  <div class="carte"><h2>Les pièges</h2>

      <li><b>Une seule mesure</b> ne prouve rien : répétez, et dites combien de fois.</li>
      <li>Un sujet <b>trop grand</b> : « le réchauffement climatique » n'est pas une question qu'on mesure en deux séances.</li>

function rendreGroupesEleve(){
  const p = S.qui, mien = groupeDe(p);
  const regles = `<div class="carte"><b>Les règles</b> — 4 élèves au plus par groupe, 2 au moins (on ne travaille jamais seul ; les groupes de 2 se discutent en classe). ${S.groupesFermes?'<span class="puce p-alerte">Les groupes sont fermés</span> : pour changer, parle à ton professeur.':`Tu peux changer de groupe librement jusqu'au <b>${ECHEANCES.groupes.txt}</b>.`}</div>`;
  const carte = g => {
    const plein = g.membres.length >= 4, moi = mien && mien.id===g.id;
    const places = [0,1,2,3].map(i => { const m = g.membres[i];
      return m ? `<li class="pris"><span>${esc(m.p)}${m.p===p?' (toi)':''}</span><span class="t">${fmt(m.depuis)}</span></li>` : '<li class="libre">place libre</li>'; }).join('');
    let b = '';
    if (!p) b = '';
    else if (moi) b = `<button class="btn btn-alerte" data-quitter="${g.id}" ${S.groupesFermes?'disabled':''}>Quitter le groupe</button>`;
    else b = `<button class="btn btn-plein" data-rejoindre="${g.id}" ${S.groupesFermes||plein?'disabled':''}>${plein?'Complet':mien?'Changer pour ce groupe':'Rejoindre'}</button>`;
    return `<div class="groupe ${g.disc} ${moi?'moi':''}"><h3>${esc(g.nom)}</h3>
      <span class="puce ${g.disc==='pc'?'p-pc':'p-svt'}">${g.disc==='pc'?'Physique-chimie':'SVT'}</span> <span class="petit">${esc(g.prof)}</span>
      <ul class="places">${places}</ul>${b}</div>`;
  };
  const pc = S.groupes.filter(g=>g.disc==='pc'), svt = S.groupes.filter(g=>g.disc==='svt');
  const libres = l => l.reduce((n,g)=>n+4-g.membres.length,0);
  return regles + `
    <h2>Physique-chimie <span class="petit">— ${libres(pc)} places libres</span></h2><div class="grille-groupes">${pc.map(carte).join('')}</div>
    <h2>SVT <span class="petit">— ${libres(svt)} places libres</span></h2><div class="grille-groupes">${svt.map(carte).join('')}</div>`;
}

function rendrePreprojet(g){
  const dp = g ? depot(g.id) : {statut:'vide', brouillon:{prob:'',hyp:'',exps:[{desc:'',lieux:[],nb:'',duree:''}],mat:''}, versions:[], fil:[]};
  const b = dp.brouillon, fige = dp.statut==='valide' || !peutEcrire(g), ro = fige?'readonly':'', dis = fige?'disabled':'';
  const exps = (b.exps||[]).map((e,i)=>`
    <div class="exp" data-exp="${i}">
      <label class="ch" for="e-desc-${i}">Expérience ${i+1} — que mesurez-vous, comment ?</label>
      <textarea id="e-desc-${i}" data-champ="desc" ${ro}>${esc(e.desc)}</textarea>
      <div class="ch">Où ?</div>
      <div class="lieux">${LIEUX.map(([k,t])=>`<label><input type="checkbox" data-lieu="${k}" ${e.lieux.includes(k)?'checked':''} ${dis}>${t}</label>`).join('')}</div>
      <div class="exp-ligne">
        <div><label class="ch" for="e-nb-${i}">Combien de mesures ?</label><input type="text" id="e-nb-${i}" data-champ="nb" value="${esc(e.nb)}" ${ro}></div>
        <div><label class="ch" for="e-du-${i}">Combien de temps ?</label><input type="text" id="e-du-${i}" data-champ="duree" value="${esc(e.duree)}" ${ro}></div>
        <div style="align-self:end">${!fige && b.exps.length>1?`<button class="btn btn-alerte" data-suppr-exp="${i}">Retirer</button>`:''}</div>
      </div>
    </div>`).join('');
  return `
  <div class="carte">
    <div class="entete"><h2 style="margin:0;flex:1">Pré-projet${g?' du groupe '+esc(g.nom):''}</h2>${pastille(dp.statut)}</div>
    <p class="petit">À envoyer pour le <b>${ECHEANCES.preprojet.txt}</b>, validé <b>${ECHEANCES.validation.txt}</b>. Tout le groupe écrit dans la même fiche ; chaque envoi est daté et garde une trace.${dp.statut==='valide'?' <b>Validé : la fiche reste consultable, elle ne se modifie plus.</b>':''}</p>
    ${avisLecture(g)}
    <label class="ch" for="f-prob">Problématique</label>
    <textarea id="f-prob" data-f="prob" ${ro} placeholder="Une question précise, à laquelle on peut répondre en mesurant.">${esc(b.prob)}</textarea>
    <label class="ch" for="f-hyp">Hypothèses</label>
    <textarea id="f-hyp" data-f="hyp" ${ro}>${esc(b.hyp)}</textarea>
    <div class="ch">Expériences envisagées</div>
    ${exps}
    ${fige?'':'<button class="btn" id="b-ajout-exp">+ une expérience</button>'}
    <label class="ch" for="f-mat">Matériel nécessaire <span class="petit">(ce que le labo fournit, ce que vous apportez)</span></label>
    <textarea id="f-mat" data-f="mat" ${ro}>${esc(b.mat)}</textarea>
    <p>${fige?'':'<button class="btn btn-plein" id="b-envoyer">Envoyer au professeur</button> <span class="petit">Le brouillon est enregistré au fil de la frappe.</span>'}</p>
    ${dp.versions.length?`<p class="petit">Versions envoyées : ${dp.versions.map((v,i)=>`v${i+1} le ${fmt(v.t)} par ${esc(v.par)}`).join(' · ')}</p>`:''}
  </div>
  <div class="carte"><h3 style="margin-top:0">Échanges avec le professeur</h3>
    ${dp.fil.length?dp.fil.map(m=>`<div class="msg ${m.prof?'prof':''}"><span class="t">${esc(m.par)} · ${fmt(m.t)}</span>${esc(m.txt)}</div>`).join(''):'<p class="petit">Rien pour l’instant.</p>'}
    ${peutEcrire(g)?`<label class="ch" for="f-msg">Poser une question</label><textarea id="f-msg" placeholder="Une question sur la faisabilité, le matériel…"></textarea><p><button class="btn" id="b-msg">Envoyer la question</button></p>`:''}
  </div>`;
}

function rendreLabo(g){
  const coche = (m, cle, txt, aide) => { const l = g ? labo(g.id, m.id) : {}, v = l[cle];
    return `<label class="coche ${v?'fait':''}"><input type="checkbox" data-labo="${m.id}" data-cle="${cle}" ${v?'checked':''} ${peutEcrire(g)?'':'disabled'}>
      <span><b>${txt}</b>${aide?`<br><span class="petit">${aide}</span>`:''}${v?`<br><span class="petit">coché par ${esc(v.par)} le ${fmt(v.t)}</span>`:''}</span></label>`; };
  return `
  <div class="carte"><h2 style="margin-top:0">Mes démarches au labo</h2>
    <p>Vous écrivez vous-mêmes à <b>Coralie</b>, au labo, sur <b>EcoleDirecte</b>, <b>au moins une semaine avant</b>. Le site ne fait que vous le rappeler : cochez au fur et à mesure, tout le groupe le voit.</p>
    ${avisLecture(g)}
    <details><summary><b>Ce que doit contenir votre message</b></summary>
      <ul><li>vos noms, prénoms, classe ;</li><li>la date et l'heure de la séance ;</li><li>votre <b>protocole</b>, pour qu'elle prévoie les quantités ;</li><li>la liste du matériel. Le matériel spécifique (bulbes, confiture…) est à apporter par vous.</li></ul></details>
  </div>
  ${MANIPS.map(m=>`<div class="carte"><h3 style="margin-top:0">Manip du ${m.txt} <span class="puce p-neutre">demande avant le ${m.limiteTxt}</span></h3>
    ${coche(m,'envoyee','Demande envoyée à Coralie','Sur EcoleDirecte, avec le protocole.')}
    ${coche(m,'reponse','Réponse reçue')}
    ${coche(m,'pret','On a ce qu’il faut','Matériel du labo confirmé, matériel spécifique prêt.')}
  </div>`).join('')}`;
}

  const l = g ? [...journalDe(g.id)].sort((a,b)=>a.seance<b.seance?1:-1) : [];
  return `

    <p class="petit">Une entrée par séance <b>et</b> par séance de travail chez vous : ce que vous avez fait, où, ce qui a coincé. Il sert à écrire le cahier de laboratoire et au critère « respect du calendrier ».</p>
    ${avisLecture(g)}
    ${peutEcrire(g)?`<div class="deux">
      <div><label class="ch" for="j-seance">Séance</label><select class="champ" id="j-seance">${SEANCES.map(([d,t])=>`<option value="${d}" ${d===S.date?'selected':''}>${t}</option>`).join('')}<option value="autre">travail en dehors des séances (date du jour)</option></select></div>
      <div><label class="ch" for="j-lieu">Où ?</label><select class="champ" id="j-lieu">${LIEUX.map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></div></div>

function listeFichiers(id, cats, prof){
  const l = fichiersDe(id).filter(f=>cats.includes(f.cat));
  if (!l.length) return '<p class="petit">Rien de déposé.</p>';
  return l.map((f)=>`<div class="fichier"><span>${CAT[f.cat].split(' ')[0]} <b>${esc(f.nom)}</b> <span class="t">${esc(f.taille)} · ${esc(f.par)} · ${fmt(f.t)}</span></span>
    <span class="petit">${prof?'ouvrir ↗':''}</span>
    ${f.apercu?`<div class="apercu" style="flex-basis:100%"><table>${f.apercu.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`:''}</div>`).join('');
}
function rendreDepotsEleve(g){
  const bloc = (cat, titre, aide) => `<div class="carte"><h3 style="margin-top:0">${CAT[cat]} <span class="petit">${titre}</span></h3>
    <p class="petit">${aide}</p>${g?listeFichiers(g.id,[cat]):''}
    ${peutEcrire(g)?`<label class="btn" style="display:inline-block">Déposer un fichier<input type="file" data-deposer="${cat}" hidden></label>`:''}</div>`;
  return `${avisLecture(g)}
    <div class="carte"><b>Rendu le ${ECHEANCES.rendu.txt}</b> — l'oral dure 10 min, suivi de 5 min de questions. Chacun parle : une partie de la note d'oral est <b>individuelle</b>.</div>

const choixGroupe = (id, cle) => `<label>Groupe <select data-choix-groupe="${cle}" class="mini" style="max-width:none;font-size:15px">${S.groupes.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.nom)} — ${x.membres.map(m=>esc(m.p)).join(', ')}</option>`).join('')}</select></label>`;

    <div class="stats">
      <div class="stat"><b>${places}/33</b>placés</div>
      <div class="stat"><b>${sans.length}</b>sans groupe</div>
      <div class="stat"><b>${npc} · ${places-npc}</b>PC · SVT</div>

      <div class="stat"><b>${deux.length}</b>groupe(s) de 2</div>
    </div>
  </div>
  <div class="grille-groupes">${S.groupes.map(g=>`
    <div class="groupe ${g.disc}"><h3>${esc(g.nom)} ${g.membres.length===1?'<span class="puce p-alerte">seul</span>':g.membres.length===2?'<span class="puce p-orange">à 2</span>':''}</h3>
      <span class="petit">${esc(g.prof)} · ${g.membres.length}/4</span>
      <ul class="places">${g.membres.map((m,i)=>`<li class="pris"><span><span class="t">${i+1}.</span> <b>${esc(m.p)}</b><br><span class="t">arrivé le ${fmt(m.depuis)}</span></span>
        <span style="white-space:nowrap"><select class="mini" aria-label="Déplacer ${esc(m.p)}" data-deplacer="${esc(m.p)}"><option value="">déplacer…</option>${opts(g.id)}</select>

/* Tout ce que le groupe a produit, dans l'ordre du projet : sert au suivi et à la correction. */
function rendreCopie(g){
  const dp = depot(g.id), b = dp.brouillon, j = [...journalDe(g.id)].sort((a,b)=>a.seance<b.seance?-1:1);
  return `
    <div class="bloc-titre">Pré-projet ${pastille(dp.statut)}</div>
    <p><b>Problématique.</b> ${esc(b.prob)||'<i>vide</i>'}</p>
    <p><b>Hypothèses.</b> ${esc(b.hyp)||'<i>vide</i>'}</p>
    ${(b.exps||[]).map((e,i)=>`<p><b>Expérience ${i+1}.</b> ${esc(e.desc)||'<i>vide</i>'}<br><span class="petit">${e.lieux.map(lieuTxt).join(' · ')||'lieu non précisé'} — ${esc(e.nb)||'?'} — ${esc(e.duree)||'?'}</span></p>`).join('')}
    <p><b>Matériel.</b> ${esc(b.mat)||'<i>vide</i>'}</p>
    <p class="petit">${dp.versions.map((v,i)=>`v${i+1} : ${fmt(v.t)}, ${esc(v.par)}, ${v.mots} mots`).join(' · ')||'aucune version envoyée'}</p>
    <div class="bloc-titre">Journal de bord <span class="petit">${j.length} entrée(s)</span></div>
    ${j.map(e=>`<div class="entree"><span class="t">${fmtJ(e.seance)} · ${lieuTxt(e.lieu)} · ${esc(e.par)}</span>${esc(e.txt)}</div>`).join('')||'<p class="petit">Vide.</p>'}
    <div class="bloc-titre">Fichiers déposés</div>
    ${listeFichiers(g.id, ['donnees','cahier','oral'], true)}
    <div class="bloc-titre">Labo</div>
    <p class="petit">${MANIPS.map(m=>{ const l=(S.labo[g.id]||{})[m.id]||{}; return `${m.txt} : demande ${l.envoyee?'✅ '+fmt(l.envoyee.t):'·'} · réponse ${l.reponse?'✅':'·'} · prêt ${l.pret?'✅':'·'}`; }).join('<br>')}</p>`;
}

function rendreProfDepots(){
  const lignes = S.groupes.map(g => { const dp = depot(g.id); return {g, dp, prem: dp.versions[0]?.t || null}; });
  const ordre = lignes.filter(l=>l.prem).sort((a,b)=>a.prem<b.prem?-1:1).map(l=>l.g.id);
  const ouvert = ui.groupeOuvert && gid(ui.groupeOuvert);
  let panneau = '';
  if (ouvert) {
    const dp = depot(ouvert.id);
    panneau = `<div class="carte"><div class="entete"><h2 style="margin:0;flex:1">${esc(ouvert.nom)}</h2><button class="btn" data-fermer-panneau>Fermer</button></div>
      <p class="petit">${ouvert.membres.map(m=>esc(m.p)).join(' · ')} · ${esc(ouvert.prof)}</p>
      <div class="deux"><div>${rendreCopie(ouvert)}</div><div>
        <div class="bloc-titre">Échanges sur le pré-projet</div>
        ${dp.fil.map(m=>`<div class="msg ${m.prof?'prof':''}"><span class="t">${esc(m.par)} · ${fmt(m.t)}</span>${esc(m.txt)}</div>`).join('')||'<p class="petit">Aucun.</p>'}

/* =============================================================
   Rendu général, rappels à la connexion, chronomètre
   ============================================================= */
function rendre(){
  const actif = document.activeElement, cleFocus = actif && actif.dataset ? actif.dataset.focus : null;
  document.getElementById('v-eleve').setAttribute('aria-pressed', S.vue==='eleve');
  document.getElementById('v-prof').setAttribute('aria-pressed', S.vue==='prof');
  document.getElementById('l-qui').style.display = S.vue==='eleve' ? '' : 'none';
  let h = S.vue==='eleve' ? rendreEleve() : rendreProf();
  if (S.vue==='eleve' && S.qui && ui.rappelsOuverts) {
    const r = rappels(S.qui);
    if (r.length) h += `<div class="voile"><div class="modale" role="dialog" aria-modal="true" aria-labelledby="t-rap"><h2 id="t-rap">Projet : à faire</h2>
      ${r.map(x=>`<div class="rappel ${x.urgent?'urgent':''}"><span class="ico">${x.ico}</span><span>${x.txt}</span></div>`).join('')}
      <p><button class="btn btn-plein" data-aller="${r[0].aller}">J’y vais</button> <button class="btn" id="b-plus-tard">Plus tard</button></p></div></div>`;
    else ui.rappelsOuverts = false;
  }
  $('#app').innerHTML = h;
  if (cleFocus) { const el = document.querySelector(`[data-focus="${CSS.escape(cleFocus)}"]`); if (el) el.focus(); }
  majChrono();
  sauver();
}
function connexion(){ ui.rappelsOuverts = true; ui.ecran = 'accueil'; }
function tempsChrono(){ return ui.chrono.cumul + (ui.chrono.marche ? Date.now()-ui.chrono.debut : 0); }
function majChrono(){ const el = $('#chrono'); if (!el) return; const s = Math.floor(tempsChrono()/1000);
  el.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  el.classList.toggle('depasse', s >= 900);
  const ph = $('#chrono-phase'); if (ph) ph.textContent = s < 600 ? `Présentation : encore ${Math.ceil((600-s)/60)} min.` : s < 900 ? `Questions : encore ${Math.ceil((900-s)/60)} min.` : 'Temps écoulé (15 min).'; }
setInterval(majChrono, 500);

   Événements
   ============================================================= */
function remplirBarre(){
  $('#qui').innerHTML = '<option value="">— pas connecté —</option>' + PSEUDOS.map(p=>`<option ${p===S.qui?'selected':''}>${p}</option>`).join('');
  $('#date').innerHTML = DATES.map(([d,t])=>`<option value="${d}" ${d===S.date?'selected':''}>${t}</option>`).join('');
}
$('#qui').onchange = e => { S.qui = e.target.value; connexion(); rendre(); };
$('#date').onchange = e => { S.date = e.target.value; connexion(); rendre(); };
$('#v-eleve').onclick = () => { S.vue='eleve'; rendre(); };
$('#v-prof').onclick = () => { S.vue='prof'; rendre(); };
$('#raz').onclick = () => { if (confirm('Remettre les données fictives de départ ?')) { S = etatDeDepart(); ui.ecran='accueil'; remplirBarre(); rendre(); } };

function telecharger(nom, texte, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿'+texte],{type})); a.download = nom; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); }
const csv = rows => rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
const noteE = p => (S.notes.e[p] = S.notes.e[p] || {niv:{}, pts:{}, perso:{}, rq:''});

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset, p = S.qui;
  if (d.ouvrir) { ui.ecran = d.ouvrir==='projet'?'projet':'accueil'; ui.onglet='projet'; }
  else if (d.onglet) ui.onglet = d.onglet;
  else if (t.id==='b-labo') { ui.ecran='projet'; ui.onglet='labo'; }
  else if (d.aller) { ui.rappelsOuverts=false; ui.ecran='projet'; ui.onglet=d.aller; }
  else if (t.id==='b-plus-tard') ui.rappelsOuverts=false;
  else if (d.rejoindre) {
    const g = gid(d.rejoindre), ancien = groupeDe(p);
    if (S.groupesFermes || g.membres.length>=4) return;
    if (ancien) { ancien.membres = ancien.membres.filter(m=>m.p!==p); journal(p, ancien.id, 'quitte'); }
    g.membres.push({p, depuis:maintenant()}); journal(p, g.id, 'rejoint');
  }
  else if (d.quitter) { const g = gid(d.quitter); g.membres = g.membres.filter(m=>m.p!==p); journal(p, g.id, 'quitte'); }
  else if (t.id==='b-ajout-exp') { depot(groupeDe(p).id).brouillon.exps.push({desc:'',lieux:[],nb:'',duree:''}); }
  else if (d.supprExp !== undefined) { depot(groupeDe(p).id).brouillon.exps.splice(+d.supprExp,1); }
  else if (t.id==='b-envoyer') { const g=groupeDe(p), dp=depot(g.id);
    if (!dp.brouillon.prob.trim()) { alert('Il manque la problématique.'); return; }
    dp.versions.push({t:maintenant(), par:p, mots:compteMots(dp.brouillon)}); dp.statut='envoye';
    dp.fil.push({t:maintenant(), par:p, prof:false, txt:`Pré-projet envoyé (version ${dp.versions.length}).`}); journal(p, g.id, 'envoie', 'pré-projet v'+dp.versions.length); }
  else if (t.id==='b-msg') { const g=groupeDe(p), v=$('#f-msg').value.trim(); if(!v) return; depot(g.id).fil.push({t:maintenant(), par:p, prof:false, txt:v}); journal(p, g.id, 'question', ''); }
  else if (t.id==='b-journal') { const g=groupeDe(p), v=$('#j-txt').value.trim(); if(!v) return; const s=$('#j-seance').value;
    journalDe(g.id).push({t:maintenant(), seance: s==='autre'?S.date:s, par:p, lieu:$('#j-lieu').value, txt:v}); journal(p, g.id, 'journal', s); }
  // enseignant
  else if (d.ongletProf) { ui.ongletProf = d.ongletProf; }
  else if (t.id==='b-fermer') { S.groupesFermes = !S.groupesFermes; journal('M. Van Hoorde', '', S.groupesFermes?'ferme les groupes':'rouvre les groupes'); }
  else if (d.retirer) { const g=groupeDe(d.retirer); g.membres=g.membres.filter(m=>m.p!==d.retirer); journal('M. Van Hoorde', g.id, 'retire', d.retirer); }
  else if (d.ouvrirGroupe) ui.groupeOuvert = d.ouvrirGroupe;
  else if (d.fermerPanneau !== undefined) ui.groupeOuvert = null;
  else if (d.decider !== undefined) { const g=gid(ui.groupeOuvert), dp=depot(g.id), v=$('#p-com').value.trim();
    if (!v && !d.decider) return;
    if (d.decider) dp.statut = d.decider;
    dp.fil.push({t:maintenant(), par:g.prof, prof:true, txt:(d.decider==='valide'?'✅ Validé. ':d.decider==='a-revoir'?'↩ À revoir. ':'')+v});
    journal(g.prof, g.id, 'commente', d.decider?'pré-projet → '+STATUT[d.decider][0]:''); }
  else if (d.niv) { const E = noteE(d.niv); E.niv[d.i] = (E.niv[d.i]===+d.k) ? undefined : +d.k; if (E.pts) delete E.pts[d.i]; }
  else if (t.id==='c-go') { const c=ui.chrono; if (c.marche) { c.cumul += Date.now()-c.debut; c.marche=false; } else { c.debut=Date.now(); c.marche=true; } }
  else if (t.id==='c-raz') ui.chrono = {marche:false, debut:0, cumul:0};
  else if (t.id==='x-journal') telecharger('projet-journal.csv', csv([['date','qui','groupe','action','détail'],...[...S.log].sort((a,b)=>a.t<b.t?-1:1).map(l=>[l.t.replace('T',' '),l.qui,(gid(l.g)||{}).nom||'',l.a,l.d])]), 'text/csv');
  else if (t.id==='x-synthese') telecharger('projet-synthese.csv', csv([['groupe','discipline','élèves','statut pré-projet','1er envoi','versions','messages','entrées de journal','fichiers'],...S.groupes.map(g=>{const dp=depot(g.id);return [g.nom,g.disc,g.membres.map(m=>m.p).join(' '),STATUT[dp.statut][0],dp.versions[0]?.t||'',dp.versions.length,dp.fil.length,journalDe(g.id).length,fichiersDe(g.id).length];})]), 'text/csv');
  else if (t.id==='x-json') telecharger('projet-complet.json', JSON.stringify({groupes:S.groupes,depots:S.depots,journal:S.journal,fichiers:S.fichiers,labo:S.labo,notes:S.notes,evenements:S.log},null,2), 'application/json');
  else if (t.id==='x-notes') telecharger('projet-notes.csv', csv([['élève','groupe','écrit /'+MAX.ecrit,'groupe /'+MAX.autres,'oral commun /'+MAX.og,'oral individuel /'+MAX.oi,'investissement /5','total /'+MAX.total,'/20','remarques'],
      ...S.groupes.flatMap(g=>g.membres.map(m=>{ const b=bilan(m.p); return [m.p,g.nom,virg(b.ecrit),virg(b.autres),virg(b.og),virg(b.oi),virg(b.perso),virg(b.total),virg(Math.round(b.sur20*10)/10),(S.notes.e[m.p]||{}).rq||'']; }))]), 'text/csv');
  else return;
  rendre();
});

document.addEventListener('change', e => {
  const t = e.target, d = t.dataset, p = S.qui;
  if (d.labo) { const g=groupeDe(p), l=labo(g.id,d.labo); l[d.cle] = t.checked ? {t:maintenant(), par:p} : null; journal(p, g.id, t.checked?'coche':'décoche', 'labo '+d.labo+' '+d.cle); rendre(); }
  else if (d.lieu) { const g=groupeDe(p), i=+t.closest('[data-exp]').dataset.exp, e2=depot(g.id).brouillon.exps[i];
    e2.lieux = t.checked ? [...e2.lieux, d.lieu] : e2.lieux.filter(x=>x!==d.lieu); sauver(); }
  else if (d.deposer) { const f = t.files[0]; if (!f) return; const g=groupeDe(p);
    const taille = f.size > 1e6 ? virg(Math.round(f.size/1e5)/10)+' Mo' : Math.max(1,Math.round(f.size/1e3))+' Ko';
    fichiersDe(g.id).push({cat:d.deposer, nom:f.name, taille, par:p, t:maintenant()}); journal(p, g.id, 'dépose', f.name); rendre(); }
  else if (d.deplacer && t.value) { const g=groupeDe(d.deplacer), cible=gid(t.value);
    if (cible.membres.length>=4) { alert(cible.nom+' est complet.'); t.value=''; return; }
    g.membres=g.membres.filter(m=>m.p!==d.deplacer); cible.membres.push({p:d.deplacer, depuis:maintenant()}); journal('M. Van Hoorde', cible.id, 'déplace', d.deplacer+' depuis '+g.nom); rendre(); }
  else if (d.choixGroupe) { ui[d.choixGroupe] = t.value; rendre(); }
  else if (d.reglage) { S.reglages[d.reglage] = t.checked; rendre(); }
  /* setTimeout : on redessine une fois le focus passé à la case suivante (Tab), pour l'y remettre. */
  else if (d.noteG) { const id = ui.ongletProf==='oral' ? ui.oralG : ui.corrG; (S.notes.g[id] = S.notes.g[id]||{})[d.noteG] = t.value; setTimeout(rendre); }
  else if (d.pts) { const E = noteE(d.pts); E.pts = E.pts||{}; E.pts[d.i] = t.value; setTimeout(rendre); }
  else if (d.perso) { noteE(d.perso).perso[d.i] = t.value; setTimeout(rendre); }
  else if (d.rq) { noteE(d.rq).rq = t.value; sauver(); }
});

document.addEventListener('input', e => {
  const t = e.target, p = S.qui, g = p && groupeDe(p); if (!g) return;
  const b = depot(g.id).brouillon;
  if (t.dataset.f) { b[t.dataset.f] = t.value; sauver(); }
  else if (t.dataset.champ) { b.exps[+t.closest('[data-exp]').dataset.exp][t.dataset.champ] = t.value; sauver(); }
});

remplirBarre(); connexion(); rendre();
</script>
