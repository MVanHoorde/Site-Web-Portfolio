<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Animer — Diapason</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="quiz.css?v=1">
</head>
<body class="prof">
<header class="barre" id="barre">
  <a class="marque" href="animer.html" data-nom>Diapason</a>
  <span>Espace enseignant</span>
  <span class="pousse"></span>
  <a href="stats.html">Statistiques</a>
  <span id="moi"></span>
  <button class="lien-bouton" type="button" id="b-deco" hidden>Me déconnecter</button>
</header>
<div id="app"></div>

<dialog id="d-lancer">
  <form method="dialog" id="f-lancer">
    <h2 id="d-lancer-titre">Lancer</h2>
    <div class="champ"><label for="l-groupe">Groupe (facultatif)</label>
      <input id="l-groupe" maxlength="60" placeholder="ex. BTS MS 1" autocomplete="off"></div>
    <p class="note">Le nom du groupe sert à retrouver la partie dans les statistiques. Jamais de nom d'élève ici.</p>
    <label class="case"><input type="checkbox" id="l-pari"><span><b>Pari de confiance</b> — l'élève peut se déclarer sûr de lui : +25 % si c'est juste, −200 points sinon.</span></label>
    <div class="boutons">
      <button class="bouton creux petit" value="annuler" type="submit">Annuler</button>
      <button class="bouton rouge petit" value="ok" type="submit" id="l-ok">Ouvrir la partie</button>
    </div>
  </form>
</dialog>
<dialog id="d-apercu" style="max-width:min(900px,94vw)">
  <form method="dialog"><div id="apercu-corps"></div>
    <div class="boutons"><button class="bouton petit" type="submit">Fermer</button></div></form>
</dialog>

<script src="vendor/katex/katex.min.js"></script>

</body>
</html>
