<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">Dimensions : atome et noyau</title>
<desc id="desc">Schéma vectoriel éditable pour cours de physique-chimie de Seconde.</desc>
<style><![CDATA[
.bg { fill: #fdfcf8; }
.grid { stroke: #e8e4d8; stroke-width:1; opacity:.55; }
.txt { font-family: 'Space Grotesk', Arial, sans-serif; fill: #141a26; }
.mono { font-family: 'IBM Plex Mono', Consolas, monospace; fill: #141a26; }
.serif { font-family: 'Spectral', Georgia, serif; fill: #141a26; }
.title { font-family:'Space Grotesk', Arial, sans-serif; font-weight:800; letter-spacing:.04em; fill:#141a26; }
.small { font-size:14px; }
.label { font-family:'IBM Plex Mono', Consolas, monospace; font-size:13px; fill:#6b6f7a; }
.box { fill:#fffdf7; stroke:#141a26; stroke-width:2; }
.dash { stroke-dasharray:8 8; }
.beta { stroke:#1d9aaa; fill:none; } .alpha { stroke:#d6402b; fill:none; } .gamma { stroke:#4a3f9e; fill:none; } .gold { stroke:#b28a1d; fill:none; }
]]></style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" class="grid" fill="none"/></pattern>
<marker id="arrInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#141a26"/></marker>
<marker id="arrA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d6402b"/></marker>
<marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1d9aaa"/></marker>
<marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#4a3f9e"/></marker>
<marker id="arrGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#b28a1d"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/><rect width="100%" height="100%" fill="url(#grid)"/>
<text x="500" y="55" class="title" font-size="30" text-anchor="middle" >DIMENSIONS : L’ATOME EST ESSENTIELLEMENT VIDE</text>
<rect x="120" y="120" width="760" height="330" rx="18" fill="#cfe8bc" stroke="#4c8a58" stroke-width="4" class=""/>
<line x1="120" y1="120" x2="120" y2="450" stroke="#ffffff" stroke-width="2" opacity=".8"/>
<line x1="500" y1="120" x2="500" y2="450" stroke="#ffffff" stroke-width="2" opacity=".8"/>
<line x1="880" y1="120" x2="880" y2="450" stroke="#ffffff" stroke-width="2" opacity=".8"/>
<ellipse cx="500" cy="285" rx="95" ry="65" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>
<text x="500" y="470" class="mono" font-size="18" text-anchor="middle" font-weight="700" >Si le noyau avait la taille d’une balle de tennis…</text>
<circle cx="500" cy="285" r="10" fill="#f0cf6e" stroke="#b28a1d" stroke-width="2"/>
<text x="525" y="280" class="mono" font-size="15" text-anchor="start" >noyau</text>
<text x="500" y="520" class="mono" font-size="20" text-anchor="middle" font-weight="700" >… l’atome aurait la taille d’un terrain de football.</text>
<rect x="235" y="90" width="530" height="46" rx="10" fill="#fffdf7" stroke="#141a26" stroke-width="2" class=""/>
<text x="500" y="152" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="19" fill="#141a26">r(atome) ≈ 10<tspan font-size="65%" baseline-shift="30%">−10</tspan> m&#160;&#160;·&#160;&#160;r(noyau) ≈ 10<tspan font-size="65%" baseline-shift="30%">−15</tspan> m</text><text x="500" y="120" class="mono" font-size="18" text-anchor="middle" >rayon de l’atome ≈ 100 000 × rayon du noyau</text>
</svg>