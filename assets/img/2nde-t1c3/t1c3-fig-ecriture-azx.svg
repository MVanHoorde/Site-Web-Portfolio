<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Écriture conventionnelle du noyau</title>
<desc id="desc">Schéma vectoriel éditable pour cours de physique-chimie de Seconde.</desc>
<style><![CDATA[
.bg { fill: #fdfcf8; }
.grid { stroke: #e8e4d8; stroke-width:1; opacity:.55; }
.txt { font-family: 'Space Grotesk', Arial, sans-serif; fill: #141a26; }
.mono { font-family: 'IBM Plex Mono', Consolas, monospace; fill: #141a26; }
.serif { font-family: 'Spectral', Georgia, serif; fill: #141a26; }
.title { font-family:'Space Grotesk', Arial, sans-serif; font-weight:800; letter-spacing:.04em; fill:#141a26; }
.small { font-size:14px; }
.label { font-family:'IBM Plex Mono', Consolas, monospace; font-size:13px; fill:#6b6f7a; }
.box { fill:#fffdf7; stroke:#141a26; stroke-width:2; }
.dash { stroke-dasharray:8 8; }
.beta { stroke:#1d9aaa; fill:none; } .alpha { stroke:#d6402b; fill:none; } .gamma { stroke:#4a3f9e; fill:none; } .gold { stroke:#b28a1d; fill:none; }
]]></style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" class="grid" fill="none"/></pattern>
<marker id="arrInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#141a26"/></marker>
<marker id="arrA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d6402b"/></marker>
<marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1d9aaa"/></marker>
<marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#4a3f9e"/></marker>
<marker id="arrGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#b28a1d"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/><rect width="100%" height="100%" fill="url(#grid)"/>
<text x="450" y="60" class="title" font-size="34" text-anchor="middle" >ÉCRITURE CONVENTIONNELLE DU NOYAU</text>
<rect x="150" y="110" width="600" height="270" rx="18" fill="#fffdf7" stroke="#141a26" stroke-width="2.5" class=""/>
<text x="295" y="220" class="serif" font-size="72" text-anchor="middle" >A</text>
<text x="295" y="315" class="serif" font-size="72" text-anchor="middle" >Z</text>
<text x="385" y="270" class="serif" font-size="130" text-anchor="middle" font-style="italic">X</text>
<path d="M340 190 H590" stroke="#1d9aaa" stroke-width="3" marker-end="url(#arrB)"/>
<text x="610" y="196" class="mono" font-size="18" text-anchor="start" font-weight="700" >A : nombre de masse</text>
<text x="610" y="222" class="mono" font-size="15" text-anchor="start" >nombre de nucléons</text>
<path d="M335 302 H590" stroke="#d6402b" stroke-width="3" marker-end="url(#arrA)"/>
<text x="610" y="308" class="mono" font-size="18" text-anchor="start" font-weight="700" >Z : numéro atomique</text>
<text x="610" y="334" class="mono" font-size="15" text-anchor="start" >nombre de protons</text>
<text x="450" y="425" class="mono" font-size="20" text-anchor="middle" font-weight="700" >X : symbole de l’élément chimique</text>
</svg>