<rect x="545" y="130" width="280" height="70" rx="12" fill="#fffdf7" stroke="#d6402b" stroke-width="2" class=""/>
<text x="685" y="158" class="serif" font-size="30" text-anchor="middle" >Q<tspan font-size="60%" baseline-shift="-18%">noyau</tspan> = Z × e</text>
