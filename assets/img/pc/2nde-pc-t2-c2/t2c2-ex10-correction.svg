<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 455" role="img" aria-label="Correction de l'exercice 10 : sur la table horizontale, le poids P est vertical vers le bas et compense exactement la réaction du support R ; sur le plan incliné, le poids reste vertical alors que la réaction reste perpendiculaire au plan, si bien que les deux ne se compensent plus" font-family="'IBM Plex Mono', monospace">
<defs><marker id="fr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d6402b"/></marker><marker id="fb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6b70"/></marker></defs>
<rect width="900" height="455" fill="#ffffff"/>
<text x="60" y="38" font-size="19" fill="#141a26" font-weight="600">Sur une surface horizontale</text>
<rect x="60" y="300" width="300" height="12" fill="#8a5a3b"/>
<rect x="86" y="312" width="10" height="76" fill="#8a5a3b"/>
<rect x="324" y="312" width="10" height="76" fill="#8a5a3b"/>
<rect x="160" y="240" width="100" height="60" rx="4" fill="#f6c445" stroke="#c9971b" stroke-width="2"/>
<circle cx="210.0" cy="270.0" r="3.2" fill="#141a26"/>
<text x="186.0" y="275.0" font-size="16" fill="#141a26" font-style="italic">G</text>
<line x1="210.0" y1="270.0" x2="210.0" y2="165.0" stroke="#d6402b" stroke-width="3.0" marker-end="url(#fr)"/>
<text x="220.0" y="171.0" font-size="21" fill="#d6402b" font-weight="600" font-style="italic">R<tspan font-size="14" dy="5">N</tspan><tspan font-size="17" dy="-9">→</tspan></text>
<line x1="210.0" y1="270.0" x2="210.0" y2="375.0" stroke="#2f6b70" stroke-width="3.0" marker-end="url(#fb)"/>
<text x="220.0" y="371.0" font-size="21" fill="#2f6b70" font-weight="600" font-style="italic">P<tspan font-size="17" dy="-9">→</tspan></text>
<text x="60" y="412" font-size="16" fill="#141a26">Les deux forces se compensent :</text>
<text x="60" y="434" font-size="16" fill="#141a26"><tspan font-style="italic" font-weight="600">R</tspan><tspan font-size="11" dy="4">N</tspan><tspan dy="-4"> = − </tspan><tspan font-style="italic" font-weight="600">P</tspan><tspan> — le solide reste immobile.</tspan></text>
<text x="510" y="38" font-size="19" fill="#141a26" font-weight="600">Sur un plan incliné</text>
<line x1="500.0" y1="340.0" x2="860.0" y2="190.0" stroke="#8a5a3b" stroke-width="12" stroke-linecap="round"/>
<rect x="508.0" y="340.0" width="10" height="60" fill="#8a5a3b"/>
<rect x="830.0" y="196.0" width="10" height="204.0" fill="#8a5a3b"/>
<g transform="rotate(-22.6 660.0 252.0)"><rect x="608.0" y="221.0" width="104" height="62" rx="4" fill="#f6c445" stroke="#c9971b" stroke-width="2"/></g>
<circle cx="660.0" cy="252.0" r="3.2" fill="#141a26"/>
<text x="634.0" y="258.0" font-size="16" fill="#141a26" font-style="italic">G</text>
<line x1="660.0" y1="252.0" x2="700.4" y2="155.1" stroke="#d6402b" stroke-width="3.0" marker-end="url(#fr)"/>
<text x="706.4" y="157.1" font-size="21" fill="#d6402b" font-weight="600" font-style="italic">R<tspan font-size="14" dy="5">N</tspan><tspan font-size="17" dy="-9">→</tspan></text>
<line x1="660.0" y1="252.0" x2="660.0" y2="357.0" stroke="#2f6b70" stroke-width="3.0" marker-end="url(#fb)"/>
<text x="670.0" y="353.0" font-size="21" fill="#2f6b70" font-weight="600" font-style="italic">P<tspan font-size="17" dy="-9">→</tspan></text>
<line x1="660.0" y1="252.0" x2="660.0" y2="147.0" stroke="#8a8f9a" stroke-width="1.4" stroke-dasharray="5 5"/>
<path d="M 660.0 218.0 A 34 34 0 0 1 673.1 220.6" fill="none" stroke="#8a8f9a" stroke-width="1.4"/>
<text x="670.0" y="212.0" font-size="15" fill="#8a8f9a">α</text>
<text x="480" y="412" font-size="16" fill="#141a26">Le poids reste <tspan font-weight="600">vertical</tspan>, la réaction</text>
<text x="480" y="434" font-size="16" fill="#141a26">reste perpendiculaire : plus de compensation.</text>
</svg>
