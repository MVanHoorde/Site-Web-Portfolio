<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="titre desc">
<title id="titre">De l'atome de lithium à l'ion lithium</title>
<desc id="desc">L'atome de lithium 7 possède 3 protons, 4 neutrons et 3 électrons ; il perd l'électron de sa couche externe et devient l'ion lithium, qui n'en a plus que 2.</desc>
  <style>
    .t  { font-family:'IBM Plex Mono',monospace; fill:#3d4351; }
    .tt { font-family:'Space Grotesk',sans-serif; font-weight:700; fill:#141a26; }
  </style>
  <defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141a26"/></marker><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2371f"/></marker></defs>

  <!-- ═══ l'atome ═══ -->
  
    <rect x="45" y="46" width="380" height="330" rx="14" fill="#fdfcf8" stroke="#141a26" stroke-width="1.6"/>
    <text class="tt" x="235" y="76" text-anchor="middle" font-size="19">Atome de lithium  Li</text>
    <text class="t"  x="235" y="358" text-anchor="middle" font-size="15">3 p⁺ · 4 n⁰ · 3 e⁻ — électriquement neutre</text>
  <circle cx="235" cy="215" r="62" fill="none" stroke="#141a26" stroke-width="1.6" opacity=".75"/>
    <circle cx="235" cy="215" r="112" fill="none" stroke="#141a26" stroke-width="1.6" opacity=".75"/>
    <circle cx="235.0" cy="153.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="235.0" cy="277.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="314.2" cy="135.8" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
  <circle cx="235.0" cy="215.0" r="12" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="235.0" y="219.1" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="700" fill="#fff">+</text>
    <circle cx="223.0" cy="194.2" r="12" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="247.0" cy="194.2" r="12" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="247.0" y="198.3" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="700" fill="#fff">+</text>
    <circle cx="211.0" cy="215.0" r="12" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="259.0" cy="215.0" r="12" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="223.0" cy="235.8" r="12" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="223.0" y="239.9" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="700" fill="#fff">+</text>
    <circle cx="247.0" cy="235.8" r="12" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>

  <!-- l'électron qui part : zigzag depuis la couche externe, sortant du cadre -->
  <path d="M326,130 l 20,-16 l 14,18 l 22,-18 l 26,10"
        fill="none" stroke="#c2371f" stroke-width="2.6" marker-end="url(#fr)"/>
  <text class="t" x="387" y="157" text-anchor="middle" font-size="14" fill="#c2371f">perd 1 e⁻</text>

  <!-- ═══ la transformation ═══ -->
  <path d="M448,215 L512,215" stroke="#141a26" stroke-width="2.6" marker-end="url(#fl)"/>

  <!-- ═══ l'ion ═══ -->
  
    <rect x="530" y="46" width="380" height="330" rx="14" fill="#fdfcf8" stroke="#141a26" stroke-width="1.6"/>
    <text class="tt" x="720" y="76" text-anchor="middle" font-size="19">Ion lithium  Li⁺</text>
    <text class="t"  x="720" y="358" text-anchor="middle" font-size="15">3 p⁺ · 4 n⁰ · 2 e⁻ — chargé positivement</text>
  <circle cx="720" cy="215" r="62" fill="none" stroke="#141a26" stroke-width="1.6" opacity=".75"/>
    <circle cx="720" cy="215" r="112" fill="none" stroke="#141a26" stroke-width="1.6" opacity=".75"/>
    <circle cx="720.0" cy="153.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="720.0" cy="277.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
  <circle cx="720.0" cy="215.0" r="12" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="720.0" y="219.1" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="700" fill="#fff">+</text>
    <circle cx="708.0" cy="194.2" r="12" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="732.0" cy="194.2" r="12" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="732.0" y="198.3" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="700" fill="#fff">+</text>
    <circle cx="696.0" cy="215.0" r="12" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="744.0" cy="215.0" r="12" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="708.0" cy="235.8" r="12" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="708.0" y="239.9" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="13" font-weight="700" fill="#fff">+</text>
    <circle cx="732.0" cy="235.8" r="12" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>

  <g font-family="'IBM Plex Mono',monospace" font-size="15" fill="#3d4351">
      <circle cx="400" cy="424" r="9" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
      <text x="417" y="429.25">proton (+)</text>
      <circle cx="530" cy="424" r="9" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
      <text x="547" y="429.25">neutron (0)</text>
    </g>
</svg>
