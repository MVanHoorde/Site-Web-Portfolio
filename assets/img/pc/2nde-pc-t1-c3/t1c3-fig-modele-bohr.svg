<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="titre desc">
<title id="titre">Le modèle de Bohr</title>
<desc id="desc">Un noyau de protons et de neutrons, entouré d'électrons répartis sur deux couches concentriques ; un zoom montre le détail du noyau.</desc>
  <style>
    .t  { font-family:'IBM Plex Mono',monospace; fill:#3d4351; }
    .tt { font-family:'Space Grotesk',sans-serif; font-weight:700; fill:#141a26; }
  </style>
  <defs><marker id="fz" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141a26"/></marker></defs>

  <!-- l'atome : couches CONCENTRIQUES (modèle de Bohr) -->
  <circle cx="235" cy="240" r="78" fill="none" stroke="#141a26" stroke-width="1.6" opacity=".75"/>
    <circle cx="235" cy="240" r="140" fill="none" stroke="#141a26" stroke-width="1.6" opacity=".75"/>
    <circle cx="235.0" cy="162.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="235.0" cy="318.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="349.7" cy="159.7" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="349.7" cy="320.3" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="120.3" cy="320.3" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="120.3" cy="159.7" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
  <circle cx="235.0" cy="242.0" r="7" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="228.0" cy="229.9" r="7" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="242.0" cy="229.9" r="7" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="228.0" cy="254.1" r="7" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="242.0" cy="254.1" r="7" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="221.0" cy="242.0" r="7" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="249.0" cy="242.0" r="7" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="235.0" cy="217.8" r="7" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="214.0" cy="229.9" r="7" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="256.0" cy="229.9" r="7" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="214.0" cy="254.1" r="7" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="256.0" cy="254.1" r="7" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>

  <!-- légendes posées sous l'atome : elles ne croisent plus aucune couche -->
  <text class="t" x="235" y="420" text-anchor="middle" font-size="16">électrons (−) répartis sur des couches</text>
  <text class="t" x="235" y="442" text-anchor="middle" font-size="15">couche 1 : 2 électrons · couche 2 : 4 électrons</text>

  <!-- la flèche de zoom part DU NOYAU -->
  <path d="M273,232 C 390,160 440,120 479,194"
        fill="none" stroke="#141a26" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#fz)"/>
  <text class="t" x="425" y="126" text-anchor="middle" font-size="14">zoom sur le noyau</text>

  <!-- le zoom : MÊME COMPTE que le noyau de gauche -->
  <circle cx="645" cy="240" r="152" fill="#fdfcf8" stroke="#141a26" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="645.0" cy="247.5" r="26" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="645.0" y="256.3" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="27" font-weight="700" fill="#fff">+</text>
    <circle cx="619.0" cy="202.5" r="26" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="671.0" cy="202.5" r="26" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="671.0" y="211.3" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="27" font-weight="700" fill="#fff">+</text>
    <circle cx="593.0" cy="247.5" r="26" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="697.0" cy="247.5" r="26" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="697.0" y="256.3" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="27" font-weight="700" fill="#fff">+</text>
    <circle cx="619.0" cy="292.5" r="26" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="671.0" cy="292.5" r="26" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="671.0" y="301.4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="27" font-weight="700" fill="#fff">+</text>
    <circle cx="645.0" cy="157.4" r="26" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="567.0" cy="202.5" r="26" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="567.0" y="211.3" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="27" font-weight="700" fill="#fff">+</text>
    <circle cx="723.0" cy="202.5" r="26" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="567.0" cy="292.5" r="26" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="567.0" y="301.4" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="27" font-weight="700" fill="#fff">+</text>
    <circle cx="723.0" cy="292.5" r="26" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
  <text class="tt" x="645" y="72" text-anchor="middle" font-size="18">Le noyau</text>
  <text class="t"  x="645" y="422" text-anchor="middle" font-size="16">6 protons + 6 neutrons = 12 nucléons</text>

  <g font-family="'IBM Plex Mono',monospace" font-size="15" fill="#3d4351">
      <circle cx="40" cy="36" r="9" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
      <text x="57" y="41.25">proton (+)</text>
      <circle cx="170" cy="36" r="9" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
      <text x="187" y="41.25">neutron (0)</text>
    </g>
</svg>
