<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Classification périodique simplifiée</title>
<desc id="desc">Schéma vectoriel éditable pour cours de physique-chimie de Seconde.</desc>
<style><![CDATA[
.bg { fill: #fdfcf8; }
