<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="titre desc">
<title id="titre">Les dimensions de l'atome, à l'échelle d'un terrain de football</title>
<desc id="desc">Si l'atome avait la taille d'un terrain de football, son noyau serait une bille de stylo de 0,5 millimètre posée au centre : l'atome est essentiellement vide.</desc>
  <style>
    .t  { font-family:'IBM Plex Mono',monospace; fill:#3d4351; }
    .tt { font-family:'Space Grotesk',sans-serif; font-weight:700; fill:#141a26; }
  </style>
  <defs><marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141a26"/></marker><marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2371f"/></marker></defs>

  <!-- le cadre d'information contient ses DEUX lignes, et reste au-dessus du terrain -->
  <rect x="140" y="36" width="720" height="120" rx="12" fill="#fdfcf8" stroke="#141a26" stroke-width="1.8"/>
  <text class="tt" x="500" y="70" text-anchor="middle" font-size="19">L'atome est essentiellement vide</text>
  <text class="t"  x="500" y="100" text-anchor="middle" font-size="16">rayon de l'atome ≈ 10<tspan dy="-6" font-size="11">−10</tspan><tspan dy="6" font-size="16"> m  ·  rayon du noyau ≈ 10</tspan><tspan dy="-6" font-size="11">−15</tspan><tspan dy="6" font-size="16"> m</tspan></text>
  <text class="t"  x="500" y="128" text-anchor="middle" font-size="16">l'atome est donc 100 000 fois plus grand que son noyau</text>

  <!-- le terrain : rectangle, ligne médiane, rond central -->
  <rect x="120" y="190" width="760" height="380" rx="4" fill="#eaf1e6" stroke="#5c7a52" stroke-width="2.4"/>
  <circle cx="500" cy="380" r="164" fill="none" stroke="#5c7a52" stroke-width="1.8" stroke-dasharray="6 5"/>

  <!-- le noyau : un point, à peine visible — c'est le message -->
  <circle cx="500" cy="380" r="2" fill="#c2371f"/>
  <path d="M608,454 L512,388" fill="none" stroke="#c2371f" stroke-width="1.6" marker-end="url(#fn)"/>
  <text class="tt" x="614" y="464" font-size="15" fill="#c2371f">le noyau</text>
  <text class="t"  x="614" y="484" font-size="13" fill="#c2371f">point grossi : à cette échelle</text>
  <text class="t"  x="614" y="501" font-size="13" fill="#c2371f">il ferait 1 mm sur 105 m</text>

  <!-- le rayon, quantifié : « 50 mètres » (restitué de la source) -->
  <path d="M500,380 L336,380" fill="none" stroke="#141a26" stroke-width="2" marker-end="url(#fr)"/>
  <text class="t" x="418" y="368" text-anchor="middle" font-size="15">50 mètres</text>

  <!-- le repère « Électron », en bord de cercle (restitué de la source) -->
  <circle cx="383.56" cy="263.56" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.2"/>
  <text class="t" x="371.56" y="249.56" text-anchor="end" font-size="14" fill="#1d6fa5">électron</text>

  <!-- l'analogie, chiffrée (restituée de la source) -->
  <text class="t" x="500" y="600" text-anchor="middle" font-size="15">Noyau = une bille de stylo de 0,5 mm, posée au centre d'un terrain de 105 mètres</text>
</svg>
