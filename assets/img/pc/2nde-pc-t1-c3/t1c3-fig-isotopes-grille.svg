<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="titre desc">
<title id="titre">Les isotopes du carbone, de l'azote et de l'oxygène</title>
<desc id="desc">Chaque ligne rassemble les isotopes d'un même élément : le numéro atomique Z ne change pas, seul le nombre de masse A varie, donc le nombre de neutrons.</desc>
  <style>
    .t  { font-family:'IBM Plex Mono',monospace; fill:#3d4351; }
    .tt { font-family:'Space Grotesk',sans-serif; font-weight:700; fill:#141a26; }
  </style>
  <defs>
    <marker id="fh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d9aaa"/></marker>
    <marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2371f"/></marker>
  </defs>

  <text class="tt" x="450" y="52" text-anchor="middle" font-size="24">Isotopes : même Z, nombre de neutrons différent</text>

  <g>
    <text class="tt" x="210" y="151" text-anchor="end" font-size="15">Oxygène</text>
    <rect x="232" y="108" width="148" height="76" rx="8" fill="#f7d9d4" stroke="#c2371f" stroke-width="1.6"/>
      <text class="t" x="298" y="141"  text-anchor="end" font-size="15">16</text>
      <text class="t" x="298" y="161" text-anchor="end" font-size="15">8</text>
      <text x="304" y="159" font-family="'Spectral',serif" font-size="34" fill="#141a26">O</text>
    <rect x="392" y="108" width="148" height="76" rx="8" fill="#f7d9d4" stroke="#c2371f" stroke-width="1.6"/>
      <text class="t" x="458" y="141"  text-anchor="end" font-size="15">17</text>
      <text class="t" x="458" y="161" text-anchor="end" font-size="15">8</text>
      <text x="464" y="159" font-family="'Spectral',serif" font-size="34" fill="#141a26">O</text>
    <rect x="552" y="108" width="148" height="76" rx="8" fill="#f7d9d4" stroke="#c2371f" stroke-width="1.6"/>
      <text class="t" x="618" y="141"  text-anchor="end" font-size="15">18</text>
      <text class="t" x="618" y="161" text-anchor="end" font-size="15">8</text>
      <text x="624" y="159" font-family="'Spectral',serif" font-size="34" fill="#141a26">O</text>
  </g>
  <g>
    <text class="tt" x="210" y="239" text-anchor="end" font-size="15">Azote</text>
    <rect x="232" y="196" width="148" height="76" rx="8" fill="#d9ead9" stroke="#2f7d4f" stroke-width="1.6"/>
      <text class="t" x="298" y="229"  text-anchor="end" font-size="15">13</text>
      <text class="t" x="298" y="249" text-anchor="end" font-size="15">7</text>
      <text x="304" y="247" font-family="'Spectral',serif" font-size="34" fill="#141a26">N</text>
    <rect x="392" y="196" width="148" height="76" rx="8" fill="#d9ead9" stroke="#2f7d4f" stroke-width="1.6"/>
      <text class="t" x="458" y="229"  text-anchor="end" font-size="15">14</text>
      <text class="t" x="458" y="249" text-anchor="end" font-size="15">7</text>
      <text x="464" y="247" font-family="'Spectral',serif" font-size="34" fill="#141a26">N</text>
    <rect x="552" y="196" width="148" height="76" rx="8" fill="#d9ead9" stroke="#2f7d4f" stroke-width="1.6"/>
      <text class="t" x="618" y="229"  text-anchor="end" font-size="15">15</text>
      <text class="t" x="618" y="249" text-anchor="end" font-size="15">7</text>
      <text x="624" y="247" font-family="'Spectral',serif" font-size="34" fill="#141a26">N</text>
  </g>
  <g>
    <text class="tt" x="210" y="327" text-anchor="end" font-size="15">Carbone</text>
    <rect x="232" y="284" width="148" height="76" rx="8" fill="#d4e4f2" stroke="#1d6fa5" stroke-width="1.6"/>
      <text class="t" x="298" y="317"  text-anchor="end" font-size="15">12</text>
      <text class="t" x="298" y="337" text-anchor="end" font-size="15">6</text>
      <text x="304" y="335" font-family="'Spectral',serif" font-size="34" fill="#141a26">C</text>
    <rect x="392" y="284" width="148" height="76" rx="8" fill="#d4e4f2" stroke="#1d6fa5" stroke-width="1.6"/>
      <text class="t" x="458" y="317"  text-anchor="end" font-size="15">13</text>
      <text class="t" x="458" y="337" text-anchor="end" font-size="15">6</text>
      <text x="464" y="335" font-family="'Spectral',serif" font-size="34" fill="#141a26">C</text>
    <rect x="552" y="284" width="148" height="76" rx="8" fill="#d4e4f2" stroke="#1d6fa5" stroke-width="1.6"/>
      <text class="t" x="618" y="317"  text-anchor="end" font-size="15">14</text>
      <text class="t" x="618" y="337" text-anchor="end" font-size="15">6</text>
      <text x="624" y="335" font-family="'Spectral',serif" font-size="34" fill="#141a26">C</text>
  </g>

  <!-- flèche verticale : d'une ligne à l'autre, l'élément change -->
  <path d="M150,360 L150,102" fill="none" stroke="#c2371f" stroke-width="2.6" marker-end="url(#fv)"/>
  <!-- flèche horizontale : le long d'une ligne, le nombre de neutrons varie -->
  <path d="M232,382 L700,382" fill="none" stroke="#1d9aaa" stroke-width="2.6" marker-end="url(#fh)"/>

  <!-- les deux légendes sont posées SOUS la figure : aucun trait ne les traverse -->
  <g>
    <path d="M78,428 L110,428" stroke="#1d9aaa" stroke-width="2.6" marker-end="url(#fh)"/>
    <text class="t" x="124" y="433" font-size="15">le long d'une ligne : le nombre de neutrons varie — ce sont des isotopes</text>
    <path d="M78,460 L110,460" stroke="#c2371f" stroke-width="2.6" marker-end="url(#fv)"/>
    <text class="t" x="124" y="465" font-size="15">d'une ligne à l'autre : l'élément change, car Z change</text>
  </g>

  <text class="t" x="450" y="500" text-anchor="middle" font-size="15" font-style="italic">des isotopes sont des « sosies » : même élément, mais pas la même masse</text>
</svg>
