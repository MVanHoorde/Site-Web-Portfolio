<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">Élément chimique : même numéro atomique</title>
<desc id="desc">Schéma vectoriel éditable pour cours de physique-chimie de Seconde.</desc>
<style><![CDATA[
.bg { fill: #fdfcf8; }
.grid { stroke: #e8e4d8; stroke-width:1; opacity:.55; }
.txt { font-family: 'Space Grotesk', Arial, sans-serif; fill: #141a26; }
.mono { font-family: 'IBM Plex Mono', Consolas, monospace; fill: #141a26; }
.serif { font-family: 'Spectral', Georgia, serif; fill: #141a26; }
.title { font-family:'Space Grotesk', Arial, sans-serif; font-weight:800; letter-spacing:.04em; fill:#141a26; }
.small { font-size:14px; }
.label { font-family:'IBM Plex Mono', Consolas, monospace; font-size:13px; fill:#6b6f7a; }
.box { fill:#fffdf7; stroke:#141a26; stroke-width:2; }
.dash { stroke-dasharray:8 8; }
.beta { stroke:#1d9aaa; fill:none; } .alpha { stroke:#d6402b; fill:none; } .gamma { stroke:#4a3f9e; fill:none; } .gold { stroke:#b28a1d; fill:none; }
]]></style>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" class="grid" fill="none"/></pattern>
<marker id="arrInk" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#141a26"/></marker>
<marker id="arrA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d6402b"/></marker>
<marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1d9aaa"/></marker>
<marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#4a3f9e"/></marker>
<marker id="arrGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#b28a1d"/></marker>
</defs>
<rect class="bg" width="100%" height="100%"/><rect width="100%" height="100%" fill="url(#grid)"/>
<text x="450" y="55" class="title" font-size="30" text-anchor="middle" >ÉLÉMENT CHIMIQUE : MÊME NUMÉRO ATOMIQUE Z</text>
<circle cx="140" cy="205" r="70" fill="#fffdf7" stroke="#1d9aaa" stroke-width="3"/>
<text x="140" y="197" class="serif" font-size="32" text-anchor="middle" font-weight="700" >⁵⁶₂₆Fe</text>
<text x="140" y="233" class="mono" font-size="14" text-anchor="middle" >Noyau</text>
<path d="M215 205 H265" stroke="#141a26" stroke-width="3" marker-end="url(#arrInk)"/>
<circle cx="340" cy="205" r="70" fill="#fffdf7" stroke="#1d9aaa" stroke-width="3"/>
<text x="340" y="197" class="serif" font-size="32" text-anchor="middle" font-weight="700" >Fe</text>
<text x="340" y="233" class="mono" font-size="14" text-anchor="middle" >Atome</text>
<path d="M415 205 H465" stroke="#141a26" stroke-width="3" marker-end="url(#arrInk)"/>
<circle cx="540" cy="205" r="70" fill="#fffdf7" stroke="#1d9aaa" stroke-width="3"/>
<text x="540" y="197" class="serif" font-size="32" text-anchor="middle" font-weight="700" >Fe²⁺</text>
<text x="540" y="233" class="mono" font-size="14" text-anchor="middle" >Ion fer II</text>
<path d="M615 205 H665" stroke="#141a26" stroke-width="3" marker-end="url(#arrInk)"/>
<circle cx="740" cy="205" r="70" fill="#fffdf7" stroke="#1d9aaa" stroke-width="3"/>
<text x="740" y="197" class="serif" font-size="32" text-anchor="middle" font-weight="700" >Fe³⁺</text>
<text x="740" y="233" class="mono" font-size="14" text-anchor="middle" >Ion fer III</text>
<rect x="205" y="345" width="490" height="70" rx="12" fill="#fffdf7" stroke="#b28a1d" stroke-width="2" class=""/>
<text x="450" y="377" class="mono" font-size="20" text-anchor="middle" font-weight="700" >Même Z = 26  →  même élément chimique</text>
</svg>