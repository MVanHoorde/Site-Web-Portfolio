<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="titre desc">
<title id="titre">L'élément chimique rassemble plusieurs entités</title>
<desc id="desc">Autour de l'élément fer, de numéro atomique 26, coexistent le noyau, l'atome et les ions fer II et fer III ; il en va de même pour l'élément cuivre, de numéro atomique 29.</desc>
  <style>
    .t  { font-family:'IBM Plex Mono',monospace; fill:#3d4351; }
    .tt { font-family:'Space Grotesk',sans-serif; font-weight:700; fill:#141a26; }
  </style>
  <text class="tt" x="480" y="34" text-anchor="middle" font-size="19">Un élément chimique = toutes les entités de même Z</text>
  
    <circle cx="240" cy="218" r="50" fill="#fdfcf8" stroke="#c2371f" stroke-width="2.4"/>
    <text class="tt" x="240" y="212" text-anchor="middle" font-size="17">Fer</text>
    <text class="t"  x="240" y="234" text-anchor="middle" font-size="14" fill="#c2371f">Z = 26</text>
    <line x1="240" y1="166" x2="240" y2="126" stroke="#c2371f" stroke-width="1.6" opacity=".65"/>
    <text class="tt" x="240" y="91" text-anchor="middle" font-size="17">Fe</text>
    <text class="t"  x="240" y="112" text-anchor="middle" font-size="12">l'atome</text>
    <line x1="292" y1="218" x2="332" y2="218" stroke="#c2371f" stroke-width="1.6" opacity=".65"/>
    <text class="tt" x="372" y="223" text-anchor="middle" font-size="17">Fe²⁺</text>
    <text class="t"  x="372" y="244" text-anchor="middle" font-size="12">l'ion fer II</text>
    <line x1="240" y1="270" x2="240" y2="310" stroke="#c2371f" stroke-width="1.6" opacity=".65"/>
    <text class="tt" x="240" y="355" text-anchor="middle" font-size="17">Fe³⁺</text>
    <text class="t"  x="240" y="376" text-anchor="middle" font-size="12">l'ion fer III</text>
    <line x1="188" y1="218" x2="148" y2="218" stroke="#c2371f" stroke-width="1.6" opacity=".65"/>
    
    <text class="t" x="100.86" y="213.24000000000004" text-anchor="end" font-size="10">56</text>
    <text class="t" x="100.86" y="224.12000000000003" text-anchor="end" font-size="10">26</text>
    <text class="tt" x="102.9" y="223.78000000000003" font-size="17">Fe</text>
    <text class="t"  x="108" y="244" text-anchor="middle" font-size="12">le noyau</text>
  
    <circle cx="720" cy="218" r="50" fill="#fdfcf8" stroke="#8a5a1f" stroke-width="2.4"/>
    <text class="tt" x="720" y="212" text-anchor="middle" font-size="17">Cuivre</text>
    <text class="t"  x="720" y="234" text-anchor="middle" font-size="14" fill="#8a5a1f">Z = 29</text>
    <line x1="720" y1="166" x2="720" y2="126" stroke="#8a5a1f" stroke-width="1.6" opacity=".65"/>
    <text class="tt" x="720" y="91" text-anchor="middle" font-size="17">Cu</text>
    <text class="t"  x="720" y="112" text-anchor="middle" font-size="12">l'atome</text>
    <line x1="772" y1="218" x2="812" y2="218" stroke="#8a5a1f" stroke-width="1.6" opacity=".65"/>
    <text class="tt" x="852" y="223" text-anchor="middle" font-size="17">Cu²⁺</text>
    <text class="t"  x="852" y="244" text-anchor="middle" font-size="12">l'ion cuivre II</text>
    <line x1="720" y1="270" x2="720" y2="310" stroke="#8a5a1f" stroke-width="1.6" opacity=".65"/>
    <text class="tt" x="720" y="355" text-anchor="middle" font-size="17">Cu⁺</text>
    <text class="t"  x="720" y="376" text-anchor="middle" font-size="12">l'ion cuivre I</text>
    <line x1="668" y1="218" x2="628" y2="218" stroke="#8a5a1f" stroke-width="1.6" opacity=".65"/>
    
    <text class="t" x="580.86" y="213.24000000000004" text-anchor="end" font-size="10">63</text>
    <text class="t" x="580.86" y="224.12000000000003" text-anchor="end" font-size="10">29</text>
    <text class="tt" x="582.9" y="223.78000000000003" font-size="17">Cu</text>
    <text class="t"  x="588" y="244" text-anchor="middle" font-size="12">le noyau</text>
</svg>
