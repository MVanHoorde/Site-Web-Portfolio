<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="titre desc">
<title id="titre">Les charges électriques dans l'atome</title>
<desc id="desc">Le noyau porte la charge positive plus Z fois e, le cortège électronique la charge opposée moins Z fois e ; la somme des deux est nulle, l'atome est électriquement neutre.</desc>
  <style>
    .t  { font-family:'IBM Plex Mono',monospace; fill:#3d4351; }
    .tt { font-family:'Space Grotesk',sans-serif; font-weight:700; fill:#141a26; }
  </style>
  <defs><marker id="fp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6402b"/></marker><marker id="fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fa5"/></marker></defs>

  <!-- l'atome : couches concentriques, noyau montrant protons ET neutrons -->
  <circle cx="275" cy="250" r="92" fill="none" stroke="#141a26" stroke-width="1.6" opacity=".75"/>
    <circle cx="275" cy="250" r="158" fill="none" stroke="#141a26" stroke-width="1.6" opacity=".75"/>
    <circle cx="275.0" cy="158.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="275.0" cy="342.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="411.8" cy="171.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="411.8" cy="329.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="138.2" cy="329.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
    <circle cx="138.2" cy="171.0" r="6" fill="#1d6fa5" stroke="#141a26" stroke-width="1.3"/>
  <circle cx="275.0" cy="252.6" r="9" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="275.0" y="255.7" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" font-weight="700" fill="#fff">+</text>
    <circle cx="266.0" cy="237.0" r="9" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="284.0" cy="237.0" r="9" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="284.0" y="240.1" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" font-weight="700" fill="#fff">+</text>
    <circle cx="257.0" cy="252.6" r="9" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="293.0" cy="252.6" r="9" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="293.0" y="255.7" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" font-weight="700" fill="#fff">+</text>
    <circle cx="266.0" cy="268.2" r="9" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="284.0" cy="268.2" r="9" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="284.0" y="271.2" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" font-weight="700" fill="#fff">+</text>
    <circle cx="275.0" cy="221.4" r="9" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="248.0" cy="237.0" r="9" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="248.0" y="240.1" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" font-weight="700" fill="#fff">+</text>
    <circle cx="302.0" cy="237.0" r="9" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
    <circle cx="248.0" cy="268.2" r="9" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
    <text x="248.0" y="271.2" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="9" font-weight="700" fill="#fff">+</text>
    <circle cx="302.0" cy="268.2" r="9" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>

  <!-- +Ze : annotation du noyau -->
  <path d="M425,118 L309,224" fill="none" stroke="#d6402b" stroke-width="2.2" marker-end="url(#fp)"/>
  <text class="tt" x="451" y="112" font-size="22" fill="#d6402b">+ Z × e</text>
  <text class="t"  x="451" y="134" font-size="13" fill="#d6402b">charge du noyau</text>

  <!-- −Ze : annotation du cortège -->
  <path d="M425,398 L412.46000000000004,329" fill="none" stroke="#1d6fa5" stroke-width="2.2" marker-end="url(#fe)"/>
  <text class="tt" x="451" y="404" font-size="22" fill="#1d6fa5">− Z × e</text>
  <text class="t"  x="451" y="426" font-size="13" fill="#1d6fa5">charge du cortège</text>

  
  <rect x="560" y="60" width="360" height="118" rx="12" fill="#fdfcf8" stroke="#d6402b" stroke-width="2.2"/>
  <text class="t"  x="740" y="90" text-anchor="middle" font-size="15" fill="#d6402b">Charge du noyau</text>
  <text class="tt" x="740" y="128" text-anchor="middle" font-size="26">Q<tspan dy="7.8" font-size="17">noyau</tspan><tspan dy="-7.8" font-size="26"> = Z × e</tspan></text>
  <text class="t"  x="740" y="156" text-anchor="middle" font-size="14">Z protons, chacun portant + e</text>
  
  <rect x="560" y="208" width="360" height="118" rx="12" fill="#fdfcf8" stroke="#1d6fa5" stroke-width="2.2"/>
  <text class="t"  x="740" y="238" text-anchor="middle" font-size="15" fill="#1d6fa5">Charge du cortège électronique</text>
  <text class="tt" x="740" y="276" text-anchor="middle" font-size="26">Q<tspan dy="7.8" font-size="17">électrons</tspan><tspan dy="-7.8" font-size="26"> = − Q</tspan><tspan dy="7.8" font-size="17">noyau</tspan></text>
  <text class="t"  x="740" y="304" text-anchor="middle" font-size="14">autant d'électrons que de protons</text>

  <!-- le bilan, restitué de la source 2025/2026 -->
  <rect x="60" y="452" width="860" height="82" rx="12" fill="#f4f7f4" stroke="#2f7d4f" stroke-width="2.4"/>
  <text class="tt" x="490" y="500" text-anchor="middle" font-size="27" fill="#1d4b2c">Q(atome) = Q(cortège) + Q(noyau) = (− Z × e) + (+ Z × e) = 0</text>
  <text class="t"  x="490" y="522" text-anchor="middle" font-size="14" fill="#2f7d4f">autant de charges « − » que de charges « + » : l'atome est électriquement neutre</text>

  <g font-family="'IBM Plex Mono',monospace" font-size="14" fill="#3d4351">
      <circle cx="62" cy="60" r="9" fill="#d6402b" stroke="#141a26" stroke-width="1.4"/>
      <text x="79" y="64.9">proton (+)</text>
      <circle cx="192" cy="60" r="9" fill="#b9bec9" stroke="#141a26" stroke-width="1.4"/>
      <text x="209" y="64.9">neutron (0)</text>
    </g>
</svg>
