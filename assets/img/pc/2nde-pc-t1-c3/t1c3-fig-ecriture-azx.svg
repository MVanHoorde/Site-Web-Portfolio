<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-labelledby="titre desc">
<title id="titre">L'écriture conventionnelle du noyau</title>
<desc id="desc">Le symbole de l'élément X est précédé du nombre de masse A en haut et du numéro atomique Z en bas.</desc>
  <style>
    .t  { font-family:'IBM Plex Mono',monospace; fill:#3d4351; }
    .tt { font-family:'Space Grotesk',sans-serif; font-weight:700; fill:#141a26; }
  </style>
  <defs><marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d9aaa"/></marker><marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2371f"/></marker><marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d4351"/></marker></defs>

  <!-- la notation, en gros -->
  <text x="574" y="151" text-anchor="middle" font-size="52" font-family="'IBM Plex Mono',monospace" fill="#1d9aaa" font-weight="700">A</text>
  <text x="574" y="219" text-anchor="middle" font-size="52" font-family="'IBM Plex Mono',monospace" fill="#c2371f" font-weight="700">Z</text>
  <text x="660" y="201" text-anchor="middle" font-size="104" font-family="'Spectral',serif" font-style="italic" fill="#141a26">X</text>

  <!-- légendes à GAUCHE : plus aucune flèche ne traverse le X -->
  <text class="tt" x="40" y="66" font-size="17" fill="#1d9aaa">A — nombre de masse</text>
  <text class="t"  x="40" y="90" font-size="14">nombre total de nucléons</text>
  <text class="t"  x="40" y="110" font-size="14">(protons + neutrons)</text>
  <path d="M330,80 L538,135" fill="none" stroke="#1d9aaa" stroke-width="2.4" marker-end="url(#f1)"/>

  <text class="tt" x="40" y="232" font-size="17" fill="#c2371f">Z — numéro atomique</text>
  <text class="t"  x="40" y="256" font-size="14">nombre de protons</text>
  <path d="M330,246 L538,205" fill="none" stroke="#c2371f" stroke-width="2.4" marker-end="url(#f2)"/>

  <text class="tt" x="660" y="295" text-anchor="middle" font-size="17">X — symbole de l'élément</text>
  <path d="M660,273 L660,231" fill="none" stroke="#3d4351" stroke-width="2.4" marker-end="url(#f3)"/>
</svg>
